name: ServiceIT B2B future card REAL VPS READONLY readiness
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-future-card-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_FUTURE_CARD_READINESS_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline check exact audited script syntax and source digests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_future_card_readiness.py
          python -m py_compile leadpilot/serviceit_b2b_dossier_v11.py
          python -m py_compile leadpilot/serviceit_vps_b2b_dossier_v11_worker.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/future-b2b"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/future-b2b/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/future-b2b/hosts"
          chmod 0600 "$RUNNER_TEMP/future-b2b/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/future-b2b/hosts" >/dev/null
      - name: Audit actual 5 minute poll, source gates, CRM proof and in-memory V11 report
        shell: bash
        run: |
          set -euo pipefail
          hash1="$(sha256sum leadpilot/serviceit_b2b_dossier_v11.py | cut -d' ' -f1)"
          hash2="$(sha256sum leadpilot/serviceit_vps_b2b_dossier_v11_worker.py | cut -d' ' -f1)"
          [[ "$hash1" =~ ^[a-f0-9]{64}$ && "$hash2" =~ ^[a-f0-9]{64}$ ]]
          set +e
          ssh -T -i "$RUNNER_TEMP/future-b2b/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/future-b2b/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - '$hash1' '$hash2'" \
            < ops/serviceit_vps_b2b_future_card_readiness.py \
            > "$RUNNER_TEMP/future-b2b/status"
          rc=$?
          set -e
          # Whitelist aggregate status only: never print original CRM/customer
          # content, signed notices, tokens, URLs, names, or card IDs.
          grep -E '^FUTURE_B2B_[A-Z0-9_]+=(YES|NO|UNKNOWN|NOT_OBSERVED|[0-9]{1,4})$' \
            "$RUNNER_TEMP/future-b2b/status" | head -35 || true
          [[ "$rc" == 0 ]]
          grep -qx 'FUTURE_B2B_READINESS=YES' "$RUNNER_TEMP/future-b2b/status"
