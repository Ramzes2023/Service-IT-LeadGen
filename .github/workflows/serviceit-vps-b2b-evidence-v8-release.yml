name: ServiceIT B2B V8 RouterAI only guarded live release
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-evidence-v8-live-release
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_EVIDENCE_V8_RELEASE_368'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compile reviewed source and pin VPS SSH identity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_evidence_v8_activate.py
          python -m py_compile \
            leadpilot/serviceit_b2b_routerai_deep.py
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]{7,16}$ ]]
          install -d -m 0700 "$RUNNER_TEMP/serviceit-contacts"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-contacts/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-contacts/known_hosts"
          chmod 0600 "$RUNNER_TEMP/serviceit-contacts/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/serviceit-contacts/known_hosts" >/dev/null
      - name: Stage one RouterAI source module and deployment script
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-contacts/known_hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          dest="$VPS_USER@$VPS_HOST"
          target="serviceit/staging/b2b-evidence-v8-$GITHUB_RUN_ID"
          names=(serviceit_b2b_routerai_deep.py)
          # The INN V8 release already installed the newest public research module.
          # Patch RouterAI only. Never revert the concurrent buyer/INN fixes.
          git cat-file -e 0655587324289efdede8860fdf69e07a25bf5477^{commit}
          git diff --quiet 0655587324289efdede8860fdf69e07a25bf5477 HEAD -- \
            leadpilot/serviceit_b2b_routerai_deep.py
          # Independent running-container SHA attestations: owner-only
          # read-only VPS run #42869749111. Reject any competing live edits.
          printf '%s\n' \
            '54690407408513d3430ac9ea57b90eb4bb7cd9a6eac390e8d869fed68a7f07c3' \
            > "$RUNNER_TEMP/serviceit-contacts/old-shas"
          : > "$RUNNER_TEMP/serviceit-contacts/shas"
          for name in "${names[@]}"; do
            sha256sum "leadpilot/$name" | cut -d ' ' -f 1 \
              >> "$RUNNER_TEMP/serviceit-contacts/shas"
          done
          sha256sum ops/serviceit_vps_b2b_evidence_v8_activate.py | cut -d ' ' -f 1 \
            > "$RUNNER_TEMP/serviceit-contacts/script-sha"
          ssh -T -i "$RUNNER_TEMP/serviceit-contacts/id" "${opts[@]}" "$dest" \
            "umask 077; install -d -m 0700 '$target'"
          for name in "${names[@]}"; do
            scp -i "$RUNNER_TEMP/serviceit-contacts/id" "${opts[@]}" \
              "leadpilot/$name" "$dest:$target/$name"
          done
          scp -i "$RUNNER_TEMP/serviceit-contacts/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_evidence_v8_activate.py "$dest:$target/activate.py"
      - name: Guarded offline image overlay, rollback and safe status
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-contacts/known_hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t shas < "$RUNNER_TEMP/serviceit-contacts/shas"
          mapfile -t oldshas < "$RUNNER_TEMP/serviceit-contacts/old-shas"
          [[ "${#shas[@]}" == 1 && "${#oldshas[@]}" == 1 ]]
          scriptsha="$(cat "$RUNNER_TEMP/serviceit-contacts/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          checked=()
          for value in "${oldshas[@]}"; do
            [[ "$value" == MISSING || "$value" =~ ^[a-f0-9]{64}$ ]]
            checked+=("'$value'")
          done
          for value in "${shas[@]}"; do
            [[ "$value" =~ ^[a-f0-9]{64}$ ]]
            checked+=("'$value'")
          done
          remote="bash -s -- '$GITHUB_RUN_ID' '$scriptsha' ${checked[*]}"
          set +e
          ssh -T -i "$RUNNER_TEMP/serviceit-contacts/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" "$remote" \
            > "$RUNNER_TEMP/serviceit-contacts/status" <<'REMOTE'
          set -euo pipefail
          runid="$1"; scriptsha="$2"; shift 2
          [[ "$runid" =~ ^[0-9]{7,16}$ && "$scriptsha" =~ ^[a-f0-9]{64}$ && "$#" == 2 ]]
          for digest in "$@"; do
            [[ "$digest" == MISSING || "$digest" =~ ^[a-f0-9]{64}$ ]]
          done
          script="$HOME/serviceit/staging/b2b-evidence-v8-$runid/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$scriptsha" "$script" | sha256sum --check --status
          python3 "$script" "$runid" "$@"
          REMOTE
          remote_rc=$?
          set -e
          safe="$(grep -E '^B2B_EVIDENCE_V8_[A-Z0-9_]+=(YES|NO|FAILED|NOT_NEEDED|READY_FOR_FIVE_MINUTE_WORKER)$' "$RUNNER_TEMP/serviceit-contacts/status" 2>/dev/null | head -35 || true)"
          if [[ -n "$safe" ]]; then printf '%s\n' "$safe"; else echo "B2B_EVIDENCE_V8_STATUS_ABSENT=YES"; fi
          [[ "$remote_rc" == 0 ]]
          grep -qx 'B2B_EVIDENCE_V8_VPS_LIVE_ENABLED=YES' "$RUNNER_TEMP/serviceit-contacts/status"
      - name: Write sanitized outcome to project issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/serviceit-contacts/status"
          safe="$(grep -E '^B2B_EVIDENCE_V8_[A-Z0-9_]+=(YES|NO|FAILED|NOT_NEEDED|READY_FOR_FIVE_MINUTE_WORKER)$' "$file" 2>/dev/null | head -35 || true)"
          [[ -n "$safe" ]] || safe='B2B_EVIDENCE_V8_VPS_ACTIVATION_UNVERIFIED=YES'
          body="$(printf 'B2B V8 RouterAI-only release after INN V8 (preserved):\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nOnly core container, no source/auxiliary restarts and no CRM writes by deploy. Readback separately; V8 does not replay completed V4 AI receipt.' "$safe" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/368/comments" -X POST --raw-field "body=$body" >/dev/null || true
