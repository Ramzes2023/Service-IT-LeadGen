name: ServiceIT free public B2B source VPS readiness READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-vps-free-public-source-readonly
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_FREE_SOURCE_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate current source and pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_free_source_readonly.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/free-source-audit"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/free-source-audit/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/free-source-audit/hosts"
          chmod 0600 "$RUNNER_TEMP/free-source-audit/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/free-source-audit/hosts" >/dev/null

      - name: Inspect module SHAs and mounted key presence, no DB or CRM
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          paths=(
            leadpilot/serviceit_b2b_free_public_fallback.py
            leadpilot/serviceit_b2b_remote_public_fetch.py
            leadpilot/serviceit_b2b_public_fact_extractor.py
            leadpilot/serviceit_vps_b2b_deep_research.py
          )
          shas=()
          for path in "${paths[@]}"; do
            [[ -f "$path" ]]
            h="$(sha256sum "$path" | cut -d' ' -f1)"
            [[ "$h" =~ ^[0-9a-f]{64}$ ]]
            shas+=("$h")
          done
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/free-source-audit/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/free-source-audit/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - ${shas[*]}" \
            < ops/serviceit_vps_b2b_free_source_readonly.py \
            > "$RUNNER_TEMP/free-source-audit/status" 2>/dev/null
          result=$?
          set -e
          grep -E '^FREE_SOURCE_(CODE|KEY|ENABLED|TENDEM_PERMISSION|B2B_PERMISSION|WRITER)=[A-Z0-9_]+$' \
            "$RUNNER_TEMP/free-source-audit/status" | head -6 || true
          [[ "$result" == 0 ]]
          grep -qx 'FREE_SOURCE_WRITER=NO' "$RUNNER_TEMP/free-source-audit/status"
