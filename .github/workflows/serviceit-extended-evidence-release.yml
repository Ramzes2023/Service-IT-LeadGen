name: ServiceIT all-document queue and public company contacts v5
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-extended-evidence-release.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-extended-evidence-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test evidence identity and document limits
        run: |
          python -m pip install -r requirements.txt 'psycopg[binary]'
          python -m pytest -q tests/test_serviceit_extended_evidence.py
      - name: Transfer reviewed isolated worker
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/evidence"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          target="$VPS_USER@$VPS_HOST"
          remote="serviceit/evidence/staging-$GITHUB_RUN_ID"
          ssh -T -i "$stage/id" "${opts[@]}" "$target" "umask 077; install -d -m 0700 '$remote'"
          for file in leadpilot/serviceit_bitrix_list_shape.py leadpilot/serviceit_b2b_tender_documents.py leadpilot/serviceit_extended_documents.py leadpilot/serviceit_company_contacts.py leadpilot/serviceit_extended_evidence_worker.py ops/serviceit_extended_evidence_runner.py ops/serviceit_extended_evidence_audit.py; do
            scp -i "$stage/id" "${opts[@]}" "$file" "$target:$remote/"
          done
      - name: Build isolated legacy converter, activate and verify live backlog
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/evidence"
          ssh -T -i "$stage/id" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes "$VPS_USER@$VPS_HOST" "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          umask 077
          id="$1"
          [[ "$id" =~ ^[0-9]{7,16}$ ]]
          dir="$HOME/serviceit/evidence"
          stage="$dir/staging-$id"
          exec 9>"$dir/cycle.lock"
          flock -w 600 9
          base=$(docker inspect --format '{{.Image}}' serviceit-leadgen-vps-coordinator-1)
          [[ "$base" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker tag "$base" serviceit-evidence-base:reviewed
          cat > "$stage/Dockerfile" <<'DOCKER'
          FROM serviceit-evidence-base:reviewed
          USER root
          RUN apt-get update && apt-get install -y --no-install-recommends antiword && rm -rf /var/lib/apt/lists/*
          RUN python -m pip install --no-cache-dir striprtf==0.0.29
          USER 10001:10001
          DOCKER
          docker build -t "serviceit-evidence:$id" "$stage"
          docker run --rm --network none --read-only --entrypoint sh "serviceit-evidence:$id" -c 'command -v antiword >/dev/null && python -c "import striprtf.striprtf"'
          for file in serviceit_bitrix_list_shape.py serviceit_b2b_tender_documents.py serviceit_extended_documents.py serviceit_company_contacts.py serviceit_extended_evidence_worker.py serviceit_extended_evidence_runner.py serviceit_extended_evidence_audit.py; do
            python3 -m py_compile "$stage/$file"
            install -m 0600 "$stage/$file" "$dir/$file"
          done
          printf 'serviceit-evidence:%s\n' "$id" > "$dir/image"
          python3 "$dir/serviceit_extended_evidence_runner.py"
          python3 - "$dir" <<'PY'
          import subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1]);old=subprocess.run(['crontab','-l'],capture_output=True,text=True)
          if old.returncode not in (0,1):raise SystemExit('CRONTAB_READ_FAILED')
          rows=[r for r in old.stdout.splitlines() if not r.endswith('# SERVICEIT_EVIDENCE_V1')]
          rows.append(f'*/5 * * * * /usr/bin/flock -n {root}/cycle.lock /usr/bin/python3 {root}/serviceit_extended_evidence_runner.py >>{root}/status.log 2>&1 # SERVICEIT_EVIDENCE_V1')
          subprocess.run(['crontab','-'],input='\n'.join(rows)+'\n',text=True,check=True)
          actual=subprocess.run(['crontab','-l'],capture_output=True,text=True,check=True).stdout
          assert rows[-1] in actual
          print('EXT_FIVE_MINUTE_SCHEDULE=VERIFIED')
          PY
          for cycle in {1..16}; do
            python3 "$dir/serviceit_extended_evidence_runner.py"
          done
          python3 "$dir/serviceit_extended_evidence_runner.py" --audit
          REMOTE
