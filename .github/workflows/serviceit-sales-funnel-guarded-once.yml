name: ServiceIT isolated Lead Generation DEAL funnel (one-time guarded)
on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: serviceit-sales-funnel-entity2-once
  cancel-in-progress: false

jobs:
  guarded-deal-funnel-only:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 148 &&
      !github.event.issue.pull_request &&
      (github.event.comment.body == 'SERVICEIT_SALES_FUNNEL_CREATE_ONCE_V1' ||
       github.event.comment.body == 'SERVICEIT_SALES_FUNNEL_READONLY_ONCE_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_CRM_ADMIN_ONETIME_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_CRM_ADMIN_ONETIME_WEBHOOK }}
      SERVICEIT_GH_LEDGER_KEY: ${{ secrets.SERVICEIT_GH_LEDGER_KEY }}
      FUNNEL_CREATE_MODE: ${{ github.event.comment.body == 'SERVICEIT_SALES_FUNNEL_CREATE_ONCE_V1' && 'apply' || 'readonly' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed project dependencies
        run: python -m pip install -r requirements.txt
      - name: Corporate-admin-only isolated funnel create or inspect
        run: python -m leadpilot.serviceit_sales_funnel_provision
