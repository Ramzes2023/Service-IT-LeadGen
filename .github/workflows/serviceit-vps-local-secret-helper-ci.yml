name: ServiceIT VPS local-only secret helper validation
on:
  pull_request:
    paths:
      - "deploy/serviceit-vps-interactive-secret-install.py"
      - "tests/test_serviceit_vps_interactive_secret_install.py"
      - "docs/SERVICEIT_VPS_MISSING_SECRETS_LOCAL_ENTRY.md"

permissions:
  contents: read

jobs:
  validate-local-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and dummy-credential unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/serviceit-vps-interactive-secret-install.py
          python3 -m unittest discover -s tests -p test_serviceit_vps_interactive_secret_install.py -v
          echo "VPS_LOCAL_SECRET_HELPER_TESTS=PASS"
