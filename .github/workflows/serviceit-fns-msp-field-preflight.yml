name: ServiceIT FNS MSP approved field LIVE read-only preflight
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  inspect-approved-field:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 200 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_FNS_MSP_FIELD_READONLY_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect only schema metadata, never customer data or writes
        run: python -m leadpilot.serviceit_fns_msp_crm_preflight
