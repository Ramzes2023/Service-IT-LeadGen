name: ServiceIT TinyFish free Search key single request VPS READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-vps-tinyfish-key-one-readonly
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_TINYFISH_FREE_KEY_TEST_368'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Validate pinned SSH host without printing any secret
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/tinyfish-one"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/tinyfish-one/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/tinyfish-one/hosts"
          chmod 0600 "$RUNNER_TEMP/tinyfish-one/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/tinyfish-one/hosts" >/dev/null

      - name: One synthetic free GET from isolated nonroot ephemeral image
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/tinyfish-one/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/tinyfish-one/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" "bash -s" \
            > "$RUNNER_TEMP/tinyfish-one/out" 2>/dev/null <<'REMOTE'
          set -euo pipefail
          core=serviceit-leadgen-vps-coordinator-1
          [[ "$(docker inspect -f '{{.State.Health.Status}}' "$core")" == healthy ]]
          image="$(docker inspect -f '{{.Image}}' "$core")"
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --rm -i --pull never \
            --network bridge --read-only --user 10001:10001 \
            --security-opt no-new-privileges --cap-drop ALL \
            --memory 256m --pids-limit 48 \
            --mount type=bind,src=/etc/serviceit/secrets/tinyfish_api_key,dst=/run/secrets/serviceit_tinyfish_key,readonly \
            --entrypoint python "$image" -B - <<'PY'
          import json
          from pathlib import Path
          import httpx
          try:
              key = Path("/run/secrets/serviceit_tinyfish_key").read_text("utf-8").strip()
              if not (16 <= len(key) <= 256 and key.isascii() and "\n" not in key):
                  print("TINYFISH_AUTH=KEY_FORMAT_INVALID")
                  raise SystemExit(3)
              with httpx.Client(trust_env=False, follow_redirects=False, timeout=16.0) as client:
                  r = client.get(
                      "https://api.search.tinyfish.ai",
                      params={"query": "public procurement open data"},
                      headers={"X-API-Key": key, "Accept": "application/json"})
              if r.status_code != 200:
                  print("TINYFISH_AUTH=API_HTTP_" + str(r.status_code))
                  raise SystemExit(4)
              if ("application/json" not in r.headers.get("content-type", "")
                      or len(r.content) > 250000):
                  print("TINYFISH_AUTH=NON_JSON_RESPONSE")
                  raise SystemExit(4)
              data = r.json()
              if not isinstance(data, dict) or not isinstance(data.get("results"), list):
                  print("TINYFISH_AUTH=UNEXPECTED_RESPONSE_SCHEMA")
                  raise SystemExit(4)
              print("TINYFISH_AUTH=FREE_SEARCH_200")
              print("TINYFISH_DATA_SENT=SYNTHETIC_ONLY")
              print("TINYFISH_PROVIDER_CALLS=ONE")
              print("TINYFISH_CRM_WRITES=NO")
          except (OSError, UnicodeError, httpx.HTTPError, json.JSONDecodeError, ValueError):
              print("TINYFISH_AUTH=NETWORK_TLS_OR_SECRET_READ_FAILED")
              raise SystemExit(5)
          PY
          REMOTE
          rc=$?
          set -e
          grep -E '^TINYFISH_(AUTH|DATA_SENT|PROVIDER_CALLS|CRM_WRITES)=[A-Z0-9_]+$' \
            "$RUNNER_TEMP/tinyfish-one/out" | head -5 || true
          [[ "$rc" == 0 ]]
          grep -qx 'TINYFISH_AUTH=FREE_SEARCH_200' "$RUNNER_TEMP/tinyfish-one/out"
          grep -qx 'TINYFISH_DATA_SENT=SYNTHETIC_ONLY' "$RUNNER_TEMP/tinyfish-one/out"
          grep -qx 'TINYFISH_PROVIDER_CALLS=ONE' "$RUNNER_TEMP/tinyfish-one/out"
          grep -qx 'TINYFISH_CRM_WRITES=NO' "$RUNNER_TEMP/tinyfish-one/out"
