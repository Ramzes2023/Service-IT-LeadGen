name: ServiceIT V47 V11 production drift analysis READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v47-v11-diff-readonly
  cancel-in-progress: false
jobs:
  diagnostic:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V47_V11_DIFF_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate trusted SSH host and source revisions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          git cat-file -e '1ed48f9cdbf2fbba029d307bd410f46456546a74^{commit}'
          install -d -m 0700 "$RUNNER_TEMP/v47-v11"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v47-v11/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v47-v11/hosts"
          chmod 0600 "$RUNNER_TEMP/v47-v11/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v47-v11/hosts" >/dev/null
      - name: Copy source file READONLY and compare exact functional diff locally
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v47-v11/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          ssh -T -i "$RUNNER_TEMP/v47-v11/id" "${opts[@]}" "$target" \
            "docker exec serviceit-leadgen-vps-coordinator-1 cat /app/leadpilot/serviceit_vps_b2b_dossier_v11_worker.py" \
            > "$RUNNER_TEMP/v47-v11/live.py"
          git show '1ed48f9cdbf2fbba029d307bd410f46456546a74:leadpilot/serviceit_vps_b2b_dossier_v11_worker.py' \
            > "$RUNNER_TEMP/v47-v11/old.py"
          cp leadpilot/serviceit_vps_b2b_dossier_v11_worker.py "$RUNNER_TEMP/v47-v11/new.py"
          python3 - "$RUNNER_TEMP/v47-v11" <<'PY'
          import difflib,hashlib,re,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          d={}
          for k in ('old','live','new'):
              b=(root/(k+'.py')).read_bytes()
              assert b and len(b)<190000
              d[k]=b.decode('utf-8')
              print('V47_V11_'+k.upper()+'_SHA='+hashlib.sha256(b).hexdigest())
              print('V47_V11_'+k.upper()+'_LINES='+str(len(d[k].splitlines())))
          lines=list(difflib.unified_diff(d['old'].splitlines(),
                    d['live'].splitlines(),fromfile='V46_GITHUB',tofile='LIVE'))
          print('V47_V11_CHANGED_LINES='+str(len(lines)))
          output=[]
          for line in lines:
              if line.startswith(('---','+++','@@')):
                  output.append(line)
                  continue
              if line.startswith(('+','-')):
                  # Print only structure and policy logic, never inline literals
                  # from possible private environment or access tokens.
                  safe=re.sub(r"""(["'])[^\1]*\1""","'STR'",line)
                  if re.search(r'(?i)password|api.?key|secret|token|webhook|bearer',line):
                      safe=line[:1]+'[REDACTED_SECRET_REFERENCE]'
                  output.append(safe[:230])
          print('V47_V11_DIFF_BEGIN')
          print('\n'.join(output[:160]))
          print('V47_V11_DIFF_END')
          print('V47_V11_CRM_WRITES=0')
          PY
          [[ "$(sha256sum "$RUNNER_TEMP/v47-v11/live.py" | cut -d' ' -f1)" == 'b9a643c7ff21d9b0a36807f9024b11d23c05f55055e39f3088756a4fa2ca9836' ]]
