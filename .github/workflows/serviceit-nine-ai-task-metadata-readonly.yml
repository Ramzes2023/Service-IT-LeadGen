name: ServiceIT nine AI + manager-task field schema audit (READ ONLY)
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: serviceit-nine-ai-task-metadata-audit
  cancel-in-progress: false

jobs:
  read-actual-crm-fields:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 148 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_NINE_AI_TASK_METADATA_READONLY_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate exact nine AI fields and linked task metadata without writes
        run: python -m leadpilot.serviceit_nine_ai_task_readiness
