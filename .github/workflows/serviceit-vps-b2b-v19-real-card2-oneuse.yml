name: ServiceIT V19 one-use REAL second signed B2B CRM additive write
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v19-real-second-card-oneuse-write
  cancel-in-progress: false
jobs:
  oneuse_card2:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_V19_REAL_SECOND_SIGNED_CARD_ONEUSE_489'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact V19 production and one-use guard
        shell: bash
        run: |
          set -euo pipefail
          reviewed='66e72156c40aa9b63fb33aedb44b7c6e9d6a30be'
          scriptreview='10c0220023f70fe51cc85c760197826a206c8308'
          git cat-file -e "$reviewed^{commit}"
          git cat-file -e "$scriptreview^{commit}"
          names=(serviceit_b2b_tender_index_v18.py
                 serviceit_b2b_dossier_v11.py
                 serviceit_vps_worker.py
                 serviceit_b2b_v19_backfill.py)
          for name in "${names[@]}"; do
            git diff --quiet "$reviewed" HEAD -- "leadpilot/$name"
            python -m py_compile "leadpilot/$name"
          done
          script=ops/serviceit_vps_b2b_v19_oneuse_verified_card2.py
          git diff --quiet "$scriptreview" HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v19-once"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v19-once/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v19-once/hosts"
          chmod 0600 "$RUNNER_TEMP/v19-once/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v19-once/hosts" >/dev/null
          : > "$RUNNER_TEMP/v19-once/shas"
          for name in "${names[@]}"; do
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v19-once/shas"
          done
          [[ "$(wc -l < "$RUNNER_TEMP/v19-once/shas")" == 4 ]]
      - name: Run exactly one additive source update and verify Bitrix readback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v19-once/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t shas < "$RUNNER_TEMP/v19-once/shas"
          [[ "${#shas[@]}" == 4 ]]
          quoted=()
          for value in "${shas[@]}"; do
            [[ "$value" =~ ^[a-f0-9]{64}$ ]]
            quoted+=("'$value'")
          done
          set +e
          ssh -T -i "$RUNNER_TEMP/v19-once/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i -e SERVICEIT_VPS_B2B_V19_BACKFILL_ENABLED=YES serviceit-leadgen-vps-coordinator-1 python -B - ${quoted[*]}" \
            < ops/serviceit_vps_b2b_v19_oneuse_verified_card2.py \
            > "$RUNNER_TEMP/v19-once/out" 2>/dev/null
          rc=$?
          set -e
          grep -E '^B2B_V19_ONEUSE_[A-Z0-9_]{3,58}=(YES|NO|[0-9]{1,3}|[A-Z0-9_]{5,70})$' \
            "$RUNNER_TEMP/v19-once/out" | head -22 || true
          [[ "$rc" == 0 ]]
          grep -qx 'B2B_V19_ONEUSE_SOURCE_PIN_OK=YES' "$RUNNER_TEMP/v19-once/out"
          grep -qx 'B2B_V19_ONEUSE_MATCHES_REVIEWED_SECOND_CARD=YES' "$RUNNER_TEMP/v19-once/out"
          grep -qx 'B2B_V19_ONEUSE_ONE_REAL_CRM_WRITE=YES' "$RUNNER_TEMP/v19-once/out"
