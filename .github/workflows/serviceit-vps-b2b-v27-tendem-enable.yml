name: ServiceIT V27 enable approved public Tendem free Fetch in existing 300s coordinator
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-vps-five-minute-coordinator-image-change
  cancel-in-progress: false
jobs:
  enable:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V27_ENABLE_TENDEM_FREE_489'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact reviewed owner-only source, SSH host and five live module hashes
        shell: bash
        run: |
          set -euo pipefail
          reviewed='637ed1bb433e006cd71d06dea990706cd09da2a9'
          git cat-file -e "$reviewed^{commit}"
          src=ops/serviceit_vps_b2b_v27_tendem_enable.py
          git diff --quiet "$reviewed" HEAD -- "$src"
          python -m py_compile "$src"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v27"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v27/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v27/hosts"
          chmod 0600 "$RUNNER_TEMP/v27/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v27/hosts" >/dev/null
      - name: Transfer only source-free guarded installer into owner private stage
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v27/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          stage="serviceit/staging/v27-tendem-enable-$GITHUB_RUN_ID"
          target="$VPS_USER@$VPS_HOST"
          ssh -T -i "$RUNNER_TEMP/v27/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          scp -i "$RUNNER_TEMP/v27/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v27_tendem_enable.py "$target:$stage/activate.py"
      - name: Update ONLY public Tendem and free Fetch flags with rollback and no CRM writes
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v27/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          files=(serviceit_b2b_free_public_fallback.py serviceit_b2b_remote_public_fetch.py
                 serviceit_b2b_public_fact_extractor.py serviceit_vps_b2b_deep_research.py
                 serviceit_vps_worker.py)
          sha=()
          for file in "${files[@]}"; do
            value="$(sha256sum "leadpilot/$file" | cut -d' ' -f1)"
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
            sha+=("'$value'")
          done
          target="$VPS_USER@$VPS_HOST"
          scriptsha="$(sha256sum ops/serviceit_vps_b2b_v27_tendem_enable.py | cut -d' ' -f1)"
          [[ "$scriptsha" =~ ^[0-9a-f]{64}$ ]]
          command="bash -s -- '$GITHUB_RUN_ID' '$scriptsha' ${sha[*]}"
          set +e
          ssh -T -i "$RUNNER_TEMP/v27/id" "${opts[@]}" "$target" "$command" \
            > "$RUNNER_TEMP/v27/status" <<'REMOTE'
          set -euo pipefail
          id="$1"; scriptsha="$2"; shift 2
          [[ "$id" =~ ^[0-9]{7,16}$ && "$scriptsha" =~ ^[0-9a-f]{64}$ && "$#" == 5 ]]
          for val in "$@"; do [[ "$val" =~ ^[0-9a-f]{64}$ ]]; done
          script="$HOME/serviceit/staging/v27-tendem-enable-$id/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$scriptsha" "$script" | sha256sum --check --status
          python3 "$script" "$id" "$@"
          REMOTE
          rc=$?
          set -e
          grep -E '^V27_ENABLE_[A-Z0-9_]+=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,85})$' \
            "$RUNNER_TEMP/v27/status" | head -26 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V27_ENABLE_PREFLIGHT=YES' "$RUNNER_TEMP/v27/status"
          grep -qx 'V27_ENABLE_TENDEM_FREE_PUBLIC=YES' "$RUNNER_TEMP/v27/status"
          grep -qx 'V27_ENABLE_B2B_DIRECT_LICENSE=NO' "$RUNNER_TEMP/v27/status"
          grep -qx 'V27_ENABLE_CRM_WRITES=NO' "$RUNNER_TEMP/v27/status"
          grep -qx 'V27_ENABLE_ROLLBACK=NOT_NEEDED' "$RUNNER_TEMP/v27/status"
