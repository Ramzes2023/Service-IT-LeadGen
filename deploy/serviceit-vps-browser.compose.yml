# OPTIONAL, standalone browser engine only. NO DEFAULT START and NO CRM.
# Run manually after review of isolated egress firewall and browser sandbox.
# Do not attach to the host network or use the Bitrix/DB/RouterAI secret tree.
name: serviceit-public-browser-vps

services:
  browser:
    profiles: ["browser"]
    build:
      context: ..
      dockerfile: Dockerfile.serviceit-vps-browser
    user: pwuser
    network_mode: bridge
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 1g
    shm_size: 256m
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      SERVICEIT_VPS_BROWSER_APPROVED_HOSTS: "${SERVICEIT_VPS_BROWSER_APPROVED_HOSTS:-}"
    command: ["python", "-m", "leadpilot.serviceit_vps_public_browser", "--selfcheck"]
