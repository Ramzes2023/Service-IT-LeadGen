name: ServiceIT Tavily reserve read-only usage probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-vps-tavily-reserve-usage.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v37-search-release
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Verify the mounted provider key with GET usage
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/tavily-usage"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/id" "$stage/hosts"
          ssh-keygen -F "$VPS_HOST" -f "$stage/hosts" >/dev/null
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' > "$stage/status" <<'REMOTE'
          set -euo pipefail
          core=serviceit-leadgen-vps-coordinator-1
          img="$(docker inspect --format '{{.Image}}' "$core")"
          [[ "$img" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker exec -i "$core" python -B - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          names = {
              "CORE": "serviceit_vps_worker.py", "DEEP": "serviceit_vps_b2b_deep_research.py",
              "V11": "serviceit_vps_b2b_dossier_v11_worker.py", "V19": "serviceit_b2b_v19_backfill.py",
              "MINI": "serviceit_b2b_tavily_research_mini_v47.py",
          }
          for name, filename in names.items():
              path = Path("/app/leadpilot") / filename
              digest = hashlib.sha256(path.read_bytes()).hexdigest().upper() if path.is_file() else "MISSING"
              print(f"TAVILY_RESERVE_SHA_{name}={digest}")
          flag = os.environ.get("SERVICEIT_VPS_B2B_TAVILY_RESEARCH_MINI_ENABLED") == "YES"
          print("TAVILY_RESERVE_ACTIVE=" + ("YES" if flag else "NO"))
          PY
          docker run --rm -i --pull never --read-only --user 10001:10001 --cap-drop ALL \
            --mount type=bind,src=/etc/serviceit/secrets/tavily_api_key,dst=/run/tavily,readonly \
            --entrypoint python "$img" -B - <<'PY'
          from pathlib import Path
          import re
          import httpx

          try:
              key = Path("/run/tavily").read_text().strip()
              if not re.fullmatch(r"tvly-[!-~]{15,215}", key):
                  print("TAVILY_RESERVE_KEY=FORMAT_UNVERIFIED")
              else:
                  with httpx.Client(timeout=15, trust_env=False, follow_redirects=False) as client:
                      r = client.get("https://api.tavily.com/usage",
                                     headers={"Authorization": "Bearer " + key})
                  print("TAVILY_RESERVE_USAGE_HTTP=" + str(r.status_code))
                  # The support team can identify whether the 403 was served
                  # by an edge/WAF or API origin. Never log body, token,
                  # arbitrary server header values or Ray identifier.
                  server = r.headers.get("server", "").casefold()
                  via = r.headers.get("via", "").casefold()
                  edge = ("cloudflare" in server or "cloudflare" in via
                          or "cf-ray" in r.headers)
                  print("TAVILY_RESERVE_EDGE=" + ("CLOUDFLARE" if edge else "NOT_DETECTED"))
                  ctype = r.headers.get("content-type", "").split(";", 1)[0].strip().casefold()
                  kind = ("JSON" if "json" in ctype else
                          "HTML" if "html" in ctype else "OTHER")
                  print("TAVILY_RESERVE_CONTENT_TYPE=" + kind)
                  print("TAVILY_RESERVE_CF_RAY=" +
                        ("PRESENT" if "cf-ray" in r.headers else "ABSENT"))
                  print("TAVILY_RESERVE_RETRY_AFTER=" +
                        ("PRESENT" if "retry-after" in r.headers else "ABSENT"))
                  if r.status_code in (401, 403):
                      if r.status_code == 403:
                          with httpx.Client(timeout=15, trust_env=False, follow_redirects=False) as client:
                              public = client.get("https://api.tavily.com/usage")
                          identical = (public.status_code == 403 and public.content == r.content)
                          print("TAVILY_RESERVE_UNAUTH_HTTP=" + str(public.status_code))
                          print("TAVILY_RESERVE_SAME_DENIAL=" + ("YES" if identical else "NO"))
                      body = r.text[:12000].casefold()
                      if any(x in body for x in ("invalid api key", "missing api key", "invalid token")):
                          reason = "KEY_REJECTED"
                      elif any(x in body for x in ("country", "geographic", "your region")):
                          reason = "REGION_RESTRICTED"
                      elif any(x in body for x in ("cloudflare", "request blocked", "access denied")):
                          reason = "EDGE_DENIAL"
                      else:
                          reason = "UNSPECIFIED"
                      print("TAVILY_RESERVE_DENIAL=" + reason)
                  if r.status_code == 200:
                      account = r.json().get("account", {})
                      limit, used = account.get("plan_limit"), account.get("plan_usage")
                      ready = type(limit) is int and type(used) is int and 0 <= used <= limit and limit-used >= 110
                      print("TAVILY_RESERVE_INCLUDED_CREDITS=" + ("READY" if ready else "UNVERIFIED"))
          except (OSError, ValueError, httpx.HTTPError):
              print("TAVILY_RESERVE_USAGE=UNVERIFIED")
          PY
          REMOTE
          grep -E '^TAVILY_RESERVE_[A-Z0-9_]+=[A-Z0-9_]+$' "$stage/status"
