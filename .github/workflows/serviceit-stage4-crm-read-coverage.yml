name: ServiceIT stage4 corporate CRM read coverage audit (READ ONLY)
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: serviceit-crm-read-coverage-only
  cancel-in-progress: false
jobs:
  audit-rights:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'Ramzes2023' &&
        github.event.issue.number == 148 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'SERVICEIT_STAGE4_CRM_COVERAGE_READONLY_ONCE_V1'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checked dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify company, contact and requisite visibility without customer data
        run: python -m leadpilot.serviceit_stage4_crm_coverage_audit
