name: ServiceIT B2B card29 source-backed one-use dossier repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-vps-b2b-card29-source-repair.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v37-search-release
  cancel-in-progress: false
jobs:
  guarded-apply:
    if: github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact owner-reviewed source-only one-use script
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          python -m py_compile ops/serviceit_vps_b2b_card29_dossier_repair.py
          python -m py_compile ops/serviceit_vps_b2b_card29_evidence_readonly.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          root="$RUNNER_TEMP/card29-repair"
          install -d -m 0700 "$root"
          printf '%s\n' "$VPS_SSH_KEY" > "$root/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$root/hosts"
          chmod 0600 "$root/id" "$root/hosts"
          ssh-keygen -F "$VPS_HOST" -f "$root/hosts" >/dev/null
      - name: No-write preflight of exact signed CRM card, original and archived nine-field snapshot
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card29-repair"
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$root/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          ssh -T -i "$root/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - --preview' \
            < ops/serviceit_vps_b2b_card29_dossier_repair.py > "$root/preview"
          grep -E '^CARD29_REPAIR_[A-Z0-9_]+=[A-Z0-9_]+$' "$root/preview" | head -25
          grep -qx 'CARD29_REPAIR_EVIDENCE_READY=YES' "$root/preview"
          grep -qx 'CARD29_REPAIR_PREVIEW_NO_WRITES=YES' "$root/preview"
      - name: One-use receipt and nine-field CRM write with exact readback, no replay
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card29-repair"
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$root/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          rc=0
          ssh -T -i "$root/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - --apply' \
            < ops/serviceit_vps_b2b_card29_dossier_repair.py > "$root/actual" 2>/dev/null || rc=$?
          grep -E '^CARD29_REPAIR_[A-Z0-9_]+=[A-Z0-9_]+$' "$root/actual" | head -28 || true
          [[ "$rc" == 0 ]]
          grep -qx 'CARD29_REPAIR_CRM_READBACK=VERIFIED' "$root/actual"
          grep -qx 'CARD29_REPAIR_REPLAY=BLOCKED' "$root/actual"
      - name: Independently verify missing deadline, payment and delivery now appear in Bitrix
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card29-repair"
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$root/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          ssh -T -i "$root/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            < ops/serviceit_vps_b2b_card29_evidence_readonly.py > "$root/verify"
          grep -E '^CARD29_[A-Z0-9_]+=[A-Z0-9_]+$' "$root/verify" | head -45
          grep -qx 'CARD29_CRM_ID=YES' "$root/verify"
          grep -qx 'CARD29_REPORT_DEADLINE_20NOV=YES' "$root/verify"
          grep -qx 'CARD29_REPORT_PAYMENT_TERMS=YES' "$root/verify"
          grep -qx 'CARD29_REPORT_ELECTRONIC_DELIVERY=YES' "$root/verify"
