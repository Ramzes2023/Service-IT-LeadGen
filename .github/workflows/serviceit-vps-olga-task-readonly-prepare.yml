name: ServiceIT VPS prepare Olga 605 for internal tasks (READONLY)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Exact owner approval PREPARE_OLGA_605_READONLY (NO task creation)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: serviceit-vps-native-shadow-readonly
  cancel-in-progress: false

jobs:
  olga-task-prepare:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      inputs.approval == 'PREPARE_OLGA_605_READONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check pinned non-root VPS SSH identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          mkdir -m 0700 -p "$RUNNER_TEMP/serviceit-olga-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-olga-ssh/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-olga-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/serviceit-olga-ssh/id" "$RUNNER_TEMP/serviceit-olga-ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/serviceit-olga-ssh/known_hosts" >/dev/null
      - name: Upload checksum-pinned local preparation script
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          src="deploy/serviceit-vps-olga-task-readonly-prepare.py"
          digest="$(sha256sum "$src" | cut -d' ' -f1)"
          ssh -i "$RUNNER_TEMP/serviceit-olga-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-olga-ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/serviceit/staging"'
          scp -i "$RUNNER_TEMP/serviceit-olga-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-olga-ssh/known_hosts" \
            -o BatchMode=yes "$src" \
            "$VPS_USER@$VPS_HOST:serviceit/staging/olga605-readonly-$sha.py"
          remote_digest="$(ssh -i "$RUNNER_TEMP/serviceit-olga-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-olga-ssh/known_hosts" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "sha256sum serviceit/staging/olga605-readonly-$sha.py" | cut -d' ' -f1)"
          [[ "$remote_digest" == "$digest" ]] || { echo "VPS_OLGA_SCRIPT_DIGEST_MISMATCH"; exit 2; }
          echo "VPS_OLGA_PREP_SCRIPT_PINNED_SHA256=PASS"
      - name: Verify Olga employee identity from REAL Bitrix on READONLY container (zero CRM writes)
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ssh -i "$RUNNER_TEMP/serviceit-olga-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-olga-ssh/known_hosts" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python - --probe --approval PREPARE_OLGA_605_READONLY < serviceit/staging/olga605-readonly-$sha.py"
      - name: Save exact Olga 605 task-assignee authorization into private READONLY VPS config
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          ssh -i "$RUNNER_TEMP/serviceit-olga-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-olga-ssh/known_hosts" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "python3 serviceit/staging/olga605-readonly-$sha.py --apply --approval PREPARE_OLGA_605_READONLY </dev/null"
          echo "VPS_OLGA_605_TASK_RECIPIENT_CONFIGURED=YES"
          echo "VPS_REDEPLOY_REQUIRED=YES"
          echo "CRM_WRITES=0;TASKS_CREATED=0;CUTOVER=NO;OLD_GITHUB_WRITERS=UNCHANGED"
