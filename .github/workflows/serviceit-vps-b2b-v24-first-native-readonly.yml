name: ServiceIT B2B V24 first original native write intent exact CRM digest READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v24-native-fence-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V24_FIRST_NATIVE_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin reviewed V24 read-only digest checker and trusted SSH host
        shell: bash
        run: |
          set -euo pipefail
          reviewed='724292d0eabe1bf0c7ebd4fda05f1a3f97a904d9'
          git cat-file -e "$reviewed^{commit}"
          script=ops/serviceit_vps_b2b_v24_first_native_readonly.py
          git diff --quiet "$reviewed" HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v24-first"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v24-first/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v24-first/hosts"
          chmod 0600 "$RUNNER_TEMP/v24-first/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v24-first/hosts" >/dev/null
      - name: Read-only first card pending native receipt and exact expected CRM digest
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v24-first/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          pins=()
          for file in serviceit_vps_native_fence.py serviceit_vps_worker.py serviceit_b2b_v19_backfill.py; do
            sha="$(sha256sum "leadpilot/$file" | cut -d' ' -f1)"
            [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
            pins+=("'$sha'")
          done
          set +e
          ssh -T -i "$RUNNER_TEMP/v24-first/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - ${pins[*]}" \
            < ops/serviceit_vps_b2b_v24_first_native_readonly.py \
            > "$RUNNER_TEMP/v24-first/output" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V24_FIRST_[A-Z0-9_]+=(YES|NO|[0-9]{1,3}|[A-Z0-9_]{4,80})$' \
            "$RUNNER_TEMP/v24-first/output" | head -45 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V24_FIRST_GATES_AND_HASHES=YES' "$RUNNER_TEMP/v24-first/output"
          grep -qx 'V24_FIRST_SIGNED_FIRST=YES' "$RUNNER_TEMP/v24-first/output"
          grep -qx 'V24_FIRST_CRM_WRITES=NO' "$RUNNER_TEMP/v24-first/output"
          grep -qx 'V24_FIRST_PG_WRITES=NO' "$RUNNER_TEMP/v24-first/output"
