name: ServiceIT manager and AI form layout (guarded free)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      apply:
        description: "Shared layout change (requires company administrator approval)"
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: serviceit-1062-21-shared-manager-layout
  cancel-in-progress: false

jobs:
  safe-manager-layout:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 74 &&
        !github.event.issue.pull_request &&
        (github.event.comment.body == 'SERVICEIT_MANAGER_LAYOUT_READONLY_V1' ||
         github.event.comment.body == 'SERVICEIT_MANAGER_LAYOUT_APPLY_V1')))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Apply uses a separate short-lived corporate admin credential;
      # read-only preview retains the existing non-admin automation webhook.
      SERVICEIT_BITRIX_WEBHOOK: ${{ ((github.event_name == 'workflow_dispatch' && inputs.apply) || (github.event_name == 'issue_comment' && github.event.comment.body == 'SERVICEIT_MANAGER_LAYOUT_APPLY_V1')) && secrets.SERVICEIT_BITRIX_CRM_ADMIN_ONETIME_WEBHOOK || secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_GH_LEDGER_KEY: ${{ secrets.SERVICEIT_GH_LEDGER_KEY }}
      # The exact owner-only Issue #74 APPLY marker is the owner opt-in;
      # administrator approval remains a separate, non-bypassable gate.
      SERVICEIT_MANAGER_LAYOUT_APPLY: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'SERVICEIT_MANAGER_LAYOUT_APPLY_V1' && 'YES_1062_21_SHARED_MANAGER_LAYOUT' || vars.SERVICEIT_MANAGER_LAYOUT_APPLY }}
      SERVICEIT_MANAGER_LAYOUT_ADMIN_APPROVED: ${{ vars.SERVICEIT_MANAGER_LAYOUT_ADMIN_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checked requirements
        run: python -m pip install -r requirements.txt
      - name: Preview shared layout without writes
        if: ${{ (github.event_name == 'issue_comment' && github.event.comment.body == 'SERVICEIT_MANAGER_LAYOUT_READONLY_V1') || (github.event_name == 'workflow_dispatch' && !inputs.apply) }}
        shell: bash
        run: |
          set +e
          python -m leadpilot.serviceit_manager_layout_operator > "$RUNNER_TEMP/serviceit-layout-preview.json"
          code=$?
          set -e
          echo "SERVICEIT_PREVIEW_EXIT=$code" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "serviceit-layout-preview.json"
          try:
              data = json.loads(path.read_text("utf-8"))
              status = data.get("status")
          except (OSError, ValueError, AttributeError, TypeError):
              status = None
          safe = {"PREVIEW_ONLY", "ALREADY_PRESENT", "BITRIX_WEBHOOK_MISSING",
                  "REPOSITORY_SCOPE_BLOCKED",
                  "LAYOUT_BLOCKED_OR_UNCERTAIN_REVIEW_REQUIRED"}
          print("SERVICEIT_LAYOUT_PREVIEW_STATUS="
                + (status if type(status) is str and status in safe else "BLOCKED_REVIEW"))
          PY
      - name: Post strict redacted read-only status to owner Issue
        if: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'SERVICEIT_MANAGER_LAYOUT_READONLY_V1' }}
        run: python -m leadpilot.serviceit_manager_layout_status_comment --result "$RUNNER_TEMP/serviceit-layout-preview.json"
      - name: Guarded shared manager layout apply from exact owner approval marker
        if: ${{ github.event_name == 'issue_comment' && github.event.comment.body == 'SERVICEIT_MANAGER_LAYOUT_APPLY_V1' }}
        shell: bash
        run: |
          set +e
          python -m leadpilot.serviceit_manager_layout_operator --apply > "$RUNNER_TEMP/serviceit-layout-apply.json"
          code=$?
          set -e
          echo "SERVICEIT_APPLY_EXIT=$code" >> "$GITHUB_ENV"
          python -m leadpilot.serviceit_manager_layout_apply_status --result "$RUNNER_TEMP/serviceit-layout-apply.json"
          test "$code" = "0"
      - name: Require read-only preview success
        if: ${{ (github.event_name == 'issue_comment' && github.event.comment.body == 'SERVICEIT_MANAGER_LAYOUT_READONLY_V1') || (github.event_name == 'workflow_dispatch' && !inputs.apply) }}
        run: test "$SERVICEIT_PREVIEW_EXIT" = "0"
      - name: Approved backup-first shared layout change with readback
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: python -m leadpilot.serviceit_manager_layout_operator --apply
