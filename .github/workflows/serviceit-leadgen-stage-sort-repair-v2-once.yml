name: ServiceIT exact LeadGen stage sort repair V2 (guarded owner-only once)
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
concurrency:
  group: serviceit-leadgen-stage-sort-repair-v2-once
  cancel-in-progress: false
jobs:
  exact-funnel-stages:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 148 &&
      !github.event.issue.pull_request &&
      (github.event.comment.body == 'SERVICEIT_LEADGEN_SORT_REPAIR_V2_READONLY' ||
       github.event.comment.body == 'SERVICEIT_LEADGEN_SORT_REPAIR_V2_APPLY_ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      # Never shadow runner-native GITHUB_EVENT_PATH with an empty expression.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_CRM_ADMIN_ONETIME_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_CRM_ADMIN_ONETIME_WEBHOOK }}
      SERVICEIT_GH_LEDGER_KEY: ${{ secrets.SERVICEIT_GH_LEDGER_KEY }}
      SERVICEIT_STAGE_REPAIR_V2_MODE: ${{ github.event.comment.body == 'SERVICEIT_LEADGEN_SORT_REPAIR_V2_APPLY_ONCE' && 'apply' || 'readonly' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Exact-funnel inspect or one-time sort-only repair
        run: python -m leadpilot.serviceit_sales_stages_repair_v2
