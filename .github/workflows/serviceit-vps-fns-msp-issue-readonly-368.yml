name: ServiceIT VPS FNS-MSP official receipt and CRM field diagnostic READONLY (#368)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: serviceit-vps-fns-issue-368-readonly
  cancel-in-progress: false

jobs:
  fns-msp-readonly:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_FNS_MSP_AUDIT_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Verify non-root SSH identity and pinned host fingerprint
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/serviceit-fns-audit"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-fns-audit/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-fns-audit/known_hosts"
          chmod 600 "$RUNNER_TEMP/serviceit-fns-audit/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/serviceit-fns-audit/known_hosts" >/dev/null

      - name: Read native FNS-MSP state without CRM or PostgreSQL writes
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/serviceit-fns-audit/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-fns-audit/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' <<'PY'
          import os
          import subprocess

          C = "serviceit-leadgen-vps-coordinator-1"
          A = "serviceit-leadgen-vps-auxiliaries-1"
          M = "serviceit-leadgen-vps-fns-msp-1"

          def run(*args, timeout=45):
              try:
                  p = subprocess.run(args, capture_output=True, text=True,
                                     timeout=timeout, check=False)
                  return p.returncode, p.stdout.strip()
              except (OSError, subprocess.TimeoutExpired):
                  return 99, ""

          def status(container, key):
              rc, val = run("docker", "exec", container, "printenv", key)
              return val if rc == 0 and val in ("YES", "NO", "LIVE", "READONLY") else "UNVERIFIED"

          print("VPS_FNS_MSP_READONLY_AUDIT=START", flush=True)
          for name, container in (("COORDINATOR", C), ("AUXILIARIES", A), ("FNS_MSP", M)):
              rc, val = run("docker", "inspect", "-f",
                 "{{.State.Running}}:{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}",
                 container)
              print(name + "_CONTAINER=" + (
                  "HEALTHY" if val == "true:healthy" else
                  "RUNNING_NO_HEALTH" if val == "true:none" else "NOT_RUNNING_OR_INACCESSIBLE"), flush=True)

          for label, container, key in (
              ("WRITER_MODE", C, "SERVICEIT_VPS_WRITER_MODE"),
              ("POLL_ENABLED", C, "SERVICEIT_VPS_POLL_ENABLED"),
              ("FNS_MSP_COLLECTOR_ENABLED", M, "SERVICEIT_VPS_FNS_MSP_ENABLED"),
              ("FNS_CRM_RESULT_ENABLED", A, "SERVICEIT_VPS_FNS_CRM_RESULT_ENABLED"),
              ("FREE_MSP_SCORE_ENABLED", A, "SERVICEIT_VPS_FREE_MSP_SCORE_ENABLED"),
              ("PROVISIONAL_SCORE_ENABLED", A, "SERVICEIT_VPS_PROVISIONAL_SCORE_ENABLED"),
          ):
              print(label + "=" + status(container, key), flush=True)

          for label, container, module in (
              ("FNS_COLLECTOR_CODE", C, "leadpilot.serviceit_vps_native_msp"),
              ("FNS_RESULT_CODE", A, "leadpilot.serviceit_vps_native_msp_result"),
          ):
              program = ("import importlib.util;print('YES' if "
                         "importlib.util.find_spec('" + module + "') else 'NO')")
              rc, val = run("docker", "exec", container, "python", "-c", program)
              print(label + "=" + (val if rc == 0 and val in ("YES", "NO")
                                     else "UNVERIFIED"), flush=True)

          pg = """
          import os
          from leadpilot.serviceit_vps_pg_queue import db
          with db(dict(os.environ)) as con:
              with con.transaction():
                  with con.cursor() as cur:
                      cur.execute('SET TRANSACTION READ ONLY')
                      cur.execute("SELECT to_regclass('public.serviceit_vps_msp_snapshot') IS NOT NULL")
                      present = bool(cur.fetchone()[0])
                      print('READY' if present else 'MISSING')
                      if present:
                          cur.execute("SELECT COUNT(*), COUNT(msp_category) FROM serviceit_vps_msp_snapshot")
                          total, matched = cur.fetchone()
                          print("FNS_SNAPSHOT_RECEIPTS=" + str(min(total, 100000000)))
                          print("FNS_MSP_MATCHED=" + str(min(matched, 100000000)))
          """
          rc, val = run("docker", "exec", C, "python", "-c", pg)
          print("FNS_MSP_PG_SCHEMA=" + ("READY" if rc == 0 and val.startswith("READY") else
                                         "MISSING" if rc == 0 and val == "MISSING"
                                         else "UNVERIFIED"), flush=True)
          for line in val.splitlines()[1:3]:
              if line.startswith(("FNS_SNAPSHOT_RECEIPTS=", "FNS_MSP_MATCHED=")):
                  print(line, flush=True)

          crm = """
          import os
          import httpx
          from leadpilot.serviceit_vps_pg_queue import secret_file
          from leadpilot.bitrix_metadata_audit import validate_webhook
          from leadpilot.serviceit_fns_msp_crm_result_writer import result_field_verified
          try:
              base = validate_webhook(secret_file(dict(os.environ), 'SERVICEIT_BITRIX_WEBHOOK'))
              with httpx.Client(trust_env=False,follow_redirects=False) as client:
                  print('READY' if result_field_verified(client,base) else 'NOT_READY')
          except Exception:
              print('NOT_READY_OR_NOT_ACCESSIBLE')
          """
          rc, val = run("docker", "exec", A, "python", "-c", crm)
          print("BITRIX_FNS_RESULT_FIELD=" + (
              val if rc == 0 and val in ("READY","NOT_READY","NOT_READY_OR_NOT_ACCESSIBLE")
              else "UNVERIFIED"), flush=True)

          scratch = "/var/lib/serviceit/fns-scratch"
          if os.path.isdir(scratch) and not os.path.islink(scratch):
              try:
                  s = os.statvfs(scratch)
                  gb = s.f_bavail * s.f_frsize
                  print("FNS_SCRATCH=PRESENT", flush=True)
                  print("FNS_SCRATCH_FREE_GE_25GB=" +
                        ("YES" if gb >= 25*1024**3 else "NO"), flush=True)
              except OSError:
                  print("FNS_SCRATCH=UNVERIFIED", flush=True)
          else:
              print("FNS_SCRATCH=NOT_PREPARED_OR_INACCESSIBLE", flush=True)
          print("CRM_WRITES=0;PG_WRITES=0;RESTARTS=0;SOURCES_CHANGED=NO", flush=True)
          print("FNS_E2E=NOT_VERIFIED_BY_READONLY_AUDIT", flush=True)
          PY
