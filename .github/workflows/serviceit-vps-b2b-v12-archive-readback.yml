name: ServiceIT B2B V12 archive recovery exact four-card CRM READONLY acceptance
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v12-four-readback
  cancel-in-progress: false
jobs:
  acceptance:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V12_ARCHIVE_READBACK_368'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Protected read of four existing PG receipts and Bitrix exact fields
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v12-readback"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v12-readback/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v12-readback/hosts"
          chmod 0600 "$RUNNER_TEMP/v12-readback/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v12-readback/hosts" >/dev/null
          ssh -T -i "$RUNNER_TEMP/v12-readback/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/v12-readback/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            > "$RUNNER_TEMP/v12-readback/status" <<'PY'
          import os,secrets
          from pathlib import Path
          import httpx
          from leadpilot.serviceit_vps_pg_queue import db,secret_file
          from leadpilot.serviceit_b2b_hold_ai_fields import AI_FIELDS,PREFIX
          from leadpilot.serviceit_enrichment_worker import Rest,normalized,validate_identity
          from leadpilot.serviceit_vps_b2b_dossier_v11_worker import compute_digest
          from leadpilot.bitrix_metadata_audit import validate_webhook
          env=dict(os.environ)
          ready=all((Path('/app/leadpilot')/name).is_file() for name in (
              'serviceit_b2b_archive_continuity_v12.py',
              'serviceit_vps_b2b_archive_v12_worker.py'))
          print('V12_ACCEPT_SOURCE='+('YES' if ready else 'NO'),flush=True)
          with db(env) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(*) FROM serviceit_vps_b2b_dossier_v11_receipts WHERE status='VERIFIED'")
                  previous=int(cur.fetchone()[0])
                  cur.execute("SELECT to_regclass('public.serviceit_vps_b2b_dossier_v12_continuity_receipts')")
                  has_table=cur.fetchone()[0] is not None
                  rows=[]
                  if has_table:
                      cur.execute("""
                        SELECT old.card_id,old.after_fields,
                               a.status,a.after_fields,a.salt,a.digest
                        FROM serviceit_vps_b2b_dossier_v11_receipts old
                        JOIN serviceit_vps_b2b_dossier_v12_continuity_receipts a
                          ON a.card_id=old.card_id
                        WHERE old.status='VERIFIED'
                        ORDER BY old.card_id
                      """)
                      rows=cur.fetchall()
                  cur.execute("SELECT count(*) FROM serviceit_vps_b2b_dossier_v12_continuity_receipts WHERE status IN ('UNCERTAIN','CONFLICT','WRITE_INTENT')")
                  unsafe=int(cur.fetchone()[0]) if has_table else 0
              print('V12_ACCEPT_PREVIOUS_FOUR='+('YES' if previous==4 else 'NO'),flush=True)
              print('V12_ACCEPT_RECEIPTS='+str(min(len(rows),99)),flush=True)
              repaired=sum(x[2]=='VERIFIED' for x in rows)
              untouched=sum(x[2]=='NO_CHANGE' for x in rows)
              print('V12_ACCEPT_RESTORED_COUNT='+str(repaired),flush=True)
              print('V12_ACCEPT_NO_CHANGE_COUNT='+str(untouched),flush=True)
              print('V12_ACCEPT_UNCERTAIN_COUNT='+str(min(unsafe,99)),flush=True)
              ok=True
              archival_sections=0
              webhook=secret_file(env,'SERVICEIT_BITRIX_WEBHOOK')
              validate_webhook(webhook)
              with httpx.Client(trust_env=False,follow_redirects=False,timeout=23) as client:
                  rest=Rest(webhook,client)
                  for card,old_expected,status,new_expected,salt,proof in rows:
                      try:
                          item=normalized(rest('crm.item.get',{
                              'entityTypeId':1062,'id':card,
                              'useOriginalUfNames':'Y'})['item'])
                          validate_identity(item,card)
                          current={k:item.get(k) for k in AI_FIELDS}
                          expected=(new_expected if status=='VERIFIED'
                                    else old_expected if status=='NO_CHANGE' else None)
                          match=current==expected and expected is not None
                          if status=='VERIFIED':
                              match=bool(match and salt is not None and proof is not None
                                and secrets.compare_digest(
                                    compute_digest(current,bytes(salt)),bytes(proof)))
                              archival_sections+=int(
                                  '09  ВОССТАНОВЛЕННЫЕ ДОКАЗАТЕЛЬСТВА' in
                                  str(current.get(PREFIX+'AI_FULL_REPORT','')))
                          ok=ok and match
                      except Exception:
                          ok=False
              ok=bool(ok and previous==4 and len(rows)==4
                      and repaired==2 and untouched==2 and unsafe==0)
              print('V12_ACCEPT_ARCHIVE_SECTIONS='+str(archival_sections),flush=True)
              print('V12_ACCEPT_EXACT_CRM_READBACK='+('YES' if ok else 'NO'),flush=True)
              print('V12_ACCEPT_ALL_FOUR='+('YES' if ok and archival_sections==2 else 'NO'),flush=True)
          PY
          grep -E '^V12_ACCEPT_[A-Z0-9_]+=(YES|NO|[0-9]{1,3})$' \
            "$RUNNER_TEMP/v12-readback/status" | head -24
          grep -qx 'V12_ACCEPT_ALL_FOUR=YES' "$RUNNER_TEMP/v12-readback/status"
