name: ServiceIT V44 Tavily source key/quota readiness READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v44-tavily-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V44_TAVILY_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact read-only source and SSH identity
        shell: bash
        run: |
          set -euo pipefail
          src=ops/serviceit_vps_b2b_v44_tavily_readonly.py
          [[ "$(git hash-object "$src")" == 4a9c62807e2f245591c5a2010bab092e54d2ca32 ]]
          python -m py_compile "$src"
          install -d -m 0700 "$RUNNER_TEMP/v44-audit"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v44-audit/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v44-audit/hosts"
          chmod 0600 "$RUNNER_TEMP/v44-audit/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v44-audit/hosts" >/dev/null
      - name: Read Tavily activation and PG credit ledger without touching sources
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v44-audit/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/v44-audit/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_v44_tavily_readonly.py \
            > "$RUNNER_TEMP/v44-audit/result" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V44_TAVILY_AUDIT_[A-Z0-9_]{3,60}=(YES|NO|[0-9]{1,5})$' \
            "$RUNNER_TEMP/v44-audit/result" | head -25 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V44_TAVILY_AUDIT_CRM_WRITES=0' "$RUNNER_TEMP/v44-audit/result"
          grep -qx 'V44_TAVILY_AUDIT_PG_WRITES=0' "$RUNNER_TEMP/v44-audit/result"
          grep -qx 'V44_TAVILY_AUDIT_PROVIDER_CALLS=0' "$RUNNER_TEMP/v44-audit/result"
