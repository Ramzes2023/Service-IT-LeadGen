name: ServiceIT V42 three NEW B2B cards 19 21 23 stage-to-CRM audit READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v42-four-field-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V42_THREE_NEW_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attest new-card read-only source and worker module SHA
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/v42-newcards"
          python -m py_compile ops/serviceit_vps_b2b_v42_new_cards_readonly.py
          [[ "$(git hash-object ops/serviceit_vps_b2b_v42_new_cards_readonly.py)" == "fbd6f996b324d077287fa8030857c4ef2c381a5c" ]]
          : > "$RUNNER_TEMP/v42-newcards/shas"
          names=(serviceit_vps_worker.py serviceit_enrichment_worker.py
            serviceit_b2b_dossier_consistency_worker_v37.py)
          for n in "${names[@]}"; do
            sha256sum "leadpilot/$n" | cut -d' ' -f1 >> "$RUNNER_TEMP/v42-newcards/shas"
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v42-newcards/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v42-newcards/hosts"
          chmod 0600 "$RUNNER_TEMP/v42-newcards/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v42-newcards/hosts" >/dev/null
      - name: Read real pipeline stages and Bitrix for new signed 19,21,23 only
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v42-newcards/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t hashes < "$RUNNER_TEMP/v42-newcards/shas"
          [[ "${#hashes[@]}" == 3 ]]
          args=()
          for v in "${hashes[@]}"; do
            [[ "$v" =~ ^[0-9a-f]{64}$ ]]
            args+=("'$v'")
          done
          set +e
          ssh -T -i "$RUNNER_TEMP/v42-newcards/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - ${args[*]}" \
            < ops/serviceit_vps_b2b_v42_new_cards_readonly.py \
            > "$RUNNER_TEMP/v42-newcards/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V42_NEW_CARDS_[A-Z0-9_]{2,70}=(YES|NO|[A-Z0-9_]{2,100}|[0-9]{1,4})$' \
            "$RUNNER_TEMP/v42-newcards/status" | head -110 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V42_NEW_CARDS_CRM_WRITES=0' "$RUNNER_TEMP/v42-newcards/status"
          grep -qx 'V42_NEW_CARDS_SOURCE_MATCH=YES' "$RUNNER_TEMP/v42-newcards/status"
          grep -qx 'V42_NEW_CARDS_CARDS_CHECKED=3' "$RUNNER_TEMP/v42-newcards/status"
          grep -qx 'V42_NEW_CARDS_POSTGRES_WRITES=0' "$RUNNER_TEMP/v42-newcards/status"
