name: ServiceIT V18 old native in-flight receipt read-only diagnosis
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v18-native-inflight-audit
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V18_NATIVE_INFLIGHT_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact six production modules and no-write probe
        shell: bash
        run: |
          set -euo pipefail
          reviewed='0bafb328640e60f7b9656e145f4eed96c7dd0dfb'
          git cat-file -e "$reviewed^{commit}"
          names=(serviceit_b2b_public_mirrors.py
            serviceit_b2b_tender_index_v18.py
            serviceit_vps_b2b_deep_research.py
            serviceit_b2b_dossier_v11.py
            serviceit_vps_worker.py
            serviceit_vps_b2b_dossier_v11_worker.py)
          for name in "${names[@]}"; do
            git diff --quiet "$reviewed" HEAD -- "leadpilot/$name"
          done
          script=ops/serviceit_vps_b2b_v18_native_inflight_audit.py
          python -m py_compile "$script"
          git cat-file -e '8f5046d867cd403c85b8d17c2b80d83eb7e15a65^{commit}'
          git diff --quiet 8f5046d867cd403c85b8d17c2b80d83eb7e15a65 HEAD -- "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v18-mkb"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v18-mkb/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v18-mkb/hosts"
          chmod 0600 "$RUNNER_TEMP/v18-mkb/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v18-mkb/hosts" >/dev/null

      - name: Read-only unresolved native receipt namespace, age and same-card check
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v18-mkb/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/v18-mkb/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_v18_native_inflight_audit.py \
            > "$RUNNER_TEMP/v18-mkb/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V18_NATIVE_[A-Z0-9_]{3,62}=(YES|NO|[0-9]{1,5}|[A-Z0-9_]{5,75})$' \
            "$RUNNER_TEMP/v18-mkb/status" | head -45 || true
          [[ "$rc" == 0 ]]
          grep -q '^V18_NATIVE_ROWS=' "$RUNNER_TEMP/v18-mkb/status"
