name: ServiceIT B2B cited RouterAI deep research guarded VPS activation
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-vps-native-shadow-readonly
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_DEEP_ACTIVATE_GUARDED_314'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile reviewed source and pin VPS SSH identity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_deep_activate.py
          python -m py_compile \
            leadpilot/serviceit_vps_worker.py \
            leadpilot/serviceit_vps_native_fence.py \
            leadpilot/serviceit_vps_b2b_deep_research.py \
            leadpilot/serviceit_b2b_routerai_deep.py \
            leadpilot/serviceit_public_evidence_research.py \
            leadpilot/serviceit_windows_autofill.py \
            leadpilot/serviceit_b2b_hold_ai_fields.py
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]{7,16}$ ]]
          install -d -m 0700 "$RUNNER_TEMP/serviceit-deep"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-deep/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-deep/known_hosts"
          chmod 0600 "$RUNNER_TEMP/serviceit-deep/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/serviceit-deep/known_hosts" >/dev/null
      - name: Send only reviewed seven module files and offline deploy script
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-deep/known_hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          dest="$VPS_USER@$VPS_HOST"
          target="serviceit/staging/b2b-deep-$GITHUB_RUN_ID"
          names=(
            serviceit_vps_worker.py serviceit_vps_native_fence.py
            serviceit_vps_b2b_deep_research.py serviceit_b2b_routerai_deep.py
            serviceit_public_evidence_research.py serviceit_windows_autofill.py
            serviceit_b2b_hold_ai_fields.py
          )
          : > "$RUNNER_TEMP/serviceit-deep/shas"
          for name in "${names[@]}"; do
            sha256sum "leadpilot/$name" | cut -d ' ' -f 1 \
              >> "$RUNNER_TEMP/serviceit-deep/shas"
          done
          sha256sum ops/serviceit_vps_b2b_deep_activate.py | cut -d ' ' -f 1 \
            > "$RUNNER_TEMP/serviceit-deep/script-sha"
          ssh -T -i "$RUNNER_TEMP/serviceit-deep/id" "${opts[@]}" "$dest" \
            "umask 077; install -d -m 0700 '$target'"
          for name in "${names[@]}"; do
            scp -i "$RUNNER_TEMP/serviceit-deep/id" "${opts[@]}" \
              "leadpilot/$name" "$dest:$target/$name"
          done
          scp -i "$RUNNER_TEMP/serviceit-deep/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_deep_activate.py "$dest:$target/activate.py"
      - name: Offline image build, guarded live coordinator-only enable
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-deep/known_hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t shas < "$RUNNER_TEMP/serviceit-deep/shas"
          [[ "${#shas[@]}" == 7 ]]
          scriptsha="$(cat "$RUNNER_TEMP/serviceit-deep/script-sha")"
          for value in "$scriptsha" "${shas[@]}"; do
            [[ "$value" =~ ^[a-f0-9]{64}$ ]]
          done
          ssh -T -i "$RUNNER_TEMP/serviceit-deep/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$GITHUB_RUN_ID' '$scriptsha' '${shas[0]}' '${shas[1]}' '${shas[2]}' '${shas[3]}' '${shas[4]}' '${shas[5]}' '${shas[6]}'" \
            > "$RUNNER_TEMP/serviceit-deep/status" <<'REMOTE'
          set -euo pipefail
          runid="$1"; scriptsha="$2"; shift 2
          [[ "$runid" =~ ^[0-9]{7,16}$ && "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          for digest in "$@"; do [[ "$digest" =~ ^[a-f0-9]{64}$ ]]; done
          script="$HOME/serviceit/staging/b2b-deep-$runid/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$scriptsha" "$script" | sha256sum --check --status
          python3 "$script" "$runid" "$@"
          REMOTE
          grep -E '^B2B_DEEP_[A-Z0-9_]+=(YES|NO|FAILED|NOT_NEEDED|READY_FOR_FIVE_MINUTE_WORKER)$' \
            "$RUNNER_TEMP/serviceit-deep/status" | head -35
          grep -qx 'B2B_DEEP_VPS_LIVE_ENABLED=YES' "$RUNNER_TEMP/serviceit-deep/status"
      - name: Write sanitized outcome to project issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/serviceit-deep/status"
          safe="$(grep -E '^B2B_DEEP_[A-Z0-9_]+=(YES|NO|FAILED|NOT_NEEDED|READY_FOR_FIVE_MINUTE_WORKER)$' "$file" 2>/dev/null | head -35 || true)"
          [[ -n "$safe" ]] || safe='B2B_DEEP_VPS_ACTIVATION_UNVERIFIED=YES'
          body="$(printf 'B2B deep cited research VPS status:\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nOnly core container, no source or auxiliary restarts. No CRM data or secrets in logs. Check actual 9-field Bitrix readback separately.' "$safe" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/314/comments" -X POST --raw-field "body=$body" >/dev/null || true
