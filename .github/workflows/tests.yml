name: Service IT LeadGen tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apps-script-free-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline Apps Script V8 Gmail parser, HMAC, dedup and trigger tests
        run: node integrations/apps_script/tests/test_apps_script.cjs
      - name: Offline Bitrix event web-app relay HMAC and dedup tests
        run: node integrations/bitrix_event_bridge/tests/test_bridge.cjs
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q leadpilot
      - name: Run local tests
        run: python scripts/serviceit_offline_pytest.py
  windows-serviceit-autofill:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline scheduled new-card worker and shared detail layout tests
        run: python -m pytest -q tests/test_serviceit_windows_autofill.py tests/test_serviceit_common_card_layout.py tests/test_serviceit_windows_autofill_schedule_contract.py
      - name: Parse Windows PowerShell 5.1 scripts without executing or reading secrets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
              'scripts/INSTALL_SERVICEIT_ALL_CARD_AUTOFILL.ps1',
              'scripts/RUN_SERVICEIT_ALL_CARD_AUTOFILL.ps1',
              'scripts/INSTALL_SERVICEIT_FREE_B2B_AUTOMATION_V8.ps1',
              'scripts/RUN_SERVICEIT_BITRIX_AI_CODEX_HEADLESS.ps1',
              'scripts/INSTALL_SERVICEIT_BITRIX_EVENT_BRIDGE.ps1',
              'scripts/ENSURE_SERVICEIT_NODE_LTS.ps1'
          )) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) { foreach ($e in $errors) { Write-Output ($path + ': ' + $e.ToString()) }; throw 'AUTOFILL_PS51_SYNTAX_FAILURE' }
              Write-Output 'AUTOFILL_PS51_PARSE_PASS'
          }
  windows-universal-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: SQLite concurrency, recovery and universal worker mocks
        run: python -m pytest -q tests/test_serviceit_enrichment_worker.py
      - name: Read-only production readiness mocks (no real CRM)
        run: python -m pytest -q tests/test_serviceit_production_readiness.py
  windows-cockpit-secure-input:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax and synthetic SecureString handoff
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_AI_COCKPIT_SECURE_INPUT.ps1
      - name: PowerShell 5.1 parse B2B Bitrix operators (no credentials/network)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/RUN_SERVICEIT_B2B_TO_BITRIX_READONLY.ps1', 'scripts/RUN_SERVICEIT_B2B_ONE_HOLD_CARD.ps1', 'scripts/RUN_SERVICEIT_B2B_GMAIL_SOURCE.ps1')) {
            $resolved = (Resolve-Path -LiteralPath $path).Path
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw "B2B_PS51_PARSE_FAILED: $path" }
            $bytes = [System.IO.File]::ReadAllBytes($resolved)
            if (@($bytes | Where-Object { $_ -ge 128 }).Count -gt 0) { throw "B2B_PS51_NON_ASCII_BLOCKED: $path" }
            Write-Output "B2B_PS51_PARSE_PASS: $path"
          }
  windows-gigachat-cockpit-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 synthetic GigaChat opt-in and env restoration
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_GIGACHAT_COCKPIT_PREFLIGHT.ps1
  windows-cockpit-gigachat-handoff:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic Bitrix and GigaChat handoff (no external calls)
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_AI_COCKPIT_GIGACHAT_HANDOFF.ps1
  windows-score-badge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic guarded score badge operator and SecureString handoff
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_KANBAN_SCORE_BADGE.ps1
  windows-kanban-badge-recovery-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recovery diagnostic uses only SecureString and read-only CLI flags
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_KANBAN_BADGE_READONLY_DIAG.ps1
  windows-kanban-badge-reconciliation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic explicit reconciliation and SecureString handoff
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_KANBAN_BADGE_RECONCILIATION.ps1
  windows-all-lead-score-batch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic offline batch score PowerShell operator
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_ALL_LEAD_SCORE_PREVIEW.ps1
  windows-all-lead-crm-schema-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strictly read-only corporate schema preflight and SecureString handoff
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_ALL_LEAD_CRM_SCHEMA_READONLY.ps1
  windows-all-lead-crm-create-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline complete 1062 create preview PowerShell smoke
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_ALL_LEAD_CRM_CREATE_PREVIEW.ps1
  windows-event-queue-crm-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strictly offline event queue read-only PowerShell operator
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_EVENT_QUEUE_CRM_READONLY.ps1
  docker-event-receiver-private:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check loopback-only Compose config without production credentials
        env:
          SERVICEIT_BITRIX_APPLICATION_TOKEN: SYNTHETIC-CI-NOT-A-REAL-BITRIX-APPLICATION-TOKEN-00000
        run: docker compose -f deploy/serviceit-event-receiver.compose.yml config --quiet
      - name: Build event-only container (no production secrets)
        run: docker build --file Dockerfile.serviceit-event-receiver --tag serviceit-event-receiver:ci .
      - name: Worker cold start stays offline and rejects missing approval
        run: |
          docker run --rm serviceit-event-receiver:ci python -m leadpilot.serviceit_enrichment_worker
          set +e
          docker run --rm serviceit-event-receiver:ci python -m leadpilot.serviceit_enrichment_worker --serve
          result=$?
          set -e
          test "$result" -eq 2
      - name: Validate receiver and worker overlay with synthetic paths only
        env:
          SERVICEIT_BITRIX_APPLICATION_TOKEN: SYNTHETIC-CI-NOT-A-REAL-BITRIX-APPLICATION-TOKEN-00000
        run: |
          mkdir -p "$RUNNER_TEMP/serviceit-approvals"
          echo SYNTHETIC-NONSECRET > "$RUNNER_TEMP/serviceit-secret"
          export SERVICEIT_APPROVAL_HOST_DIR="$RUNNER_TEMP/serviceit-approvals"
          export SERVICEIT_REST_SECRET_FILE="$RUNNER_TEMP/serviceit-secret"
          export SERVICEIT_GIGACHAT_SECRET_FILE="$RUNNER_TEMP/serviceit-secret"
          docker compose -f deploy/serviceit-event-receiver.compose.yml -f deploy/serviceit-enrichment.compose.yml config --quiet
      - name: Run synthetic authenticated intake and duplicate smoke
        env:
          SERVICEIT_BITRIX_APPLICATION_TOKEN: SYNTHETIC-CI-NOT-A-REAL-BITRIX-APPLICATION-TOKEN-00000
        run: |
          docker run -d --name serviceit-event-ci \
            -p 127.0.0.1:18780:8000 \
            -e SERVICEIT_BITRIX_APPLICATION_TOKEN \
            -e SERVICEIT_BITRIX_EVENT_QUEUE_DB=/var/lib/serviceit/new-card-events.sqlite3 \
            serviceit-event-receiver:ci
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18780/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/TEST_SERVICEIT_EVENT_RECEIVER_DOCKER.py
      - name: Stop temporary receiver
        if: always()
        run: docker rm -f serviceit-event-ci || true
  windows-b2b-card7-preliminary-backfill:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact item7 backfill one-shot approval gate and secure mock
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_B2B_CARD7_PRELIMINARY_BACKFILL.ps1
  windows-card7-forensic-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: No-apply card7 forensic SecureString Windows test
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_B2B_CARD7_FORENSIC_READONLY.ps1
  windows-card7-postapply-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only postapply CRM and ledger reconciliation mocked secure CLI
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_B2B_CARD7_POSTAPPLY_READONLY.ps1
  windows-card7-prewrite-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: No-reservation prewrite forensic CLI mock on Windows
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_B2B_CARD7_PREWRITE_STAGE_READONLY.ps1
  windows-card7-local-sqlite-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-webhook local-only SQLite probe PowerShell 5.1 syntax
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_CARD7_LOCAL_SQLITE_PROBE.ps1
      - name: Real Windows SQLite transaction in disposable state directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ServiceIT-SQLite-Private-Test'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          python -m leadpilot.serviceit_card7_sqlite_local_probe --local-only
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_SQLITE_LOCAL_PROBE_FAILED' }
          $RealLedger = Join-Path $env:LOCALAPPDATA 'ServiceIT\Existing-B2B-Hold-AI\backfill-v1.sqlite3'
          if (Test-Path -LiteralPath $RealLedger) { throw 'TEST_CREATED_A_REAL_LEDGER' }
