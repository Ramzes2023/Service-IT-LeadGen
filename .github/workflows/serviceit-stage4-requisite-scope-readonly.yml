name: ServiceIT stage4 corporate requisites exact INN scope (READ ONLY)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-stage4-requisite-scope-readonly
  cancel-in-progress: false
jobs:
  requisite-readonly:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 148 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_STAGE4_REQUISITES_READONLY_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Read-only corporate requisite schema and synthetic INN visibility
        run: python -m leadpilot.serviceit_stage4_requisite_scope_readonly
