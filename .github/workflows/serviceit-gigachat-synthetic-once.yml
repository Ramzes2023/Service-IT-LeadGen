name: ServiceIT GigaChat one-time synthetic 9-field preflight (no CRM)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: serviceit-gigachat-synthetic-preflight-once
  cancel-in-progress: false

jobs:
  one-synthetic-only:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 74 &&
      !github.event.issue.pull_request &&
      (github.event.comment.body == 'SERVICEIT_GIGACHAT_SYNTHETIC_ONCE_V1' ||
       github.event.comment.body == 'SERVICEIT_GIGACHAT_OAUTH_DIAG_V1') &&
      vars.SERVICEIT_WORKER_MODEL_PRIVACY_APPROVED == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AI_PROVIDER: gigachat
      AI_ENABLE: '1'
      SERVICEIT_WORKER_MODEL_PRIVACY_APPROVED: ${{ vars.SERVICEIT_WORKER_MODEL_PRIVACY_APPROVED }}
      GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      GIGACHAT_SCOPE: ${{ vars.GIGACHAT_SCOPE }}
      GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify pinned Ministry root and create GigaChat-only TLS trust
        shell: bash
        run: |
          python -m leadpilot.serviceit_gigachat_ca_setup "$RUNNER_TEMP/serviceit-gigachat-verified-ca.pem"
          echo "GIGACHAT_CA_BUNDLE_FILE=$RUNNER_TEMP/serviceit-gigachat-verified-ca.pem" >> "$GITHUB_ENV"
      - name: Exactly one synthetic GigaChat classification and nine-field report validation
        if: github.event.comment.body == 'SERVICEIT_GIGACHAT_SYNTHETIC_ONCE_V1'
        run: python -m leadpilot.serviceit_gigachat_cockpit_preflight --live-synthetic
      - name: OAuth/TLS diagnostic only, no model completion or CRM
        if: github.event.comment.body == 'SERVICEIT_GIGACHAT_OAUTH_DIAG_V1'
        run: python -m leadpilot.serviceit_gigachat_oauth_diag
