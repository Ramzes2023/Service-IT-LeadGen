name: ServiceIT stage4 evidence-verified formal Score for ALL future 1062/21 cards
on:
  repository_dispatch:
    types: [serviceit_bitrix_item_add_v1]
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
permissions:
  contents: write
concurrency:
  group: serviceit-bitrix-new-card-free-event
  cancel-in-progress: false
jobs:
  score-after-corporate-proof:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      vars.SERVICEIT_STAGE4_CORPORATE_VERIFIER_ENABLED == 'YES_VERIFIED_9_GATES_1062_21' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'repository_dispatch' &&
        github.event.action == 'serviceit_bitrix_item_add_v1'))
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SERVICEIT_STAGE4_SIGNED_SCORE_WRITE_ENABLED: YES_1062_21_SIGNED_ONLY
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_EVENT_BRIDGE_KEY: ${{ secrets.SERVICEIT_BITRIX_EVENT_BRIDGE_KEY }}
      SERVICEIT_GH_LEDGER_KEY: ${{ secrets.SERVICEIT_GH_LEDGER_KEY }}
      SERVICEIT_BITRIX_POLL_START_UTC: ${{ vars.SERVICEIT_BITRIX_POLL_START_UTC }}
      # The external corporate verifier, NOT GigaChat, must supply these.
      SERVICEIT_STAGE4_CORPORATE_RECEIPTS_JSON: ${{ secrets.SERVICEIT_STAGE4_CORPORATE_RECEIPTS_JSON }}
      SERVICEIT_STAGE4_VERIFIER_KEY: ${{ secrets.SERVICEIT_STAGE4_VERIFIER_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify signed nine-gate corporate proof and write ONLY formal Score + badge when valid
        run: python -m leadpilot.serviceit_stage4_all_new_signed_score_writer
