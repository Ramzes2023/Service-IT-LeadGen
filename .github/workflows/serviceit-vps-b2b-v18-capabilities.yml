name: ServiceIT V18 Brave Context and Chromium live CAPABILITY READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v18-live-capability
  cancel-in-progress: false
jobs:
  capability_audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V18_CAPABILITIES_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate audited no-CRM capability probe and SSH host
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_v18_live_capabilities.py
          git cat-file -e 'e732da89838321a22f72f66b63e3e61b3606b0d2^{commit}'
          git diff --quiet e732da89838321a22f72f66b63e3e61b3606b0d2 HEAD -- ops/serviceit_vps_b2b_v18_live_capabilities.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v18-readonly"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v18-readonly/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v18-readonly/hosts"
          chmod 0600 "$RUNNER_TEMP/v18-readonly/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v18-readonly/hosts" >/dev/null
      - name: Check live VPS Bridge, Brave LLM Context and robots WITHOUT CRM
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v18-readonly/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/v18-readonly/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_v18_live_capabilities.py \
            > "$RUNNER_TEMP/v18-readonly/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V18_PROBE_[A-Z0-9_]{3,48}=(YES|NO|HTTP_200|HTTP_403|HTTP_429|HTTP_OTHER|NETWORK_ERROR|NOT_RUN|ALLOWED|DENIED|UNKNOWN)$' \
            "$RUNNER_TEMP/v18-readonly/status" | head -40 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V18_PROBE_FIVE_MINUTE_LIVE_GATES=YES' "$RUNNER_TEMP/v18-readonly/status"
