name: ServiceIT V37 four signed cards field availability READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v37-four-field-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V37_FIELDS_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin read-only diagnostic source and pre-approved VPS SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/v37-fielddiag"
          python -m py_compile ops/serviceit_vps_b2b_v37_fields_diagnostic.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v37-fielddiag/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v37-fielddiag/hosts"
          chmod 0600 "$RUNNER_TEMP/v37-fielddiag/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v37-fielddiag/hosts" >/dev/null
      - name: Read Bitrix fields and four signed B2B records without mutations
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v37-fielddiag/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/v37-fielddiag/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_v37_fields_diagnostic.py \
            > "$RUNNER_TEMP/v37-fielddiag/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V37_FIELD_DIAG_[A-Z0-9_]{2,70}=(YES|NO|[A-Z0-9_]{2,100}|[0-9]{1,4})$' \
            "$RUNNER_TEMP/v37-fielddiag/status" | head -40 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V37_FIELD_DIAG_CRM_WRITES=0' "$RUNNER_TEMP/v37-fielddiag/status"
          grep -qx 'V37_FIELD_DIAG_METADATA_READ=YES' "$RUNNER_TEMP/v37-fielddiag/status"
