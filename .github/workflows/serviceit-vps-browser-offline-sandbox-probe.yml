name: ServiceIT VPS Chromium sandbox-only offline seccomp probe (no CRM)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type PROBE_CHROMIUM_SANDBOX_OFFLINE_NO_CRM'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: serviceit-vps-native-shadow-readonly
  cancel-in-progress: false

jobs:
  sandbox-only:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      inputs.approval == 'PROBE_CHROMIUM_SANDBOX_OFFLINE_NO_CRM'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owner-only SSH and upload exact pinned Playwright seccomp profile
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          file=deploy/playwright-chromium-sandbox-seccomp.json
          python3 -m json.tool "$file" >/dev/null
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
          printf 'SECCOMP_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          dir="$RUNNER_TEMP/browser-sandbox-probe-ssh"
          mkdir -m 0700 -p "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/id" "$dir/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$dir/known_hosts" >/dev/null
          ssh -T -i "$dir/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'mkdir -p "$HOME/serviceit/staging"'
          scp -i "$dir/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o BatchMode=yes "$file" \
            "$VPS_USER@$VPS_HOST:serviceit/staging/chromium-seccomp-$sha.json"
          echo "CHROMIUM_SECCOMP_FILE_UPLOADED_NO_CORE_CHANGES=YES"
      - name: Run existing staged Chromium OFFLINE with Playwright seccomp profile
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/browser-sandbox-probe-ssh"
          ssh -T -i "$dir/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "bash -se -- $SECCOMP_SHA" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          [[ "$sha" =~ ^[a-f0-9]{64}$ ]] || exit 2
          seccomp="$HOME/serviceit/staging/chromium-seccomp-$sha.json"
          [[ -f "$seccomp" && ! -L "$seccomp" ]] || exit 2
          printf '%s  %s\n' "$sha" "$seccomp" | sha256sum --check --status || exit 2
          docker image inspect serviceit-vps-public-browser:staged >/dev/null
          sysctl_file=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$sysctl_file" ]]; then
             case "$(cat "$sysctl_file")" in
               1) echo 'APPARMOR_UNPRIVILEGED_USERNS_RESTRICT=ON';;
               0) echo 'APPARMOR_UNPRIVILEGED_USERNS_RESTRICT=OFF';;
               *) echo 'APPARMOR_UNPRIVILEGED_USERNS_RESTRICT=UNKNOWN';;
             esac
          else
             echo 'APPARMOR_UNPRIVILEGED_USERNS_RESTRICT=UNKNOWN'
          fi
          if docker run --rm --network none --read-only \
              --user pwuser --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --security-opt "seccomp=$seccomp" \
              --security-opt "apparmor=serviceit-chromium" \
              --memory 1g --pids-limit 96 --shm-size 256m \
              --tmpfs /tmp:size=256m,mode=1777 \
              serviceit-vps-public-browser:staged \
              python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True,chromium_sandbox=True); b.close(); p.stop()' \
              >/dev/null 2>&1; then
            echo 'CHROMIUM_SANDBOX_WITH_SCOPED_SECCOMP_APPARMOR=PASS'
            echo 'CRM_WRITES=0;BROWSER_URLS_VISITED=0;CORE_LIVE_UNCHANGED=YES'
          else
            echo 'CHROMIUM_SANDBOX_WITH_SCOPED_SECCOMP_APPARMOR=FAIL'
            echo 'CORE_LIVE_UNCHANGED=YES;CRM_WRITES=0;BROWSER_URLS_VISITED=0'
            echo 'NEXT=REVIEW_CUSTOM_APPARMOR_PROFILE_AND_KERNEL_NO_NO_SANDBOX'
            exit 2
          fi
          REMOTE
