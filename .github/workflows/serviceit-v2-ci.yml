name: Service IT V2 isolated source core
on:
  pull_request:
    paths:
      - 'leadpilot/serviceit_v2_*'
      - 'tests/test_serviceit_v2_*'
      - 'deploy/serviceit-v2*'
      - 'Dockerfile.serviceit-v2'
      - 'requirements-v2.txt'
      - '.github/workflows/serviceit-v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-and-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: serviceitv2_test
          POSTGRES_USER: serviceitv2_test
          POSTGRES_PASSWORD: synthetic_ci_only_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SERVICEIT_V2_TEST_ENABLE: 'YES'
      SERVICEIT_V2_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5433 dbname=serviceitv2_test user=serviceitv2_test password=synthetic_ci_only_password'
      SERVICEIT_V2_GMAIL_AUTOPOLL_ENABLED: 'NO'
      SERVICEIT_V2_PG_PASSWORD: synthetic_compose_config_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated V2 runtime
        run: python -m pip install -r requirements-v2.txt
      - name: Compile modules
        run: python -m compileall -q leadpilot
      - name: Mock OAuth and REAL disposable PostgreSQL test
        run: python -m pytest -q tests/test_serviceit_v2_gmail.py tests/test_serviceit_v2_postgres.py tests/test_serviceit_v2_delivery.py tests/test_serviceit_v2_fns_qualification.py
      - name: Compose safety / isolation check
        run: |
          docker compose -f deploy/serviceit-v2.compose.yml config --quiet
          python - <<'PY'
          from pathlib import Path
          text=Path('deploy/serviceit-v2.compose.yml').read_text()
          assert 'ports:' not in text and 'SERVICEIT_V2_GMAIL_AUTOPOLL_ENABLED' in text
          assert 'serviceit_v2_db:' in text and 'crm.item.add' not in text
          PY
      - name: Build V2 isolated source container
        run: docker build -f Dockerfile.serviceit-v2 -t serviceit-v2:ci .
