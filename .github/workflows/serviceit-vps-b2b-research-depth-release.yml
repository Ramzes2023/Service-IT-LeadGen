name: ServiceIT B2B research depth automatic passport and document release
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-vps-b2b-research-depth-release.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v37-search-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Fetch exact reviewed public repository revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet .
          git remote add origin https://github.com/Ramzes2023/Service-IT-LeadGen.git
          git fetch --no-tags origin main
          git checkout --quiet --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Verify new and previous document research module hashes
        shell: bash
        run: |
          set -euo pipefail
          reviewed="$GITHUB_SHA"
          old='ec1f94e960852e7d94d7b6706e0ab9f5f3256b1d'
          git cat-file -e "$reviewed^{commit}"
          git cat-file -e "$old^{commit}"
          names=(serviceit_b2b_public_mirrors.py serviceit_b2b_routerai_deep.py serviceit_vps_b2b_deep_research.py serviceit_b2b_tender_documents.py serviceit_vps_b2b_document_worker.py serviceit_b2b_dossier_consistency_v37.py serviceit_b2b_dossier_consistency_worker_v37.py serviceit_vps_worker.py)
          install -d -m 0700 "$RUNNER_TEMP/v37-release"
          : > "$RUNNER_TEMP/v37-release/new-hashes"
          : > "$RUNNER_TEMP/v37-release/old-hashes"
          for name in "${names[@]}"; do
            python -m py_compile "leadpilot/$name"
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v37-release/new-hashes"
            git show "$old:leadpilot/$name" | sha256sum | cut -d' ' -f1 >> "$RUNNER_TEMP/v37-release/old-hashes"
          done
          script=ops/serviceit_vps_b2b_v37_quality_release.py
          python -m py_compile "$script"
          sha256sum "$script" | cut -d' ' -f1 > "$RUNNER_TEMP/v37-release/script-sha"
          [[ "$(wc -l < "$RUNNER_TEMP/v37-release/new-hashes")" == 8 ]]
          [[ "$(wc -l < "$RUNNER_TEMP/v37-release/old-hashes")" == 8 ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v37-release/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v37-release/hosts"
          chmod 0600 "$RUNNER_TEMP/v37-release/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v37-release/hosts" >/dev/null
      - name: Transfer eight reviewed modules and release controller
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v37-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          stage="serviceit/staging/b2b-research-depth-onefile-release-$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          for name in serviceit_b2b_public_mirrors.py serviceit_b2b_routerai_deep.py serviceit_vps_b2b_deep_research.py serviceit_b2b_tender_documents.py serviceit_vps_b2b_document_worker.py serviceit_b2b_dossier_consistency_v37.py serviceit_b2b_dossier_consistency_worker_v37.py serviceit_vps_worker.py; do
            scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
              "leadpilot/$name" "$target:$stage/"
          done
          scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v37_quality_release.py "$target:$stage/activate.py"
      - name: Test modules offline and deploy coordinator with rollback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v37-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t new < "$RUNNER_TEMP/v37-release/new-hashes"
          mapfile -t old < "$RUNNER_TEMP/v37-release/old-hashes"
          [[ "${#new[@]}" == 8 && "${#old[@]}" == 8 ]]
          scriptsha="$(cat "$RUNNER_TEMP/v37-release/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          args=()
          for v in "${new[@]}" "${old[@]}"; do
            [[ "$v" =~ ^[a-f0-9]{64}$ ]]
            args+=("'$v'")
          done
          remote="bash -s -- '$GITHUB_RUN_ID' '$scriptsha' ${args[*]}"
          set +e
          ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" "$remote" \
            > "$RUNNER_TEMP/v37-release/status" <<'REMOTE'
          set -euo pipefail
          id="$1"; sha="$2"; shift 2
          [[ "$id" =~ ^[0-9]{7,16}$ && "$sha" =~ ^[a-f0-9]{64}$ && "$#" == 16 ]]
          for v in "$@"; do [[ "$v" =~ ^[a-f0-9]{64}$ ]]; done
          script="$HOME/serviceit/staging/b2b-research-depth-onefile-release-$id/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$sha" "$script" | sha256sum --check --status
          python3 "$script" --research-depth "$id" "$@"
          REMOTE
          rc=$?
          set -e
          grep -E '^RESEARCH_DEPTH_RELEASE_[A-Z0-9_]+=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,90})$' \
            "$RUNNER_TEMP/v37-release/status" | head -30 || true
          [[ "$rc" == 0 ]]
          grep -qx 'RESEARCH_DEPTH_RELEASE_VPS_LIVE_ENABLED=YES' "$RUNNER_TEMP/v37-release/status"
          grep -qx 'RESEARCH_DEPTH_RELEASE_CRM_WRITES_BY_INSTALLER=NO' "$RUNNER_TEMP/v37-release/status"
      - name: Reconcile new signed cards using the deployed automatic worker
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/v37-release"
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            < ops/serviceit_vps_b2b_research_depth_apply.py > "$stage/apply"
          grep -E '^DEPTH_APPLY_[A-Z0-9_]+=[A-Z0-9_]+$' "$stage/apply"
          grep -qx 'DEPTH_APPLY_ALL_READBACK=YES' "$stage/apply"
      - name: Independently audit all signed cards and new-card public attachments
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/v37-release"
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            < ops/serviceit_vps_b2b_research_depth_audit.py > "$stage/audit"
          grep -E '^DEPTH_[A-Z0-9_]+=[A-Z0-9_]+$' "$stage/audit"
          grep -qx 'DEPTH_CRM_WRITES=0' "$stage/audit"
