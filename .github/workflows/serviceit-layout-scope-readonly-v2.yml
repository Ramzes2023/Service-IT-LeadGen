name: ServiceIT stage3 scoped Kanban form and administrator preflight (READ ONLY)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-stage3-layout-scope-readonly
  cancel-in-progress: false
jobs:
  scoped-preview:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 148 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_STAGE3_LAYOUT_SCOPE_READONLY_V2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact 1062/21 category, shared layout and API admin rights (NO WRITES)
        run: python -m leadpilot.serviceit_layout_scope_readonly_v2
