name: ServiceIT compare supplied Bitrix webhook with stored GitHub secret (READ ONLY)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-webhook-identity-readonly
  cancel-in-progress: false
jobs:
  exact-webhook-secret-comparison:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 148 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'SERVICEIT_COMPARE_WEBHOOK_SHA256_V1:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      GITHUB_ACTOR: ${{ github.actor }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed project dependencies
        run: python -m pip install -r requirements.txt
      - name: Match high-entropy webhook fingerprint and verify 1062/21 task/CRM fields (NO WRITES)
        run: python -m leadpilot.serviceit_webhook_identity_readonly
