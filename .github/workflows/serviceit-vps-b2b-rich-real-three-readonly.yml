name: ServiceIT VPS B2B exact public 4673595 three-provider REAL READONLY check
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-rich-three-urls-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_RICH_THREE_REAL_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only VPS real public page evidence under source/robots gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_rich_real_three_readonly.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/real-rich"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/real-rich/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/real-rich/hosts"
          chmod 0600 "$RUNNER_TEMP/real-rich/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/real-rich/hosts" >/dev/null
          set +e
          ssh -T -i "$RUNNER_TEMP/real-rich/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/real-rich/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            < ops/serviceit_vps_b2b_rich_real_three_readonly.py \
            > "$RUNNER_TEMP/real-rich/result" 2>/dev/null
          rc=$?
          set -e
          grep -E '^RICH_PUBLIC_PROBE_[A-Z0-9_]{3,65}=(YES|NO)$' \
            "$RUNNER_TEMP/real-rich/result" | head -45 || true
          [[ "$rc" == 0 ]]
          grep -qx 'RICH_PUBLIC_PROBE_REVIEWED_SOURCE_SHA=YES' "$RUNNER_TEMP/real-rich/result"
          grep -qx 'RICH_PUBLIC_PROBE_PRODUCTION_LIVE=YES' "$RUNNER_TEMP/real-rich/result"
          grep -qx 'RICH_PUBLIC_PROBE_SAFE_FINISHED=YES' "$RUNNER_TEMP/real-rich/result"
