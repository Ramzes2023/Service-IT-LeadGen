name: ServiceIT VPS crossportal release gate diagnostics READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-crossportal-gates
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_CROSSPORTAL_GATES_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Inspect exact deployment gates without disclosing environment values
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/crossportal-gates"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/crossportal-gates/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/crossportal-gates/hosts"
          chmod 0600 "$RUNNER_TEMP/crossportal-gates/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/crossportal-gates/hosts" >/dev/null
          ssh -T -i "$RUNNER_TEMP/crossportal-gates/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/crossportal-gates/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            > "$RUNNER_TEMP/crossportal-gates/status" <<'PY'
          import os
          env=dict(os.environ)
          gates=(
            ("WRITER","SERVICEIT_VPS_WRITER_MODE","LIVE"),
            ("CUTOVER","SERVICEIT_VPS_CUTOVER_AUTHORIZED","YES"),
            ("GITHUB_OFF","SERVICEIT_VPS_OLD_GH_WRITERS_DISABLED_ACK","YES"),
            ("POLL","SERVICEIT_VPS_POLL_ENABLED","YES"),
            ("INTAKE","SERVICEIT_VPS_INTAKE_ENABLED","NO"),
            ("PROVIDER","SERVICEIT_AI_PROVIDER","routerai"),
            ("PRIVACY","SERVICEIT_ROUTERAI_PRIVACY_APPROVED","YES_1062_21"),
            ("MODEL_PRIVACY","SERVICEIT_WORKER_MODEL_PRIVACY_APPROVED","YES"),
            ("B2B_V4","SERVICEIT_VPS_B2B_DEEP_RESEARCH_ENABLED","YES"),
            ("BROWSER","SERVICEIT_VPS_BROWSER_RESEARCH_ENABLED","YES"),
            ("BROWSER_ISOLATION","SERVICEIT_VPS_BROWSER_PROXY_ISOLATION_VERIFIED","YES"),
          )
          for label,key,expected in gates:
              actual=env.get(key)
              status=("MISSING" if actual is None else
                      "YES" if actual==expected else "NO")
              print("CROSSPORTAL_GATE_"+label+"="+status,flush=True)
          from leadpilot.serviceit_vps_worker import live_permitted
          print("CROSSPORTAL_GATE_SEMANTIC_LIVE=" +
                ("YES" if live_permitted(env) else "NO"),flush=True)
          PY
          grep -E '^CROSSPORTAL_GATE_[A-Z0-9_]+=(YES|NO|MISSING)$' \
            "$RUNNER_TEMP/crossportal-gates/status"
          [[ "$(grep -c '^CROSSPORTAL_GATE_' "$RUNNER_TEMP/crossportal-gates/status")" == 12 ]]
