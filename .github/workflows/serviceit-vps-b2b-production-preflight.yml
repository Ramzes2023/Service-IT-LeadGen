name: ServiceIT B2B production deploy preflight (read only)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-production-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_B2B_DEPLOY_PREFLIGHT_READONLY_314'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - name: Prepare pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          install -d -m 0700 "$RUNNER_TEMP/b2b-check"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/b2b-check/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/b2b-check/known_hosts"
          chmod 0600 "$RUNNER_TEMP/b2b-check/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/b2b-check/known_hosts" >/dev/null
      - name: Inspect existing containers and mounted secret presence without data
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/b2b-check/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-check/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' > "$RUNNER_TEMP/b2b-check/status" <<'PY'
          import subprocess, json, re
          def call(*argv):
              try:
                  p=subprocess.run(argv,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                      text=True,timeout=12,stdin=subprocess.DEVNULL)
                  return p.returncode,p.stdout
              except (OSError,subprocess.TimeoutExpired):
                  return 255,""
          def out(name,value):
              print("B2BDEP_"+name+"="+("YES" if value is True else "NO" if value is False else "UNVERIFIED"))
          for role in ("receiver","writer"):
              container="serviceit-b2b-vps-"+role+"-1"
              rc,raw=call("docker","inspect",container)
              if rc or not raw:
                  out(role.upper()+"_INSPECT",None)
                  continue
              item=json.loads(raw)[0]
              out(role.upper()+"_RUNNING",item.get("State",{}).get("Running") is True)
              env=dict(x.split("=",1) for x in item.get("Config",{}).get("Env",[]) if "=" in x)
              for key in ("SERVICEIT_VPS_B2B_RECEIVER_ENABLED","SERVICEIT_VPS_B2B_WRITER_ENABLED",
                          "SERVICEIT_VPS_B2B_GH_WRITERS_DISABLED_ACK","SERVICEIT_VPS_CUTOVER_AUTHORIZED",
                          "SERVICEIT_VPS_POLL_ENABLED","SERVICEIT_VPS_OLD_GH_WRITERS_DISABLED_ACK"):
                  if role=="receiver" and key.endswith(("WRITER_ENABLED","CUTOVER_AUTHORIZED","POLL_ENABLED","OLD_GH_WRITERS_DISABLED_ACK")):
                      continue
                  out(role.upper()+"_"+key.removeprefix("SERVICEIT_VPS_"),env.get(key)=="YES" if key in env else None)
              mounts=item.get("Mounts",[])
              for name in ("serviceit_pg_password","serviceit_bitrix_webhook","serviceit_b2b_hmac"):
                  path="/run/secrets/"+name
                  found=[x for x in mounts if x.get("Destination")==path]
                  out(role.upper()+"_MOUNT_"+name.upper(),bool(found))
                  rc2,result=call("docker","exec",container,"python","-c",
                      "import os; p='"+path+"'; print('YES' if os.path.isfile(p) and os.access(p,os.R_OK) and os.stat(p).st_size>0 else 'NO')")
                  out(role.upper()+"_READABLE_"+name.upper(),result.strip()=="YES" if rc2==0 else None)
              labels=item.get("Config",{}).get("Labels") or {}
              out(role.upper()+"_COMPOSE_PATH_PRESENT",
                  bool(labels.get("com.docker.compose.project.config_files")))
              out(role.upper()+"_COMPOSE_WORKDIR_PRESENT",
                  bool(labels.get("com.docker.compose.project.working_dir")))
              rc2,sha=call("docker","image","inspect","-f","{{.Id}}",item.get("Image",""))
              out(role.upper()+"_IMAGE_INSPECTABLE",rc2==0 and sha.strip().startswith("sha256:"))
          rc,sha=call("docker","image","inspect","-f","{{.Id}}",
                  "serviceit-vps-b2b-direct:20261109-pilot")
          out("STAGED_IMAGE_PRESENT",rc==0 and sha.strip().startswith("sha256:"))
          rc,vers=call("docker","compose","version","--short")
          out("COMPOSE_AVAILABLE",rc==0)
          print("B2BDEP_PREFLIGHT_DONE=YES")
          PY
          grep -E '^B2BDEP_[A-Z0-9_]+=(YES|NO|UNVERIFIED)$' "$RUNNER_TEMP/b2b-check/status" | head -70
          grep -qx 'B2BDEP_PREFLIGHT_DONE=YES' "$RUNNER_TEMP/b2b-check/status"
      - name: Publish sanitized statuses to issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/b2b-check/status"
          summary="$(grep -E '^B2BDEP_[A-Z0-9_]+=(YES|NO|UNVERIFIED)$' "$f" 2>/dev/null | head -70 || true)"
          [[ -n "$summary" ]] || summary="B2BDEP_PREFLIGHT_DONE=UNVERIFIED"
          msg="$(printf 'B2B deployment compatibility, READ ONLY:\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nNo container changes, no key values or paths exposed, CRM writes=0.' "$summary" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/314/comments" -X POST --raw-field "body=$msg" >/dev/null || true
