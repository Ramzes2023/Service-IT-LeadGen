name: ServiceIT B2B V8 four actual buyer evidence gaps READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v8-source-evidence-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_B2B_V8_SOURCE_GAPS_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Non-root pinned SSH and public-web evidence-only diagnostics
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v8-buyer"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v8-buyer/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v8-buyer/known_hosts"
          chmod 600 "$RUNNER_TEMP/v8-buyer/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v8-buyer/known_hosts" >/dev/null
          ssh -T -i "$RUNNER_TEMP/v8-buyer/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/v8-buyer/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' <<'PY'
          import os
          import httpx
          from leadpilot.serviceit_vps_pg_queue import db,secret_file
          from leadpilot.serviceit_enrichment_worker import Rest,normalized,validate_identity
          from leadpilot.serviceit_vps_b2b_deep_research import (
              safe_notice,source_findings,public_buyer_candidate,
              published_buyer_inn_evidence
          )
          from leadpilot.serviceit_b2b_public_supplement import source_backed_company_inn_update
          from leadpilot.serviceit_b2b_hold_ai_fields import AI_FIELDS,PREFIX
          from leadpilot.bitrix_1062_mapping import _is_valid_inn
          env=dict(os.environ)
          with db(env) as conn:
              with conn.transaction():
                  with conn.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")
                      cur.execute("SELECT b.card_id,b.source_id,b.notice_json FROM serviceit_vps_b2b_inbox b WHERE b.state='VERIFIED' AND b.card_id IS NOT NULL ORDER BY b.received_at,b.source_id LIMIT 5")
                      rows=cur.fetchall()
          print('V8_GAPS_FOUR_VERIFIED='+('YES' if len(rows)==4 else 'NO'),flush=True)
          assert len(rows)==4
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=20) as client:
              rest=Rest(secret_file(env,'SERVICEIT_BITRIX_WEBHOOK'),client)
              for index,(card,source,notice) in enumerate(rows,1):
                  prefix='V8_GAPS_CARD_'+str(index)+'_'
                  try:
                      item=normalized(rest('crm.item.get',{
                          'entityTypeId':1062,'id':card,'useOriginalUfNames':'Y'})['item'])
                      validate_identity(item,card)
                      safe_notice(notice,card,source,item)
                      print(prefix+'BASE_NINE='+('YES' if all(
                          isinstance(item.get(k),str) and item[k].strip()
                          for k in AI_FIELDS) else 'NO'),flush=True)
                      findings=source_findings(item,notice,env,client)
                      status=findings.get('status') if isinstance(findings,dict) else ''
                      print(prefix+'READABLE='+('YES' if status=='PUBLIC_PAGES_INSPECTED'
                           else 'NO'),flush=True)
                      buyer=public_buyer_candidate(findings)
                      print(prefix+'BUYER_LABEL='+('YES' if buyer else 'NO'),flush=True)
                      independent=findings.get('independent_company_research')
                      independent=independent if isinstance(independent,dict) else {}
                      printed=independent.get('public_inn')
                      site_ok=(isinstance(printed,dict) and
                          printed.get('provenance')=='PUBLIC_CORPORATE_SELF_DECLARATION'
                          and _is_valid_inn(printed.get('inn')))
                      print(prefix+'CORPORATE_INN='+('YES' if site_ok else 'NO'),flush=True)
                      public=published_buyer_inn_evidence(findings)
                      print(prefix+'BUYER_INN_MATCH='+('YES' if public else 'NO'),flush=True)
                      updated=source_backed_company_inn_update(item,findings)
                      print(prefix+'SAFE_THREE_FIELDS='+('YES' if updated else 'NO'),flush=True)
                      print(prefix+'PUBLIC_PAGES='+str(min(len(findings.get('pages') or []),9)),flush=True)
                      print(prefix+'COMPANY_PAGES='+str(min(len(independent.get('pages') or []),9)),flush=True)
                  except Exception:
                      print(prefix+'READ_FAILED=YES',flush=True)
          print('V8_GAPS_READONLY=YES',flush=True)
          PY
