name: ServiceIT FNS prerequisite Bitrix list failure codes READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-fns-bitrix-list-reason
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_FNS_BITRIX_POLL_REASON_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Inspect FNS prerequisite PostgreSQL and existing Bitrix GET shape only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/fns-why"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/fns-why/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/fns-why/known"
          chmod 600 "$RUNNER_TEMP/fns-why/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/fns-why/known" >/dev/null
          ssh -T -i "$RUNNER_TEMP/fns-why/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/fns-why/known" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' <<'PY'
          import os,re
          import httpx
          from datetime import datetime,timezone
          from leadpilot.serviceit_vps_pg_queue import db,secret_file
          from leadpilot.bitrix_metadata_audit import validate_webhook
          from leadpilot.serviceit_bitrix_batch_worker import list_only
          from leadpilot.serviceit_bitrix_poll_fallback import after_activation,calibrate_known_card,discover
          env=dict(os.environ)
          def probe(name,fn):
              try:
                  fn()
                  print('FNS_POLL_'+name+'=PASS',flush=True)
              except Exception as e:
                  raw=str(e)
                  code=raw if re.fullmatch(r'[A-Z0-9_]{4,90}',raw) else 'TYPE_'+type(e).__name__.upper()
                  if not re.fullmatch(r'[A-Z0-9_]{4,90}',code):
                      code='UNVERIFIED'
                  print('FNS_POLL_'+name+'='+code,flush=True)
          def pg_read():
              with db(env) as conn:
                  with conn.cursor() as cur:
                      cur.execute('SELECT 1')
                      assert cur.fetchone()[0]==1
          probe('PG',pg_read)
          now=datetime.now(timezone.utc)
          activated=env.get('SERVICEIT_VPS_NATIVE_ACTIVATION_UTC','')
          def activation():
              after_activation({**env,'SERVICEIT_BITRIX_POLL_START_UTC':activated},now)
          probe('ACTIVATION',activation)
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=20) as client:
              base=validate_webhook(secret_file(env,'SERVICEIT_BITRIX_WEBHOOK'))
              reader=lambda method,params:list_only(client,base,method,params)
              probe('CALIBRATE',lambda:calibrate_known_card(reader))
              def query():
                  lower=after_activation({
                      **env,'SERVICEIT_BITRIX_POLL_START_UTC':activated},now)
                  cards=discover(reader,lower,now)
                  assert isinstance(cards,list)
                  print('FNS_POLL_DISCOVER_COUNT='+str(min(len(cards),200)),flush=True)
              probe('DISCOVER',query)
          print('FNS_POLL_ALL_READONLY=YES',flush=True)
          PY
