name: ServiceIT hourly real new-card AI / task / Score readback (READ ONLY)
on:
  schedule:
    - cron: '27 * * * *'
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  reconcile-readonly:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'Ramzes2023' &&
        github.event.issue.number == 148 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'SERVICEIT_RECONCILE_ALL_NEW_READONLY_ONCE_V1'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_POLL_START_UTC: ${{ vars.SERVICEIT_BITRIX_POLL_START_UTC }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify NEW 1062/21 real Bitrix cards and automatic results without any writes
        run: python -m leadpilot.serviceit_live_reconciliation_readonly
