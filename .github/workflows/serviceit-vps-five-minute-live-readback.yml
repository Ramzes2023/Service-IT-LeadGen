name: ServiceIT VPS five-minute REAL two-cycle + Bitrix readonly acceptance

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      approval:
        description: "Type VERIFY_VPS_5MIN_REAL_CYCLES_307"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: serviceit-vps-five-minute-real-cycles-audit
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         inputs.approval == 'VERIFY_VPS_5MIN_REAL_CYCLES_307')
        ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.number == 307 &&
         !github.event.issue.pull_request &&
         github.event.comment.user.login == 'Ramzes2023' &&
         github.event.comment.body == 'SVCIT_VPS_VERIFY_TWO_REAL_5MIN_CYCLES_307')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
      RUN_ID: "${{ github.run_id }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned SSH and safe audit script
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_five_minute_verify.py
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/serviceit-five-minute-readback"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-five-minute-readback/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-five-minute-readback/known_hosts"
          chmod 600 "$RUNNER_TEMP/serviceit-five-minute-readback/"*
          ssh-keygen -F "$VPS_HOST" \
            -f "$RUNNER_TEMP/serviceit-five-minute-readback/known_hosts" >/dev/null
      - name: Observe at least two full 300s intervals (no test CRM mutations)
        shell: bash
        run: |
          set -euo pipefail
          # Lets each just-recreated native process actually run twice.
          sleep 325
          ssh -T -i "$RUNNER_TEMP/serviceit-five-minute-readback/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-five-minute-readback/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' \
            < ops/serviceit_vps_five_minute_verify.py \
            > "$RUNNER_TEMP/serviceit-five-minute-readback/status.txt"
          grep -E '^FIVE_MIN_[A-Z0-9_]+=[A-Z0-9_.+-]+$' \
            "$RUNNER_TEMP/serviceit-five-minute-readback/status.txt" \
            > "$RUNNER_TEMP/serviceit-five-minute-readback/safe.txt"
          cat "$RUNNER_TEMP/serviceit-five-minute-readback/safe.txt"
          grep -q '^FIVE_MIN_OVERALL_5MIN_ACCEPTANCE=PASS$' \
            "$RUNNER_TEMP/serviceit-five-minute-readback/safe.txt"
      - name: Report anonymized real cycle evidence in Issue 307
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/serviceit-five-minute-readback/status.txt"
          if [[ -f "$p" ]]; then
            summary="$(grep -E '^FIVE_MIN_[A-Z0-9_]+=[A-Z0-9_.+-]+$' "$p" | head -48 || true)"
          else
            summary="FIVE_MIN_OVERALL_5MIN_ACCEPTANCE=UNVERIFIED"
          fi
          [[ -n "$summary" ]] || summary="FIVE_MIN_OVERALL_5MIN_ACCEPTANCE=UNVERIFIED"
          body="$(printf 'Фактическая частота после переключения 10→5 минут: два последовательных цикла по логам Docker с отметками времени + только читающая проверка 9 AI-полей Bitrix24 и PostgreSQL.\n\n%s\n\nGitHub Actions: https://github.com/%s/actions/runs/%s\n\nБез изменения CRM, контактов или подключённых источников. ФНС/МСП остаётся суточной, observer — почасовым.' "$summary" "$REPO" "$RUN_ID")"
          gh api "repos/$REPO/issues/307/comments" -X POST \
            --raw-field "body=$body" >/dev/null || true
