# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT inspect background data shapes without writes
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-manager-workspace-audit.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-manager-workspace-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-manager-workspace-app python -B -' <<'APP_AUDIT'
          import traceback
          import automation as a
          a.current_token=lambda:a.read("auth.json")["access_token"]
          def inspect(token,item,cache):
           a.scope(item)
           for kind in ["call","finance"]:a.layout(item,kind)
           int(item["assignedById"])
          a.sync=inspect
          a.write=lambda name,value:print("DRY_RUN_STATUS="+str(value.get("status"))+":CARDS="+str(value.get("cards")),flush=True)
          try:a.cycle()
          except Exception as e:
           for frame in traceback.extract_tb(e.__traceback__):print("FAILURE_FRAME="+frame.filename.split("/")[-1]+":"+str(frame.lineno)+":"+frame.name,flush=True)
           print("FAILURE_TYPE="+type(e).__name__,flush=True)
          print("LIVE_STATUS="+str(a.read("status.json",{}).get("status")),flush=True)
          APP_AUDIT
