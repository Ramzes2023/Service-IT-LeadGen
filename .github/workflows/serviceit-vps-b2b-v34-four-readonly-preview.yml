name: ServiceIT V34 four real B2B cards independent TinyFish audited preview READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v34-four-real-readonly-preview
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V34_FOUR_READONLY_PREVIEW_489'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact nine production modules and no-write probe
        shell: bash
        run: |
          set -euo pipefail
          reviewed='940355d16e6687928709d8431a10903e9164f943'
          git cat-file -e "$reviewed^{commit}"
          names=(serviceit_b2b_tender_index_v18.py
            serviceit_b2b_dossier_v11.py
            serviceit_vps_worker.py
            serviceit_b2b_v19_backfill.py
            serviceit_vps_b2b_deep_research.py
            serviceit_b2b_free_public_fallback.py
            serviceit_b2b_remote_public_fetch.py
            serviceit_b2b_routerai_deep.py
            serviceit_vps_b2b_document_worker.py)
          for name in "${names[@]}"; do
            git diff --quiet "$reviewed" HEAD -- "leadpilot/$name"
          done
          script=ops/serviceit_vps_b2b_v34_four_readonly_preview.py
          python -m py_compile "$script"
          git cat-file -e "$reviewed^{commit}"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v34-four"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v34-four/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v34-four/hosts"
          chmod 0600 "$RUNNER_TEMP/v34-four/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v34-four/hosts" >/dev/null
          : > "$RUNNER_TEMP/v34-four/shas"
          for name in "${names[@]}"; do
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v34-four/shas"
          done
      - name: Read four signed cards and assemble drafts without writing
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v34-four/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t shas < "$RUNNER_TEMP/v34-four/shas"
          [[ "${#shas[@]}" == 9 ]]
          checked=()
          for v in "${shas[@]}"; do
            [[ "$v" =~ ^[a-f0-9]{64}$ ]]
            checked+=("'$v'")
          done
          set +e
          ssh -T -i "$RUNNER_TEMP/v34-four/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - ${checked[*]}" \
            < ops/serviceit_vps_b2b_v34_four_readonly_preview.py \
            > "$RUNNER_TEMP/v34-four/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V34_REAL_FOUR_[A-Z0-9_]{3,62}=(YES|NO|[0-9]{1,3}|[A-Z0-9_]{5,75})$' \
            "$RUNNER_TEMP/v34-four/status" | head -45 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V34_REAL_FOUR_EXACT_NINE_MODULE_SHAS=YES' "$RUNNER_TEMP/v34-four/status"
          grep -qx 'V34_REAL_FOUR_PREVIEWED=4' "$RUNNER_TEMP/v34-four/status"
          grep -qx 'V34_REAL_FOUR_CRM_WRITES=0' "$RUNNER_TEMP/v34-four/status"
          grep -qx 'V34_REAL_FOUR_TINYFISH_STAGE_CALLS=4' "$RUNNER_TEMP/v34-four/status"
