name: ServiceIT provisional Lead Score for every NEW 1062/21 card
on:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  new-provisional-score:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      vars.SERVICEIT_BITRIX_POLL_ENABLED == 'YES_1062_21_READONLY' &&
      vars.SERVICEIT_BITRIX_EVENT_AI_ENABLED == 'YES_1062_21_CLOUD' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'Ramzes2023' &&
        github.event.issue.number == 148 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'SERVICEIT_STAGE4_PRELIM_SCORE_LIVE_ONCE_V1'))
    concurrency:
      group: serviceit-bitrix-new-card-free-event
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SERVICEIT_STAGE4_PRELIMINARY_SCORE_ENABLED: YES_1062_21_PROVISIONAL_ONLY
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_POLL_START_UTC: ${{ vars.SERVICEIT_BITRIX_POLL_START_UTC }}
      SERVICEIT_GH_LEDGER_KEY: ${{ secrets.SERVICEIT_GH_LEDGER_KEY }}
      # Same approved positive-only corporate STOP scope as FNS watcher.
      SERVICEIT_CORPORATE_STOP_INN_ENABLED: ${{ vars.SERVICEIT_CORPORATE_STOP_INN_ENABLED }}
      SERVICEIT_CORPORATE_STOP_INN_MANIFEST: ${{ secrets.SERVICEIT_CORPORATE_STOP_INN_MANIFEST }}
      SERVICEIT_CORPORATE_STOP_INN_KEY: ${{ secrets.SERVICEIT_CORPORATE_STOP_INN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Score only real new, AI-filled 1062/21 cards; reserve encrypted one-use receipt and verify readback
        run: python -m leadpilot.serviceit_stage4_provisional_score_live
