# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT resilient background final acceptance
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-manager-workspace-audit.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-manager-workspace-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-manager-workspace-app python -B -' <<'APP_AUDIT'
          import time,collections
          import automation as a
          for attempt in range(48):
           state=a.read("status.json",{})
           if state.get("status")=="OK" and time.time()-state.get("completed_at",0)<600:break
           time.sleep(5)
          print("TIMELINE_STATUS="+str(state.get("status","UNKNOWN")))
          print("TIMELINE_CARDS="+str(state.get("cards",0)))
          print("TIMELINE_FAILED_CARDS="+str(len(state.get("failed_cards",{}))))
          auth=a.read("auth.json")
          assert auth,"APP_AUTH_MISSING"
          rows=[]
          for start in range(0,10000,50):
           batch=a.api(auth["access_token"],"crm.activity.list",filter={"OWNER_TYPE_ID":1062,"ORIGINATOR_ID":"serviceit_workspace_app_v1"},select=["ID","OWNER_ID","ORIGIN_ID","COMPLETED"],start=start)
           rows.extend(batch)
           if len(batch)<50:break
          closed=[r for r in rows if r.get("COMPLETED")=="Y"]
          counts=collections.Counter(r.get("ORIGIN_ID") for r in rows)
          print("TIMELINE_BLOCKS="+str(len(rows)))
          print("TIMELINE_COMPLETED_BLOCKS="+str(len(closed)))
          print("TIMELINE_DUPLICATES="+str(sum(v>1 for v in counts.values())))
          assert state.get("status")=="OK","BACKGROUND_CYCLE_FAILED"
          assert not closed,"COMPLETED_BLOCKS_REMAIN"
          assert all(v==1 for v in counts.values()),"DUPLICATE_BLOCKS"
          assert len(rows)>=2*state["cards"],"MISSING_BLOCKS"
          print("TIMELINE_ACCEPTANCE=VERIFIED")
          APP_AUDIT
