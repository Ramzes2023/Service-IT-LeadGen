name: Service IT LeadGen tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q leadpilot
      - name: Run local tests
        run: python -m pytest -q -p no:cacheprovider tests --basetemp="${{ runner.temp }}/serviceit-pytest-${{ github.run_id }}-${{ github.run_attempt }}"
  windows-cockpit-secure-input:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax and synthetic SecureString handoff
        shell: powershell
        run: .\scripts\TEST_SERVICEIT_AI_COCKPIT_SECURE_INPUT.ps1
