# Optional browser research sidecars: only enable AFTER verified sandbox test.
# Browser has NO external network route and NO Bitrix/PG/AI/GitHub secrets.
# The egress proxy permits only allowlisted HTTPS CONNECT to pinned PUBLIC IPs.
name: serviceit-public-browser-vps

services:
  browser:
    profiles: ["browser"]
    image: serviceit-vps-public-browser:staged
    user: pwuser
    ports:
      - "127.0.0.1:18785:8765"
    networks:
      - browser_internal
    depends_on:
      egress:
        condition: service_started
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 1g
    shm_size: 256m
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      SERVICEIT_VPS_BROWSER_APPROVED_HOSTS: "${SERVICEIT_VPS_BROWSER_APPROVED_HOSTS:?explicit public browser hosts required}"
      SERVICEIT_VPS_BROWSER_PROXY_URL: "http://egress:3128"
    command: ["python", "-m", "leadpilot.serviceit_vps_public_browser_bridge"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert b'BROWSER_BRIDGE_READY' in urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"]
      interval: 45s
      timeout: 5s
      retries: 3
      start_period: 25s

  egress:
    profiles: ["browser"]
    image: serviceit-vps-public-browser:staged
    user: pwuser
    # Browser traffic can reach the Internet ONLY via this validating proxy.
    # The egress container has NO routes to the host's core Docker network.
    networks:
      - browser_internal
      - public_egress
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 128m
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      SERVICEIT_VPS_BROWSER_APPROVED_HOSTS: "${SERVICEIT_VPS_BROWSER_APPROVED_HOSTS:?explicit public browser hosts required}"
    command: ["python", "-m", "leadpilot.serviceit_vps_public_browser_proxy"]

networks:
  browser_internal:
    driver: bridge
    internal: true
    enable_ipv6: false
  public_egress:
    driver: bridge
    enable_ipv6: false
