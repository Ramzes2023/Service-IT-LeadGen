name: ServiceIT VPS prepare RouterAI privacy (READONLY only, manual)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Exact owner approval PREPARE_ROUTERAI_1062_21_READONLY; does NOT authorize cutover'
        required: true
        type: string

permissions:
  contents: read

# Serialize with safe native shadow installer; no concurrent vps.env changes.
concurrency:
  group: serviceit-vps-native-shadow-readonly
  cancel-in-progress: false

jobs:
  readonly-routerai-prepare:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      inputs.approval == 'PREPARE_ROUTERAI_1062_21_READONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      MODEL_PRIVACY_APPROVED: "${{ vars.SERVICEIT_WORKER_MODEL_PRIVACY_APPROVED }}"
      ROUTERAI_PRIVACY_APPROVED: "${{ vars.SERVICEIT_ROUTERAI_PRIVACY_APPROVED }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing GitHub 1062/21 RouterAI privacy approvals and pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODEL_PRIVACY_APPROVED" == 'YES' ]] || { echo "GITHUB_MODEL_PRIVACY_SCOPE_NOT_APPROVED"; exit 2; }
          [[ "$ROUTERAI_PRIVACY_APPROVED" == 'YES_1062_21' ]] || { echo "GITHUB_ROUTERAI_SCOPE_NOT_APPROVED"; exit 2; }
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          mkdir -m 0700 -p "$RUNNER_TEMP/serviceit-routerai-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-routerai-ssh/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-routerai-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/serviceit-routerai-ssh/id" "$RUNNER_TEMP/serviceit-routerai-ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/serviceit-routerai-ssh/known_hosts" >/dev/null
          echo 'GITHUB_ROUTERAI_1062_21_PRIVACY_APPROVALS=PASS'
      - name: Prepare exactly two privacy flags on VPS with READONLY gates
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          digest="$(sha256sum deploy/serviceit-vps-readonly-routerai-prepare.py | cut -d' ' -f1)"
          ssh -i "$RUNNER_TEMP/serviceit-routerai-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-routerai-ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p "$HOME/serviceit/staging" && test -f "$HOME/serviceit/config/vps.env"'
          scp -i "$RUNNER_TEMP/serviceit-routerai-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-routerai-ssh/known_hosts" \
            -o BatchMode=yes deploy/serviceit-vps-readonly-routerai-prepare.py \
            "$VPS_USER@$VPS_HOST:serviceit/staging/routerai-readonly-$sha.py"
          remote_digest="$(ssh -i "$RUNNER_TEMP/serviceit-routerai-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-routerai-ssh/known_hosts" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "sha256sum serviceit/staging/routerai-readonly-$sha.py" | cut -d' ' -f1)"
          [[ "$remote_digest" == "$digest" ]] || { echo "VPS_ROUTERAI_PREP_SCRIPT_HASH_MISMATCH"; exit 2; }
          ssh -i "$RUNNER_TEMP/serviceit-routerai-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-routerai-ssh/known_hosts" \
            -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "python3 serviceit/staging/routerai-readonly-$sha.py --approval PREPARE_ROUTERAI_1062_21_READONLY </dev/null"
          echo "VPS_ROUTERAI_READONLY_PRIVACY_PREPARATION_COMPLETED=YES"
          echo "VPS_LIVE_CUTOVER=NOT_PERFORMED"
          echo "VPS_READONLY_CONTAINERS_NEED_REDEPLOY=YES"
          echo "OLD_GITHUB_WRITERS=UNCHANGED"
