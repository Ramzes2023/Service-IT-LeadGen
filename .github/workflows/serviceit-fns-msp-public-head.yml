name: ServiceIT official FNS MSP public ZIP HEAD probe (READ ONLY)
on:
  schedule:
    # Daily public passport health; no CRM calls, no 2.25 GB download.
    - cron: '18 3 * * *'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  public-fns-probe:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'Ramzes2023' &&
        github.event.issue.number == 148 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'SERVICEIT_FNS_OFFICIAL_PUBLIC_HEAD_ONCE_V1'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect live official FNS MSP passport and current ZIP headers (GET HTML, HEAD ZIP only)
        run: python -m leadpilot.serviceit_fns_msp_passport_probe
