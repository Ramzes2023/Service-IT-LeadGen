name: ServiceIT VPS Brave Search Web and LLM Context guarded native enable

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type ACTIVATE_VPS_BRAVE_SEARCH_CONTEXT_1062_21 AFTER root installs Brave key'
        required: true
        type: string

permissions:
  contents: read

# Never overlap with browser/core cutover or other native VPS deployment.
concurrency:
  group: serviceit-vps-native-shadow-readonly
  cancel-in-progress: false

jobs:
  brave-live-activate:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      inputs.approval == 'ACTIVATE_VPS_BRAVE_SEARCH_CONTEXT_1062_21'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify SSH identity and prepare signed release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          dir="$RUNNER_TEMP/serviceit-brave-vps"
          mkdir -m 0700 -p "$dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$dir/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/id" "$dir/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$dir/known_hosts" >/dev/null
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          archive="$dir/brave-only-$sha.tgz"
          git archive --format=tar.gz -o "$archive" HEAD
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          printf 'BRAVE_RELEASE_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          printf 'BRAVE_RELEASE_HASH=%s\n' "$digest" >> "$GITHUB_ENV"
          ssh -T -i "$dir/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/serviceit/staging"'
          scp -i "$dir/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$archive" "$VPS_USER@$VPS_HOST:serviceit/staging/brave-only-$sha.tgz"
          echo 'BRAVE_PINNED_SOURCE_UPLOADED_NO_CRM_CHANGES=YES'

      - name: Verify on VPS then activate Brave only in native coordinator
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/serviceit-brave-vps"
          sha="$BRAVE_RELEASE_SHA"
          digest="$BRAVE_RELEASE_HASH"
          ssh -T -i "$dir/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "bash -se -- $sha $digest" <<'REMOTE'
          set -euo pipefail
          umask 077
          sha="$1"
          digest="$2"
          [[ "$sha" =~ ^[a-f0-9]{40}$ && "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 2
          archive="$HOME/serviceit/staging/brave-only-$sha.tgz"
          [[ -f "$archive" && ! -L "$archive" ]] || exit 2
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status || exit 2
          release="$HOME/serviceit/releases/$sha"
          if [[ ! -d "$release" ]]; then
            mkdir -m 0700 "$release"
            tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$release"
          fi
          [[ -f "$release/deploy/serviceit-vps-brave-live-activate.py" ]] || exit 2
          python3 "$release/deploy/serviceit-vps-brave-live-activate.py" \
            --sha "$sha" --approval ACTIVATE_VPS_BRAVE_SEARCH_CONTEXT_1062_21
          REMOTE
