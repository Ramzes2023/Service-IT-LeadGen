# ADDITIONAL opt-in for a privately provisioned Linux host only.
# Do not use on Windows Docker Desktop without verifying UID/GID ownership.
# Secret must be owner UID 10001, mode 0600, outside git.
# Select this overlay only AFTER the owner completes Google OAuth consent.
services:
  gmail-worker:
    environment:
      SERVICEIT_V2_GMAIL_OAUTH_FILE: /run/secrets/serviceit-gmail-oauth.json
      SERVICEIT_V2_GMAIL_EXPECTED_EMAIL: "${SERVICEIT_V2_GMAIL_EXPECTED_EMAIL:?set authorized Gmail address}"
      SERVICEIT_V2_GMAIL_CLIENT_ID: ""
      SERVICEIT_V2_GMAIL_CLIENT_SECRET: ""
      SERVICEIT_V2_GMAIL_REFRESH_TOKEN: ""
    volumes:
      - type: bind
        source: "${SERVICEIT_V2_OAUTH_SECRET_HOST_FILE:?private OAuth bundle must be on approved host}"
        target: /run/secrets/serviceit-gmail-oauth.json
        read_only: true
