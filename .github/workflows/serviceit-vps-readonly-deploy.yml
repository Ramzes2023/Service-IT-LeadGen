name: ServiceIT VPS guarded READONLY deployment (manual only)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type READONLY_ONLY after corporate VPS is bootstrapped'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: serviceit-vps-readonly-ssh-deploy
  cancel-in-progress: false

jobs:
  deploy-readonly:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      inputs.approval == 'READONLY_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate operator-approved private SSH connection requirements
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[0-9a-zA-Z.-]+$ ]] && [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          [[ "$VPS_USER" != root ]]
          mkdir -p "$RUNNER_TEMP/serviceit-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-ssh/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/serviceit-ssh/id" "$RUNNER_TEMP/serviceit-ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/serviceit-ssh/known_hosts" >/dev/null
      - name: Upload SHA256-pinned release and run server read-only installer
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          git archive --format=tar.gz -o "$RUNNER_TEMP/release-$sha.tgz" HEAD
          digest="$(sha256sum "$RUNNER_TEMP/release-$sha.tgz" | cut -d' ' -f1)"
          ssh -i "$RUNNER_TEMP/serviceit-ssh/id" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-ssh/known_hosts" -o BatchMode=yes \
            -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/serviceit/staging"'
          scp -i "$RUNNER_TEMP/serviceit-ssh/id" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-ssh/known_hosts" -o BatchMode=yes \
            "$RUNNER_TEMP/release-$sha.tgz" \
            "$VPS_USER@$VPS_HOST:serviceit/staging/release-$sha.tgz"
          ssh -i "$RUNNER_TEMP/serviceit-ssh/id" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-ssh/known_hosts" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$sha' '$digest'" \
            < deploy/serviceit-vps-readonly-install.sh
          echo "VPS_READONLY_DEPLOYMENT_COMPLETED_FOR_SHA=$sha"
