name: ServiceIT B2B official buyer corporate search ONE FLAG guarded release
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-official-buyer-flag-release
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_OFFICIAL_BUYER_SEARCH_FLAG_368'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      REPO: "${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify no-write script and host-pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_company_search_optin.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]{7,16}$ ]]
          install -d -m 0700 "$RUNNER_TEMP/buyer-flag"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/buyer-flag/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/buyer-flag/hosts"
          chmod 0600 "$RUNNER_TEMP/buyer-flag/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/buyer-flag/hosts" >/dev/null
          sha256sum ops/serviceit_vps_b2b_company_search_optin.py |
            cut -d ' ' -f1 > "$RUNNER_TEMP/buyer-flag/script-sha"
      - name: Stage only the one feature-flag activator, no source or env files
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/buyer-flag/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          stage="serviceit/staging/buyer-search-flag-$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/buyer-flag/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          scp -i "$RUNNER_TEMP/buyer-flag/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_company_search_optin.py \
            "$target:$stage/activate.py"
      - name: Verify SHA, check no in-flight writers, update one flag and prove rollback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/buyer-flag/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          scriptsha="$(cat "$RUNNER_TEMP/buyer-flag/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          set +e
          ssh -T -i "$RUNNER_TEMP/buyer-flag/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$GITHUB_RUN_ID' '$scriptsha'" \
            > "$RUNNER_TEMP/buyer-flag/status" <<'REMOTE'
          set -euo pipefail
          runid="$1"; scriptsha="$2"
          [[ "$runid" =~ ^[0-9]{7,16}$ && "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          script="$HOME/serviceit/staging/buyer-search-flag-$runid/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$scriptsha" "$script" |
            sha256sum --check --status
          python3 "$script" "$runid"
          REMOTE
          rc=$?
          set -e
          grep -E '^BUYER_FLAG_(PREFLIGHT|ACTIVE|REUSED_IMAGE|INSTALLER_CRM_WRITES|ROLLBACK|REASON)=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,95})$' \
            "$RUNNER_TEMP/buyer-flag/status" | head -20 || true
          [[ "$rc" == 0 ]]
          grep -qx 'BUYER_FLAG_ACTIVE=YES' "$RUNNER_TEMP/buyer-flag/status"
          grep -qx 'BUYER_FLAG_REUSED_IMAGE=YES' "$RUNNER_TEMP/buyer-flag/status"
          grep -qx 'BUYER_FLAG_INSTALLER_CRM_WRITES=NO' "$RUNNER_TEMP/buyer-flag/status"
      - name: Post sanitized result to issue 368
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/buyer-flag/status"
          safe="$(grep -E '^BUYER_FLAG_(PREFLIGHT|ACTIVE|REUSED_IMAGE|INSTALLER_CRM_WRITES|ROLLBACK|REASON)=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,95})$' "$file" 2>/dev/null | head -18 || true)"
          [[ -n "$safe" ]] || safe='BUYER_FLAG_RESULT_UNVERIFIED=YES'
          body="$(printf 'B2B public buyer -> official company site/contact opt-in; exact ONE flag added only if guard checks pass. No source image rebuild, CRM writes, or TDI interruption.\n\n%s\n\nAction https://github.com/%s/actions/runs/%s\n\nNext real tender or scoped manual backfill remains independently verifiable.' "$safe" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/368/comments" -X POST --raw-field "body=$body" >/dev/null || true
