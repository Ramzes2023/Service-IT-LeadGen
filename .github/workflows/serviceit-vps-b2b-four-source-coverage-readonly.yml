name: ServiceIT B2B four real cards public dossier coverage READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-four-public-source-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_FOUR_PUBLIC_SOURCES_READONLY_314'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Pin owner-only non-root SSH identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/four-public"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/four-public/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/four-public/known"
          chmod 0600 "$RUNNER_TEMP/four-public/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/four-public/known" >/dev/null
      - name: Re-evaluate public evidence only; no RouterAI or CRM write
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/four-public/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/four-public/known" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' <<'PY'
          import os, re
          import httpx
          from leadpilot.serviceit_vps_pg_queue import db,secret_file
          from leadpilot.serviceit_enrichment_worker import Rest,normalized,validate_identity
          from leadpilot.serviceit_b2b_hold_ai_fields import PREFIX, AI_FIELDS
          from leadpilot.serviceit_vps_b2b_deep_research import (
              source_findings, safe_notice, public_buyer_candidate,
              published_buyer_inn_evidence,
          )
          from leadpilot.serviceit_b2b_routerai_deep import (
              public_documents, extract_source_facts,
          )
          env=dict(os.environ)
          print("FOUR_PUBLIC_MODE=READONLY",flush=True)
          with db(env) as con:
              with con.transaction():
                  with con.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")
                      cur.execute("""
                      SELECT b.card_id,b.source_id,b.notice_json
                      FROM serviceit_vps_b2b_inbox b
                      WHERE b.state='VERIFIED' AND b.card_id IS NOT NULL
                      ORDER BY b.received_at,b.source_id LIMIT 5
                      """)
                      rows=cur.fetchall()
          print("FOUR_PUBLIC_ACTUAL_FOUR="+("YES" if len(rows)==4 else "NO"),flush=True)
          assert len(rows)==4
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=20.0) as client:
              rest=Rest(secret_file(env,"SERVICEIT_BITRIX_WEBHOOK"),client)
              for i,(card,source,notice) in enumerate(rows,1):
                  assert isinstance(card,int) and re.fullmatch(r'B2B-CENTER-[0-9]{5,12}',source)
                  item=normalized(rest('crm.item.get',{
                      'entityTypeId':1062,'id':card,'useOriginalUfNames':'Y'})['item'])
                  validate_identity(item,card)
                  safe_notice(notice,card,source,item)
                  assert item.get(PREFIX+'SIGNAL_ID')==source
                  assert all(isinstance(item.get(k),str) and item[k].strip() for k in AI_FIELDS)
                  try:
                      result=source_findings(item,notice,env,client)
                      docs=public_documents(result)
                      snippets=extract_source_facts(docs)
                      contact=list(result.get("contacts") or [])
                      independent=result.get("independent_company_research")
                      if isinstance(independent,dict):
                          contact += list(independent.get("contacts") or [])
                      status=result.get("status")
                      status=status if isinstance(status,str) and re.fullmatch(r'[A-Z0-9_]{4,75}',status) else 'UNVERIFIED'
                      print(f'FOUR_PUBLIC_CARD_{i}_RESEARCH={status}',flush=True)
                      print(f'FOUR_PUBLIC_CARD_{i}_DOCS={min(len(docs),10)}',flush=True)
                      print(f'FOUR_PUBLIC_CARD_{i}_URLS={min(len({x["url"] for x in docs}),10)}',flush=True)
                      print(f'FOUR_PUBLIC_CARD_{i}_EXTRACTED_FACTS={min(len(snippets),30)}',flush=True)
                      print(f'FOUR_PUBLIC_CARD_{i}_PUBLIC_BUYER='+('YES' if public_buyer_candidate(result) else 'NO'),flush=True)
                      print(f'FOUR_PUBLIC_CARD_{i}_PUBLIC_INN_CANDIDATE='+('YES' if published_buyer_inn_evidence(result) else 'NO'),flush=True)
                      print(f'FOUR_PUBLIC_CARD_{i}_PUBLISHED_CONTACTS={min(len(contact),12)}',flush=True)
                  except Exception:
                      print(f'FOUR_PUBLIC_CARD_{i}_RESEARCH=EXCEPTION',flush=True)
                      print(f'FOUR_PUBLIC_CARD_{i}_DOCS=0',flush=True)
          print('FOUR_PUBLIC_COMPLETE=YES',flush=True)
          PY
