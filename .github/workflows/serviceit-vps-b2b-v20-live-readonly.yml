name: ServiceIT V20 live production source and 4 historical CRM receipt audit READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v20-live-cycle-readonly
  cancel-in-progress: false
jobs:
  origin:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V20_LIVE_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin reviewed read-only origin script and host key
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e '139b97c781698f687714bda8ffd1b7005436e087^{commit}'
          script=ops/serviceit_vps_b2b_v20_live_readonly.py
          git diff --quiet 139b97c781698f687714bda8ffd1b7005436e087 HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v20-audit"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v20-audit/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v20-audit/hosts"
          chmod 0600 "$RUNNER_TEMP/v20-audit/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v20-audit/hosts" >/dev/null

      - name: Inspect exact new image, five-minute gating, signed card receipt states, NO writes
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v20-audit/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          : > "$RUNNER_TEMP/v20-audit/hashes"
          for file in serviceit_vps_worker.py serviceit_b2b_v20_versioned.py; do
            sha256sum "leadpilot/$file" | cut -d' ' -f1 >> "$RUNNER_TEMP/v20-audit/hashes"
          done
          mapfile -t shas < "$RUNNER_TEMP/v20-audit/hashes"
          [[ "${#shas[@]}" == 2 ]]
          checked=()
          for v in "${shas[@]}"; do
            [[ "$v" =~ ^[a-f0-9]{64}$ ]]
            checked+=("'$v'")
          done
          set +e
          ssh -T -i "$RUNNER_TEMP/v20-audit/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - ${checked[*]}" \
            < ops/serviceit_vps_b2b_v20_live_readonly.py \
            > "$RUNNER_TEMP/v20-audit/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V20_LIVE_[A-Z0-9_]+=(YES|NO|NONE|[0-9]{1,4}|[A-Z0-9_]{4,70})$' \
            "$RUNNER_TEMP/v20-audit/status" | head -40 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V20_LIVE_EXACT_CODE=YES' "$RUNNER_TEMP/v20-audit/status"
          grep -qx 'V20_LIVE_GATES=YES' "$RUNNER_TEMP/v20-audit/status"
          grep -qx 'V20_LIVE_CRM_WRITES=NO' "$RUNNER_TEMP/v20-audit/status"
