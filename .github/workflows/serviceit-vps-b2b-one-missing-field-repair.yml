name: ServiceIT B2B repair one missing AI field, fenced once (LIVE)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-one-missing-field-locked
  cancel-in-progress: false
jobs:
  restore:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      !github.event.issue.pull_request &&
      (github.event.comment.body == 'SERVICEIT_B2B_FIX_SUMMARY_FIELD_314' ||
       github.event.comment.body == 'SERVICEIT_B2B_FIX_MANAGER_BRIEF_FIELD_314' ||
       github.event.comment.body == 'SERVICEIT_B2B_FIX_FULL_REPORT_FIELD_314')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      COMMAND: "${{ github.event.comment.body }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owner-pinned SSH and allowlisted target field
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_missing_ai_field_repair.py
          case "$COMMAND" in
            SERVICEIT_B2B_FIX_SUMMARY_FIELD_314)
              echo 'summary' > "$RUNNER_TEMP/b2b-mode" ;;
            SERVICEIT_B2B_FIX_MANAGER_BRIEF_FIELD_314)
              echo 'manager_brief' > "$RUNNER_TEMP/b2b-mode" ;;
            SERVICEIT_B2B_FIX_FULL_REPORT_FIELD_314)
              echo 'full_report' > "$RUNNER_TEMP/b2b-mode" ;;
            *) exit 2 ;;
          esac
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/b2b-field-repair"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/b2b-field-repair/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/b2b-field-repair/known_hosts"
          chmod 600 "$RUNNER_TEMP/b2b-field-repair/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/b2b-field-repair/known_hosts" >/dev/null
      - name: Write ONLY the selected currently missing field after PG checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mode="$(cat "$RUNNER_TEMP/b2b-mode")"
          [[ "$mode" =~ ^(summary|manager_brief|full_report)$ ]]
          ssh -T -i "$RUNNER_TEMP/b2b-field-repair/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-field-repair/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - '$mode'" \
            < ops/serviceit_vps_b2b_missing_ai_field_repair.py \
            > "$RUNNER_TEMP/b2b-field-repair/status"
          grep -E '^B2B_FIELD_REPAIR_[A-Z0-9_]+=(YES|NO|[0-9]+)$' \
            "$RUNNER_TEMP/b2b-field-repair/status" | head -12
          grep -qx 'B2B_FIELD_REPAIR_DONE=YES' "$RUNNER_TEMP/b2b-field-repair/status"
          grep -qx 'B2B_FIELD_REPAIR_READBACK=YES' "$RUNNER_TEMP/b2b-field-repair/status"
      - name: Publish fixed result codes without CRM values or IDs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/b2b-field-repair/status"
          summary="$(grep -E '^B2B_FIELD_REPAIR_[A-Z0-9_]+=(YES|NO|[0-9]+)$' "$f" 2>/dev/null | head -12 || true)"
          [[ -n "$summary" ]] || summary='B2B_FIELD_REPAIR_UNVERIFIED=YES'
          msg="$(printf 'B2B exact existing-card one-field restoration with PG one-use checkpoint:\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nNo crm.item.add, model call, stage, contacts or outreach. All card IDs, sources, values, credentials and PII excluded from output. No automatic retry if CRM write remains ambiguous.' "$summary" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/314/comments" -X POST --raw-field "body=$msg" >/dev/null || true
