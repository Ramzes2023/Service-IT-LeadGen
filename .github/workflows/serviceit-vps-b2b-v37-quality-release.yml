name: ServiceIT VPS B2B V37 guarded dossier quality coordinator release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-vps-b2b-v37-quality-release.yml]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v37-search-release
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' && github.actor == 'Ramzes2023' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 489 &&
        !github.event.issue.pull_request && github.event.comment.user.login == 'Ramzes2023' &&
        github.event.comment.body == 'SERVICEIT_B2B_V37_PASSPORT_SYNC_RELEASE_489'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Fetch exact reviewed public repository revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet .
          git remote add origin https://github.com/Ramzes2023/Service-IT-LeadGen.git
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Verify reviewed NEW V37 and pinned pre-V37 OLD source hashes
        shell: bash
        run: |
          set -euo pipefail
          reviewed="$GITHUB_SHA"
          old='1184e8840d585bd1162910d545cdfa8667197818'
          git cat-file -e "$reviewed^{commit}"
          git cat-file -e "$old^{commit}"
          names=(serviceit_b2b_v19_backfill.py serviceit_b2b_v20_versioned.py serviceit_b2b_dossier_v11.py)
          install -d -m 0700 "$RUNNER_TEMP/v37-release"
          : > "$RUNNER_TEMP/v37-release/new-hashes"
          : > "$RUNNER_TEMP/v37-release/old-hashes"
          blobs=(112a696d84358c0c967914ffe2b2e14511940311 7565cde3042a27e5ac9e73c8b54f4a346dd02e4b 2c3910f8a9ec12beb52337e0d16c139af46d042c)
          for i in "${!names[@]}"; do
            name="${names[i]}"
            [[ "$(git hash-object "leadpilot/$name")" == "${blobs[i]}" ]]
            git diff --quiet "$reviewed" HEAD -- "leadpilot/$name"
            python -m py_compile "leadpilot/$name"
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v37-release/new-hashes"
            git show "$old:leadpilot/$name" | sha256sum | cut -d' ' -f1 >> "$RUNNER_TEMP/v37-release/old-hashes"
          done
          script=ops/serviceit_vps_b2b_v37_quality_release.py
          python -m py_compile "$script"
          sha256sum "$script" | cut -d' ' -f1 > "$RUNNER_TEMP/v37-release/script-sha"
          [[ "$(wc -l < "$RUNNER_TEMP/v37-release/new-hashes")" == 3 ]]
          [[ "$(wc -l < "$RUNNER_TEMP/v37-release/old-hashes")" == 3 ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v37-release/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v37-release/hosts"
          chmod 0600 "$RUNNER_TEMP/v37-release/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v37-release/hosts" >/dev/null
      - name: Transfer exactly one nonsecret file plus release controller
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v37-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          stage="serviceit/staging/b2b-v37-onefile-release-$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          for name in serviceit_b2b_v19_backfill.py serviceit_b2b_v20_versioned.py serviceit_b2b_dossier_v11.py; do
            scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
              "leadpilot/$name" "$target:$stage/"
          done
          scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v37_quality_release.py "$target:$stage/activate.py"
      - name: Offline smoke new one module and swap coordinator only with rollback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v37-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t new < "$RUNNER_TEMP/v37-release/new-hashes"
          mapfile -t old < "$RUNNER_TEMP/v37-release/old-hashes"
          [[ "${#new[@]}" == 3 && "${#old[@]}" == 3 ]]
          scriptsha="$(cat "$RUNNER_TEMP/v37-release/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          args=()
          for v in "${new[@]}" "${old[@]}"; do
            [[ "$v" =~ ^[a-f0-9]{64}$ ]]
            args+=("'$v'")
          done
          remote="bash -s -- '$GITHUB_RUN_ID' '$scriptsha' ${args[*]}"
          set +e
          ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" "$remote" \
            > "$RUNNER_TEMP/v37-release/status" <<'REMOTE'
          set -euo pipefail
          id="$1"; sha="$2"; shift 2
          [[ "$id" =~ ^[0-9]{7,16}$ && "$sha" =~ ^[a-f0-9]{64}$ && "$#" == 6 ]]
          for v in "$@"; do [[ "$v" =~ ^[a-f0-9]{64}$ ]]; done
          script="$HOME/serviceit/staging/b2b-v37-onefile-release-$id/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$sha" "$script" | sha256sum --check --status
          python3 "$script" "$id" "$@"
          REMOTE
          rc=$?
          set -e
          grep -E '^V37_RELEASE_[A-Z0-9_]+=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,90})$' \
            "$RUNNER_TEMP/v37-release/status" | head -30 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V37_RELEASE_VPS_LIVE_ENABLED=YES' "$RUNNER_TEMP/v37-release/status"
          grep -qx 'V37_RELEASE_CRM_WRITES_BY_INSTALLER=NO' "$RUNNER_TEMP/v37-release/status"
