name: ServiceIT VPS ephemeral PostgreSQL integration tests (no production)

on:
  pull_request:
    paths:
      - 'leadpilot/serviceit_vps_*.py'
      - 'tests/test_serviceit_vps_*.py'
      - 'requirements-vps.txt'
      - 'Dockerfile.serviceit-vps'
      - 'deploy/serviceit-vps-native-shadow-install.sh'
      - 'deploy/serviceit-vps-readonly-routerai-prepare.py'
      - 'deploy/serviceit-vps-olga-task-readonly-prepare.py'
      - 'leadpilot/serviceit_stage3_all_new_task_automation.py'
      - '.github/workflows/serviceit-vps-olga-task-readonly-prepare.yml'
      - '.github/workflows/serviceit-vps-routerai-readonly-prepare.yml'
      - 'deploy/serviceit-vps.compose.yml'
      - '.github/workflows/serviceit-vps-final-cutover-readonly-audit.yml'
      - '.github/workflows/serviceit-vps-postgres-tests.yml'
  push:
    branches: [main]
    paths:
      - 'leadpilot/serviceit_vps_*.py'
      - 'tests/test_serviceit_vps_*.py'
      - 'requirements-vps.txt'
      - 'Dockerfile.serviceit-vps'
      - 'deploy/serviceit-vps-native-shadow-install.sh'
      - 'deploy/serviceit-vps.compose.yml'
      - '.github/workflows/serviceit-vps-postgres-tests.yml'

permissions:
  contents: read

jobs:
  real-postgres-queue-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: leadgen
          POSTGRES_DB: leadgen
          POSTGRES_PASSWORD: synthetic-ci-pg-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadgen -d leadgen"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SERVICEIT_PG_CI_EPHEMERAL: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-vps.txt
      - name: Install server-only requirements
        run: python -m pip install -r requirements-vps.txt
      - name: Verify real disposable PostgreSQL queue transaction safety
        run: python -m pytest -q tests/test_serviceit_vps_pg_integration.py tests/test_serviceit_vps_pg_cutover.py tests/test_serviceit_vps_routerai_only.py tests/test_serviceit_vps_poll_readonly_probe.py tests/test_serviceit_vps_native_fence.py tests/test_serviceit_vps_native_aux.py tests/test_serviceit_vps_native_actions.py tests/test_serviceit_vps_poll_checkpoint.py tests/test_serviceit_vps_shadow_install_flow.py tests/test_serviceit_vps_routerai_readonly_prepare.py tests/test_serviceit_vps_cloud_writer_cutover_fence.py tests/test_serviceit_vps_olga_605_readonly_prepare.py tests/test_serviceit_vps_final_readonly_audit.py tests/test_serviceit_vps_source_ai_handoff.py tests/test_serviceit_vps_deep_research_readiness.py
      - name: Verify native shadow installer shell syntax
        run: bash -n deploy/serviceit-vps-native-shadow-install.sh
      - name: Validate Compose structure using ONLY synthetic local placeholders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-vps-secrets"
          for filename in pg_password bitrix_webhook routerai_key; do
            printf 'SYNTHETIC_NOT_REAL\n' > "$RUNNER_TEMP/ci-vps-secrets/$filename"
          done
          export SERVICEIT_VPS_SECRETS_DIR="$RUNNER_TEMP/ci-vps-secrets"
          docker compose -f deploy/serviceit-vps.compose.yml config --quiet
          echo "VPS_COMPOSE_STRUCTURE_VALIDATED_WITH_SYNTHETIC_SECRET_FILES"

  nonroot-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Simulate tightly permissioned VPS SHA256 release extraction
        shell: bash
        run: |
          set -euo pipefail
          chmod -R go-rwx leadpilot certificates
          chmod go-rwx config/serviceit_own_signal_stop.json
          echo "VPS_SIMULATED_RESTRICTIVE_CODE_MODES=YES"
      - name: Build production Dockerfile with restricted Git release source
        shell: bash
        run: |
          set -euo pipefail
          docker build --file Dockerfile.serviceit-vps \
            --tag serviceit-native-nonroot:ci .
      - name: Nonroot Python import smoke, no network, read-only filesystem
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=32m,mode=1777 \
            --entrypoint python serviceit-native-nonroot:ci -c \
            "import os; assert os.geteuid() == 10001; import leadpilot.serviceit_vps_worker, leadpilot.serviceit_vps_native_aux, leadpilot.serviceit_vps_native_business, leadpilot.serviceit_vps_native_observer, leadpilot.serviceit_vps_poll_checkpoint; print('SERVICEIT_NONROOT_PYTHON_IMPORTS=PASS;CRM_WRITES=0')"
