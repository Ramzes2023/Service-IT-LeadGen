# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT background transport and layout diagnosis
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-manager-workspace-audit.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-manager-workspace-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-manager-workspace-app python -B -' <<'APP_AUDIT'
          import json,urllib.request,urllib.error
          import automation as a
          auth=a.read("auth.json")
          def checked(method,**kwargs):
           try:
            req=urllib.request.Request(a.PORTAL+method,json.dumps(dict(kwargs,auth=auth["access_token"])).encode(),{"Content-Type":"application/json"})
            try:
             with urllib.request.urlopen(req,timeout=35) as r:data=json.load(r)
            except urllib.error.HTTPError as r:data=json.load(r)
            if data.get("error"):
             print("CHECK_ERROR="+method+":"+str(data["error"])+":"+str(data.get("error_description",""))[:200],flush=True)
             return None
            print("CHECK_OK="+method,flush=True)
            return data.get("result")
           except Exception as e:print("CHECK_TRANSPORT="+method+":"+type(e).__name__,flush=True);return None
          checked("app.info")
          checked("crm.item.list",entityTypeId=1062,useOriginalUfNames="Y",filter={"categoryId":21,">id":7},order={"id":"ASC"},select=["*"],start=0)
          activity=checked("crm.activity.configurable.get",id=205169)
          if activity:
           item=checked("crm.item.get",entityTypeId=1062,id=activity["activity"]["ownerId"],useOriginalUfNames="Y")
           if item:checked("crm.activity.configurable.update",id=205169,fields={"completed":False},layout=a.layout(item["item"],"finance"))
          print("WORKER_STATUS="+str(a.read("status.json",{}).get("status")))
          APP_AUDIT
