name: ServiceIT VPS B2B V18 multisource guarded coordinator-only release
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v18-multisource-live-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V18_MULTISOURCE_GUARDED_RELEASE_489'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact V18 source modules and reviewed rollback script
        shell: bash
        run: |
          set -euo pipefail
          reviewed='5f9972d92f618d4a22cc99e0a935ff9cd09f3978'
          git cat-file -e "$reviewed^{commit}"
          names=(serviceit_b2b_public_mirrors.py
            serviceit_b2b_tender_index_v18.py
            serviceit_vps_b2b_deep_research.py
            serviceit_b2b_dossier_v11.py
            serviceit_vps_worker.py)
          for name in "${names[@]}"; do
            git diff --quiet "$reviewed" HEAD -- "leadpilot/$name"
            python -m py_compile "leadpilot/$name"
          done
          script=ops/serviceit_vps_b2b_v18_multisource_activate.py
          git diff --quiet "$reviewed" HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v18-release"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v18-release/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v18-release/hosts"
          chmod 0600 "$RUNNER_TEMP/v18-release/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v18-release/hosts" >/dev/null
          : > "$RUNNER_TEMP/v18-release/shas"
          for name in "${names[@]}"; do
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v18-release/shas"
          done
          sha256sum "$script" | cut -d' ' -f1 > "$RUNNER_TEMP/v18-release/script-sha"
          [[ "$(wc -l < "$RUNNER_TEMP/v18-release/shas")" == 5 ]]
      - name: Transfer only attested modules and installer to locked VPS stage
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v18-release/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          stage="serviceit/staging/b2b-v18-multisource-release-$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/v18-release/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          for name in serviceit_b2b_public_mirrors.py \
                      serviceit_b2b_tender_index_v18.py \
                      serviceit_vps_b2b_deep_research.py \
                      serviceit_b2b_dossier_v11.py \
                      serviceit_vps_worker.py; do
            scp -i "$RUNNER_TEMP/v18-release/id" "${opts[@]}" \
              "leadpilot/$name" "$target:$stage/"
          done
          scp -i "$RUNNER_TEMP/v18-release/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v18_multisource_activate.py "$target:$stage/activate.py"
      - name: Validate source SHA, build offline and safely replace ONLY coordinator
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v18-release/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t shas < "$RUNNER_TEMP/v18-release/shas"
          [[ "${#shas[@]}" == 5 ]]
          scriptsha="$(cat "$RUNNER_TEMP/v18-release/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          checked=()
          for value in "${shas[@]}"; do
            [[ "$value" =~ ^[a-f0-9]{64}$ ]]
            checked+=("'$value'")
          done
          remote="bash -s -- '$GITHUB_RUN_ID' '$scriptsha' ${checked[*]}"
          set +e
          ssh -T -i "$RUNNER_TEMP/v18-release/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" "$remote" \
            > "$RUNNER_TEMP/v18-release/status" <<'REMOTE'
          set -euo pipefail
          id="$1"; sha="$2"; shift 2
          [[ "$id" =~ ^[0-9]{7,16}$ && "$sha" =~ ^[a-f0-9]{64}$ && "$#" == 5 ]]
          for v in "$@"; do [[ "$v" =~ ^[a-f0-9]{64}$ ]]; done
          script="$HOME/serviceit/staging/b2b-v18-multisource-release-$id/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$sha" "$script" | sha256sum --check --status
          python3 "$script" "$id" "$@"
          REMOTE
          rc=$?
          set -e
          grep -E '^V18_RELEASE_[A-Z0-9_]+=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,90})$' \
            "$RUNNER_TEMP/v18-release/status" | head -30 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V18_RELEASE_VPS_LIVE_ENABLED=YES' "$RUNNER_TEMP/v18-release/status"
          grep -qx 'V18_RELEASE_CRM_WRITES_BY_INSTALLER=NO' "$RUNNER_TEMP/v18-release/status"
