name: ServiceIT B2B current source SHA readonly
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  sha:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      github.event.comment.body == 'SERVICEIT_B2B_RESEARCH_MODULES_READONLY_314'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Read running module SHA256 only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/svcit"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/svcit/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/svcit/hosts"
          chmod 600 "$RUNNER_TEMP/svcit/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/svcit/hosts" >/dev/null
          ssh -T -i "$RUNNER_TEMP/svcit/id" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/svcit/hosts" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' <<'PY'
          import hashlib
          from pathlib import Path
          from leadpilot.serviceit_vps_worker import INTERVAL_SECONDS
          for name in ('serviceit_vps_worker','serviceit_vps_native_fence','serviceit_b2b_hold_ai_fields','serviceit_windows_autofill','serviceit_vps_b2b_deep_research','serviceit_b2b_routerai_deep','serviceit_public_evidence_research'):
              p=Path('/app/leadpilot')/(name+'.py')
              print('MODULE_'+name.upper()+'='+(hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else 'MISSING'))
          for key in ('SERVICEIT_VPS_B2B_DEEP_RESEARCH_ENABLED','SERVICEIT_VPS_BROWSER_RESEARCH_ENABLED','SERVICEIT_VPS_BROWSER_PROXY_ISOLATION_VERIFIED','SERVICEIT_DEEP_COMPANY_SEARCH_ENABLED','SERVICEIT_BRAVE_LLM_CONTEXT_ENABLED','SERVICEIT_VPS_WRITER_MODE','SERVICEIT_VPS_POLL_ENABLED'):
              raw=__import__('os').environ.get(key,'UNSET')
              print('FLAG_'+key+'='+(raw if raw in ('YES','NO','LIVE','UNSET') else 'OTHER'))
          from pathlib import Path as P
          import os
          for key in ('SERVICEIT_ROUTERAI_API_KEY_FILE','SERVICEIT_BRAVE_SEARCH_API_KEY_FILE','SERVICEIT_BITRIX_WEBHOOK_FILE'):
              path=os.environ.get(key,'')
              ready=path.startswith('/run/secrets/') and P(path).is_file() and P(path).stat().st_size>0
              print('MOUNT_'+key+'='+('YES' if ready else 'NO'))
          print('B2B_CADENCE_300='+('YES' if INTERVAL_SECONDS==300 else 'NO'))
          PY
