name: ServiceIT V28 first signed B2B verified Tendem public evidence read-only
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v28-first-tendem-readonly
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V28_FIRST_TENDEM_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reviewed and locked owner-only script; pin current free source code
        shell: bash
        run: |
          set -euo pipefail
          reviewed='eeefd0a61bce97f98f7c14dd74f77928c3c041ac'
          git cat-file -e "$reviewed^{commit}"
          script=ops/serviceit_vps_b2b_v28_first_tendem_readonly.py
          git diff --quiet "$reviewed" HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v28"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v28/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v28/hosts"
          chmod 0600 "$RUNNER_TEMP/v28/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v28/hosts" >/dev/null
      - name: Read one EXACT signed public Tendum source without writes
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v28/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          files=(serviceit_b2b_free_public_fallback.py
                 serviceit_b2b_remote_public_fetch.py
                 serviceit_b2b_public_fact_extractor.py
                 serviceit_b2b_v19_backfill.py)
          sha=()
          for file in "${files[@]}"; do
            value="$(sha256sum "leadpilot/$file" | cut -d' ' -f1)"
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
            sha+=("'$value'")
          done
          set +e
          ssh -T -i "$RUNNER_TEMP/v28/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - ${sha[*]}" \
            < ops/serviceit_vps_b2b_v28_first_tendem_readonly.py \
            > "$RUNNER_TEMP/v28/summary" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V28_FIRST_[A-Z0-9_]+=(YES|NO|[0-9]{1,12}|[A-Z0-9_]{4,85}) \
            "$RUNNER_TEMP/v28/summary" | head -25 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V28_FIRST_SOURCE_AND_GATES=YES' "$RUNNER_TEMP/v28/summary"
          grep -Eq '^V28_FIRST_TENDER_ID=[0-9]{5,12}
          grep -qx 'V28_FIRST_CRM_WRITES=NO' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PG_WRITES=NO' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PAID_MODEL_CALLS=NO' "$RUNNER_TEMP/v28/summary"
 \
            "$RUNNER_TEMP/v28/summary" | head -25 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V28_FIRST_SOURCE_AND_GATES=YES' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_SIGNED_FIRST_MATCHES_TENDEM=YES' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PUBLIC_TENDEM_EXACT=YES' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_CRM_WRITES=NO' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PG_WRITES=NO' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PAID_MODEL_CALLS=NO' "$RUNNER_TEMP/v28/summary"
 "$RUNNER_TEMP/v28/summary"
          if grep -qx 'V28_FIRST_SIGNED_FIRST_ID_MATCH=YES' "$RUNNER_TEMP/v28/summary"; then
            grep -qx 'V28_FIRST_SIGNED_FIRST_MATCHES_TENDEM=YES' "$RUNNER_TEMP/v28/summary"
            grep -qx 'V28_FIRST_PUBLIC_TENDEM_EXACT=YES' "$RUNNER_TEMP/v28/summary"
          else
            grep -qx 'V28_FIRST_PILOT_TENDER_NOT_FIRST=YES' "$RUNNER_TEMP/v28/summary"
          fi
          grep -qx 'V28_FIRST_CRM_WRITES=NO' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PG_WRITES=NO' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PAID_MODEL_CALLS=NO' "$RUNNER_TEMP/v28/summary"
 \
            "$RUNNER_TEMP/v28/summary" | head -25 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V28_FIRST_SOURCE_AND_GATES=YES' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_SIGNED_FIRST_MATCHES_TENDEM=YES' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PUBLIC_TENDEM_EXACT=YES' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_CRM_WRITES=NO' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PG_WRITES=NO' "$RUNNER_TEMP/v28/summary"
          grep -qx 'V28_FIRST_PAID_MODEL_CALLS=NO' "$RUNNER_TEMP/v28/summary"
