name: ServiceIT stages 3 and 4 live readiness (ALL future cards, READ ONLY)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-stage34-readiness-only
  cancel-in-progress: false
jobs:
  verify-live-readonly:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 148 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_STAGE34_LIVE_READINESS_ONLY_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_POLL_START_UTC: ${{ vars.SERVICEIT_BITRIX_POLL_START_UTC }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ServiceIT dependencies
        run: python -m pip install -r requirements.txt
      - name: Exact portal 1062/21, task link, score schema and future IDs (NO WRITES)
        run: python -m leadpilot.serviceit_stage34_live_readiness
