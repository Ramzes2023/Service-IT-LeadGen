name: ServiceIT OCR transfer audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-vps-b2b-ocr-transfer-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Read transfer state without modifying VPS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/identity"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known"
          ssh -T -i "$RUNNER_TEMP/identity" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=12 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          stage="$HOME/serviceit/staging/b2b-document-ocr-onefile-release-43260680567"
          if [[ -d "$stage" && ! -L "$stage" ]]; then
            find "$stage" -maxdepth 1 -type f -printf '%f %s\n' | sort
          else
            printf '%s\n' STAGE_NOT_CREATED
          fi
          REMOTE
