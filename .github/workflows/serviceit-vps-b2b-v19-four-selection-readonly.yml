name: ServiceIT V19 four signed source receipt and selected card READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v19-four-selected-receipt
  cancel-in-progress: false
jobs:
  origin:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V19_FOUR_SELECTION_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin reviewed read-only origin script and host key
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'a1adbc9a56445876797a926c1569590d9dcff2d4^{commit}'
          script=ops/serviceit_vps_b2b_v19_selection_readonly.py
          git diff --quiet a1adbc9a56445876797a926c1569590d9dcff2d4 HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v19-origin"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v19-origin/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v19-origin/hosts"
          chmod 0600 "$RUNNER_TEMP/v19-origin/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v19-origin/hosts" >/dev/null

      - name: Read signed historical B2B selection states, NO CRM/PG WRITE
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v19-origin/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/v19-origin/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_v19_selection_readonly.py \
            > "$RUNNER_TEMP/v19-origin/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V19_SELECT_[A-Z0-9_]+=(YES|NO|ONE|TWO|THREE|FOUR|OTHER|MISSING|NONE|RESERVED|WRITE_INTENT|VERIFIED|NO_NEW_EVIDENCE|INSUFFICIENT_CAPACITY|CONFLICT|UNCERTAIN)$' \
            "$RUNNER_TEMP/v19-origin/status" | head -12 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V19_SELECT_FOUR_ORIGINAL=YES' "$RUNNER_TEMP/v19-origin/status"
