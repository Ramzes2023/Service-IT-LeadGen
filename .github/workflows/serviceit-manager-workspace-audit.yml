# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT manager workspace independent readback
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-manager-workspace-audit.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-manager-workspace-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' < ops/serviceit_manager_workspace_audit.py
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          crontab -l | grep -q '^[*]/5 .*# SERVICEIT_MANAGER_WORKSPACE_V1$'
          printf 'WORKSPACE_SCHEDULE_STILL_ENABLED=YES\n'
          logfile="$HOME/serviceit/manager-workspace/status.log"
          if [[ -f "$logfile" ]]; then
            tail -n 20 "$logfile" | grep -E '^WORKSPACE_[A-Z_]+=[A-Z0-9_]+$' || true
          fi
          REMOTE
