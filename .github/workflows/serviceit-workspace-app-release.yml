name: ServiceIT manager application prepare and deploy
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-workspace-app-release.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-workspace-app-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check application and financial edge cases
        run: |
          node --check apps/manager-workspace/app.js
          node apps/manager-workspace/test.cjs
          python -m py_compile apps/manager-workspace/server.py deploy/serviceit-workspace-caddy-enable.py
      - name: Stage and start isolated application
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/app"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          target="$VPS_USER@$VPS_HOST"
          remote="serviceit/workspace-app/releases/$GITHUB_RUN_ID"
          ssh -T -i "$stage/id" "${opts[@]}" "$target" "umask 077; install -d -m 0700 '$remote'"
          scp -i "$stage/id" "${opts[@]}" apps/manager-workspace/{server.py,index.html,app.js,style.css,Dockerfile} deploy/serviceit-workspace-caddy-enable.py "$target:$remote/"
          ssh -T -i "$stage/id" "${opts[@]}" "$target" "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          id="$1"
          [[ "$id" =~ ^[0-9]{7,16}$ ]]
          dir="$HOME/serviceit/workspace-app/releases/$id"
          name=serviceit-manager-workspace-app
          image="serviceit-workspace-app:$id"
          docker build -q -t "$image" "$dir" >/dev/null
          old="$(docker inspect --format '{{.Config.Image}}' "$name" 2>/dev/null || true)"
          start() {
            docker run -d --name "$name" --restart unless-stopped --read-only --tmpfs /tmp:size=8m --cap-drop ALL --security-opt no-new-privileges --pids-limit 80 --memory 128m --cpus .5 -p 127.0.0.1:18784:8000 "$1" >/dev/null
          }
          docker rm -f "$name" >/dev/null 2>&1 || true
          start "$image"
          ok=NO
          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:18784/apps/serviceit-workspace/health > "$dir/health.json"; then ok=YES; break; fi
            sleep 1
          done
          if [[ "$ok" != YES ]]; then
            docker rm -f "$name" >/dev/null
            [[ -z "$old" ]] || start "$old"
            exit 2
          fi
          python3 - "$dir/health.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['status']=='READY_FOR_BITRIX_INSTALLATION'
          print('WORKSPACE_APP_LOCAL_HEALTH=VERIFIED')
          PY
          ln -sfn "$dir" "$HOME/serviceit/workspace-app/current"
          if sudo -n true >/dev/null 2>&1; then
            sudo -n python3 "$dir/serviceit-workspace-caddy-enable.py"
          else
            printf 'WORKSPACE_APP_ROUTE=ROOT_OPERATOR_REQUIRED\n'
          fi
          REMOTE
      - name: Check public installation endpoint
        run: |
          python - <<'PY'
          import urllib.request,json
          try:
              with urllib.request.urlopen('https://leadgen.serviseit.ru/apps/serviceit-workspace/health',timeout=20) as r:
                  assert json.load(r)['status']=='READY_FOR_BITRIX_INSTALLATION'
              print('WORKSPACE_APP_HTTPS=VERIFIED')
          except Exception:
              print('WORKSPACE_APP_HTTPS=PENDING_ROOT_ROUTE')
          PY
