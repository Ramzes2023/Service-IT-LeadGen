name: ServiceIT Tavily reserve read-only usage probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-vps-tavily-reserve-usage.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v37-search-release
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Verify the mounted provider key with GET usage
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/tavily-usage"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/id" "$stage/hosts"
          ssh-keygen -F "$VPS_HOST" -f "$stage/hosts" >/dev/null
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' > "$stage/status" <<'REMOTE'
          set -euo pipefail
          core=serviceit-leadgen-vps-coordinator-1
          img="$(docker inspect --format '{{.Image}}' "$core")"
          [[ "$img" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --rm -i --pull never --read-only --user 10001:10001 --cap-drop ALL \
            --mount type=bind,src=/etc/serviceit/secrets/tavily_api_key,dst=/run/tavily,readonly \
            --entrypoint python "$img" -B - <<'PY'
          from pathlib import Path
          import re
          import httpx

          try:
              key = Path("/run/tavily").read_text().strip()
              if not re.fullmatch(r"tvly-[!-~]{15,215}", key):
                  print("TAVILY_RESERVE_KEY=FORMAT_UNVERIFIED")
              else:
                  with httpx.Client(timeout=15, trust_env=False, follow_redirects=False) as client:
                      r = client.get("https://api.tavily.com/usage",
                                     headers={"Authorization": "Bearer " + key})
                  print("TAVILY_RESERVE_USAGE_HTTP=" + str(r.status_code))
                  if r.status_code == 200:
                      account = r.json().get("account", {})
                      limit, used = account.get("plan_limit"), account.get("plan_usage")
                      ready = type(limit) is int and type(used) is int and 0 <= used <= limit and limit-used >= 110
                      print("TAVILY_RESERVE_INCLUDED_CREDITS=" + ("READY" if ready else "UNVERIFIED"))
          except (OSError, ValueError, httpx.HTTPError):
              print("TAVILY_RESERVE_USAGE=UNVERIFIED")
          PY
          REMOTE
          grep -E '^TAVILY_RESERVE_[A-Z_]+=[A-Z0-9_]+$' "$stage/status"
