name: ServiceIT VPS B2B card INN gap census for official FNS READY (READONLY)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: serviceit-vps-fns-inn-census-368-readonly
  cancel-in-progress: false

jobs:
  fns-msp-readonly:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_FNS_B2B_INN_GAP_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Verify non-root SSH identity and pinned host fingerprint
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/serviceit-fns-audit"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-fns-audit/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-fns-audit/known_hosts"
          chmod 600 "$RUNNER_TEMP/serviceit-fns-audit/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/serviceit-fns-audit/known_hosts" >/dev/null

      - name: Read native FNS-MSP state without CRM or PostgreSQL writes
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/serviceit-fns-audit/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-fns-audit/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' <<'PY'
          import os
          import subprocess

          C = "serviceit-leadgen-vps-coordinator-1"
          A = "serviceit-leadgen-vps-auxiliaries-1"
          M = "serviceit-leadgen-vps-fns-msp-1"

          def run(*args, timeout=45):
              try:
                  p = subprocess.run(args, capture_output=True, text=True,
                                     timeout=timeout, check=False)
                  return p.returncode, p.stdout.strip()
              except (OSError, subprocess.TimeoutExpired):
                  return 99, ""

          def status(container, key):
              rc, val = run("docker", "exec", container, "printenv", key)
              return val if rc == 0 and val in ("YES", "NO", "LIVE", "READONLY") else "UNVERIFIED"

          print("VPS_FNS_MSP_READONLY_AUDIT=START", flush=True)
          for name, container in (("COORDINATOR", C), ("AUXILIARIES", A), ("FNS_MSP", M)):
              rc, val = run("docker", "inspect", "-f",
                 "{{.State.Running}}:{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}",
                 container)
              print(name + "_CONTAINER=" + (
                  "HEALTHY" if val == "true:healthy" else
                  "RUNNING_NO_HEALTH" if val == "true:none" else "NOT_RUNNING_OR_INACCESSIBLE"), flush=True)

          for label, container, key in (
              ("WRITER_MODE", C, "SERVICEIT_VPS_WRITER_MODE"),
              ("POLL_ENABLED", C, "SERVICEIT_VPS_POLL_ENABLED"),
              ("FNS_MSP_COLLECTOR_ENABLED", M, "SERVICEIT_VPS_FNS_MSP_ENABLED"),
              ("FNS_CRM_RESULT_ENABLED", A, "SERVICEIT_VPS_FNS_CRM_RESULT_ENABLED"),
              ("FREE_MSP_SCORE_ENABLED", A, "SERVICEIT_VPS_FREE_MSP_SCORE_ENABLED"),
              ("PROVISIONAL_SCORE_ENABLED", A, "SERVICEIT_VPS_PROVISIONAL_SCORE_ENABLED"),
          ):
              print(label + "=" + status(container, key), flush=True)

          for label, container, module in (
              ("FNS_COLLECTOR_CODE", C, "leadpilot.serviceit_vps_native_msp"),
              ("FNS_RESULT_CODE", A, "leadpilot.serviceit_vps_native_msp_result"),
          ):
              program = ("import importlib.util;print('YES' if "
                         "importlib.util.find_spec('" + module + "') else 'NO')")
              rc, val = run("docker", "exec", container, "python", "-c", program)
              print(label + "=" + (val if rc == 0 and val in ("YES", "NO")
                                     else "UNVERIFIED"), flush=True)

          pg = """
          import os
          from leadpilot.serviceit_vps_pg_queue import db
          with db(dict(os.environ)) as con:
              with con.transaction():
                  with con.cursor() as cur:
                      cur.execute('SET TRANSACTION READ ONLY')
                      cur.execute("SELECT to_regclass('public.serviceit_vps_msp_snapshot') IS NOT NULL")
                      present = bool(cur.fetchone()[0])
                      print('READY' if present else 'MISSING')
                      if present:
                          cur.execute("SELECT COUNT(*), COUNT(msp_category) FROM serviceit_vps_msp_snapshot")
                          total, matched = cur.fetchone()
                          print("FNS_SNAPSHOT_RECEIPTS=" + str(min(total, 100000000)))
                          print("FNS_MSP_MATCHED=" + str(min(matched, 100000000)))
          """
          rc, val = run("docker", "exec", C, "python", "-c", pg)
          print("FNS_MSP_PG_SCHEMA=" + ("READY" if rc == 0 and val.startswith("READY") else
                                         "MISSING" if rc == 0 and val == "MISSING"
                                         else "UNVERIFIED"), flush=True)
          for line in val.splitlines()[1:3]:
              if line.startswith(("FNS_SNAPSHOT_RECEIPTS=", "FNS_MSP_MATCHED=")):
                  print(line, flush=True)

          crm = """
          import os
          import httpx
          from leadpilot.serviceit_vps_pg_queue import secret_file
          from leadpilot.bitrix_metadata_audit import validate_webhook
          from leadpilot.serviceit_fns_msp_crm_result_writer import result_field_verified
          try:
              base = validate_webhook(secret_file(dict(os.environ), 'SERVICEIT_BITRIX_WEBHOOK'))
              with httpx.Client(trust_env=False,follow_redirects=False) as client:
                  print('READY' if result_field_verified(client,base) else 'NOT_READY')
          except Exception:
              print('NOT_READY_OR_NOT_ACCESSIBLE')
          """
          rc, val = run("docker", "exec", A, "python", "-c", crm)
          print("BITRIX_FNS_RESULT_FIELD=" + (
              val if rc == 0 and val in ("READY","NOT_READY","NOT_READY_OR_NOT_ACCESSIBLE")
              else "UNVERIFIED"), flush=True)

          scratch = "/var/lib/serviceit/fns-scratch"
          if os.path.isdir(scratch) and not os.path.islink(scratch):
              try:
                  s = os.statvfs(scratch)
                  gb = s.f_bavail * s.f_frsize
                  print("FNS_SCRATCH=PRESENT", flush=True)
                  print("FNS_SCRATCH_FREE_GE_25GB=" +
                        ("YES" if gb >= 25*1024**3 else "NO"), flush=True)
              except OSError:
                  print("FNS_SCRATCH=UNVERIFIED", flush=True)
          else:
              print("FNS_SCRATCH=NOT_PREPARED_OR_INACCESSIBLE", flush=True)
          print("CRM_WRITES=0;PG_WRITES=0;RESTARTS=0;SOURCES_CHANGED=NO", flush=True)
          print("FNS_E2E=NOT_VERIFIED_BY_READONLY_AUDIT", flush=True)
          PY

      - name: Read aggregate B2B CRM INN missing and candidate-only counts, no identity outputs
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/serviceit-fns-audit/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-fns-audit/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-fns-msp-1 python -B -' <<'PY'
          from datetime import datetime, timezone
          import os
          import httpx
          from leadpilot.bitrix_1062_mapping import _is_valid_inn
          from leadpilot.bitrix_metadata_audit import validate_webhook
          from leadpilot.serviceit_stage4_fns_dedupe_watch import read_item
          from leadpilot.serviceit_vps_pg_queue import db, secret_file
          from leadpilot.serviceit_vps_native_msp import MAX_CARDS
          from leadpilot.serviceit_enrichment_worker import PREFIX
          from leadpilot.serviceit_bitrix_poll_fallback import (
              after_activation, calibrate_known_card, discover)
          from leadpilot.serviceit_bitrix_batch_worker import list_only

          counts = {"verified": 0, "inn_valid": 0, "inn_missing": 0,
                    "inn_invalid": 0, "candidate_in_ai_only": 0,
                    "fresh_new": -1, "fresh_valid": -1}
          try:
              with db(dict(os.environ)) as connection:
                  with connection.transaction():
                      with connection.cursor() as cur:
                          cur.execute("SET TRANSACTION READ ONLY")
                          cur.execute(
                              "SELECT COUNT(DISTINCT card_id) FROM serviceit_vps_b2b_inbox "
                              "WHERE state='VERIFIED' AND card_id IS NOT NULL")
                          counts["verified"] = int(cur.fetchone()[0])
                          cur.execute(
                              "SELECT DISTINCT card_id FROM serviceit_vps_b2b_inbox "
                              "WHERE state='VERIFIED' AND card_id IS NOT NULL "
                              "ORDER BY card_id LIMIT 20")
                          cards = [int(row[0]) for row in cur.fetchall()]
              base = validate_webhook(
                  secret_file(dict(os.environ), "SERVICEIT_BITRIX_WEBHOOK"))
              with httpx.Client(trust_env=False, follow_redirects=False,
                                timeout=23.0) as client:
                  for card in cards:
                      item = read_item(client, base, card)
                      inn = item.get(PREFIX + "COMPANY_INN")
                      if isinstance(inn, str) and _is_valid_inn(inn):
                          counts["inn_valid"] += 1
                      elif not isinstance(inn, str) or not inn.strip():
                          counts["inn_missing"] += 1
                          report = item.get(PREFIX + "AI_FULL_REPORT")
                          if isinstance(report, str) and "ИНН-кандидат" in report:
                              counts["candidate_in_ai_only"] += 1
                      else:
                          counts["inn_invalid"] += 1
                  from leadpilot.serviceit_vps_worker import live_permitted
                  # Reuse EXACT production activation window, no dispatch/writes.
                  env = dict(os.environ)
                  now = datetime.now(timezone.utc)
                  since = after_activation({
                      **env, "SERVICEIT_BITRIX_POLL_START_UTC":
                          env["SERVICEIT_VPS_NATIVE_ACTIVATION_UTC"]}, now)
                  def rest(m, p):
                      return list_only(client, base, m, p)
                  calibrate_known_card(rest)
                  fresh = discover(rest, since, now)
                  counts["fresh_new"] = len(fresh)
                  counts["fresh_valid"] = sum(
                      bool(_is_valid_inn(read_item(client, base, c).get(
                          PREFIX + "COMPANY_INN"))) for c in fresh[:MAX_CARDS])
          except Exception:
              print("FNS_B2B_INN_CENSUS=UNVERIFIED")
              print("CRM_WRITES=0;PG_WRITES=0;FNS_DOWNLOADS=0")
              raise SystemExit(0)
          print("FNS_B2B_INN_CENSUS=OK")
          print("B2B_VERIFIED_INBOX_CARDS=" + str(counts["verified"]))
          print("B2B_CENSUS_SCOPE=" + (
              "ALL" if counts["verified"] <= 20 else "FIRST_20_ONLY"))
          print("B2B_INN_VALID=" + str(counts["inn_valid"]))
          print("B2B_INN_MISSING=" + str(counts["inn_missing"]))
          print("B2B_INN_INVALID=" + str(counts["inn_invalid"]))
          print("B2B_INN_CANDIDATE_AI_ONLY=" + str(counts["candidate_in_ai_only"]))
          print("FNS_ACTIVATION_WINDOW_NEW_CARDS=" + str(counts["fresh_new"]))
          print("FNS_ACTIVATION_WINDOW_VALID_INNS=" + str(counts["fresh_valid"]))
          print("CRM_WRITES=0;PG_WRITES=0;FNS_DOWNLOADS=0")
          PY
