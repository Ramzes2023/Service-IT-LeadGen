name: ServiceIT VPS V35 durable TinyFish retry ledger read-only acceptance
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v35-retry-ledger-readonly
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V35_RETRY_LEDGER_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exactly two reviewed retry modules, no writes
        shell: bash
        run: |
          set -euo pipefail
          reviewed='1261f6a6e2ec18bce09814ff1bfe9bb519762b62'
          git cat-file -e "$reviewed^{commit}"
          names=(serviceit_vps_worker.py
            serviceit_vps_b2b_tinyfish_retry.py)
          for name in "${names[@]}"; do
            git diff --quiet "$reviewed" HEAD -- "leadpilot/$name"
          done
          script=ops/serviceit_vps_b2b_v35_retry_readonly_audit.py
          python -m py_compile "$script"
          git cat-file -e "$reviewed^{commit}"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v35-four"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v35-four/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v35-four/hosts"
          chmod 0600 "$RUNNER_TEMP/v35-four/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v35-four/hosts" >/dev/null
          : > "$RUNNER_TEMP/v35-four/shas"
          for name in "${names[@]}"; do
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v35-four/shas"
          done
      - name: Verify runtime SHA and existing PostgreSQL retry attempts READONLY
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v35-four/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t shas < "$RUNNER_TEMP/v35-four/shas"
          [[ "${#shas[@]}" == 2 ]]
          checked=()
          for v in "${shas[@]}"; do
            [[ "$v" =~ ^[a-f0-9]{64}$ ]]
            checked+=("'$v'")
          done
          set +e
          ssh -T -i "$RUNNER_TEMP/v35-four/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - ${checked[*]}" \
            < ops/serviceit_vps_b2b_v35_retry_readonly_audit.py \
            > "$RUNNER_TEMP/v35-four/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V35_RETRY_AUDIT_[A-Z0-9_]{3,62}=(YES|NO|[0-9]{1,5}|[A-Z0-9_]{4,75})$' \
            "$RUNNER_TEMP/v35-four/status" | head -45 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V35_RETRY_AUDIT_EXACT_MODULE_SHAS=YES' "$RUNNER_TEMP/v35-four/status"
          grep -qx 'V35_RETRY_AUDIT_SIGNED_FOUR=4' "$RUNNER_TEMP/v35-four/status"
          grep -qx 'V35_RETRY_AUDIT_CRM_WRITES=0' "$RUNNER_TEMP/v35-four/status"
          grep -qx 'V35_RETRY_AUDIT_FIVE_MINUTE_RETRY_ENABLED=YES' "$RUNNER_TEMP/v35-four/status"
