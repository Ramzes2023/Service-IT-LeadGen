# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT OAuth network diagnosis without credentials
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-workspace-oauth-probe.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-workspace-oauth-probe
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-manager-workspace-app python -B -' <<'PY'
          import urllib.request,urllib.error,json,socket
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          for host in ('oauth.bitrix24.tech','oauth.bitrix.info'):
           for method in ('GET','POST'):
            try:
             req=urllib.request.Request('https://'+host+'/oauth/token/',data=b'grant_type=refresh_token' if method=='POST' else None,headers={'Content-Type':'application/x-www-form-urlencoded'})
             try:r=urllib.request.build_opener(NoRedirect).open(req,timeout=15)
             except urllib.error.HTTPError as e:r=e
             print('OAUTH_PROBE='+host+'_'+method+'_HTTP_'+str(r.code))
             print('OAUTH_REDIRECT='+str(r.headers.get('Location','')).split('?')[0])
             try:
              data=json.loads(r.read(65536));code=str(data.get('error',''))
              print('OAUTH_ERROR='+code if code.replace('_','').isalnum() else 'OAUTH_ERROR=OTHER')
             except Exception:print('OAUTH_BODY=NON_JSON')
            except Exception as e:
             print('OAUTH_TRANSPORT='+host+'_'+method+'_'+type(e).__name__)
             reason=getattr(e,'reason',None)
             if reason:print('OAUTH_REASON_TYPE='+type(reason).__name__)
          PY
