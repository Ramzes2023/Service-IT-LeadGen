name: ServiceIT public B2B mirrors robots and exact ID READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  mirror-probe:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      github.event.comment.body == 'SERVICEIT_PUBLIC_MIRROR_ROBOTS_READONLY_314'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Pinned VPS read-only public page transport and robots check
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/mirror"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/mirror/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/mirror/hosts"
          chmod 600 "$RUNNER_TEMP/mirror/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/mirror/hosts" >/dev/null
          ssh -T -i "$RUNNER_TEMP/mirror/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/mirror/hosts" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' <<'PY'
          import httpx,re
          from leadpilot.serviceit_public_evidence_research import _page,_get,_robots,VisibleText,ResearchBlocked
          checks=(
            ('KONTUR','https://zakupki.kontur.ru/4673595_4','zakupki.kontur.ru'),
            ('TENDEM','https://tendem.ru/tenders/16548471','tendem.ru'),
          )
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=12) as client:
            for label,url,host in checks:
              try:
                page=_page(client,url,frozenset((host,)))
                text=page.get('text','')
                print('MIRROR_'+label+'_HTTP_AND_ROBOTS=YES')
                print('MIRROR_'+label+'_NUMBER_IN_TEXT='+('YES' if re.search(r'(?<!\d)4673595(?!\d)',text) else 'NO'))
                print('MIRROR_'+label+'_TEXT_CHARS='+str(min(len(text),7000)))
                raw=_get(client,url,frozenset((host,)))
                parse=VisibleText()
                parse.feed(raw)
                whole=" ".join(parse.parts)
                m=re.search(r'(?<!\d)4673595(?!\d)',whole)
                print('MIRROR_'+label+'_FULL_CHARS='+str(min(len(whole),50000)))
                print('MIRROR_'+label+'_NUMBER_IN_FULL='+('YES' if m else 'NO'))
                print('MIRROR_'+label+'_NUMBER_OFFSET='+str(min(m.start(),50000) if m else 0))
              except (ResearchBlocked,httpx.HTTPError,ValueError) as exc:
                print('MIRROR_'+label+'_HTTP_AND_ROBOTS=NO')
                print('MIRROR_'+label+'_NUMBER_IN_TEXT=NO')
                reason=str(exc) if isinstance(exc,ResearchBlocked) else 'NETWORK_OR_HTTP'
                print('MIRROR_'+label+'_BLOCK='+(
                  reason if re.fullmatch(r'[A-Z0-9_]{4,80}',reason) else 'OTHER'))
          from leadpilot.serviceit_vps_pg_queue import db
          from leadpilot.serviceit_b2b_public_mirrors import from_public_page
          import os
          with db(dict(os.environ)) as conn:
            with conn.cursor() as cur:
              cur.execute("SELECT notice_json FROM serviceit_vps_b2b_inbox WHERE state='VERIFIED' AND card_id IS NOT NULL ORDER BY received_at LIMIT 8")
              notices=cur.fetchall()
          for index,row in enumerate(notices,1):
            notice=row[0]
            is_known=type(notice) is dict and notice.get('tender_id')=='4673595'
            print('MIRROR_CARD_'+str(index)+'_EXACT_KNOWN_ID='+('YES' if is_known else 'NO'))
            if is_known:
              try:
                with httpx.Client(trust_env=False,follow_redirects=False,timeout=12) as client:
                  candidate=from_public_page(client,'https://tendem.ru/tenders/16548471',
                    '4673595',notice.get('subject',''))
                print('MIRROR_CARD_'+str(index)+'_VERIFIED_RELEVANT_EXCERPT='+('YES' if candidate else 'NO'))
                print('MIRROR_CARD_'+str(index)+'_EXCERPT_CHARS='+str(min(len(candidate['excerpt']),3500) if candidate else 0))
              except (ResearchBlocked,httpx.HTTPError,ValueError,TypeError):
                print('MIRROR_CARD_'+str(index)+'_VERIFIED_RELEVANT_EXCERPT=NO')
          print('MIRROR_PROBE_DONE=YES')
          PY
