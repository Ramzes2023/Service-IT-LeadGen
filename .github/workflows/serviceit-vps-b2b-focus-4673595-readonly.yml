name: ServiceIT B2B four card public tender 4673595 correlation READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-focus-4673595-readonly
  cancel-in-progress: false
jobs:
  correlate:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_B2B_FOUR_4673595_CORRELATE_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Verify pinned SSH and inspect only known public tender correlation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/b2b-correlation"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/b2b-correlation/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/b2b-correlation/hosts"
          chmod 600 "$RUNNER_TEMP/b2b-correlation/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/b2b-correlation/hosts" >/dev/null
          ssh -T -i "$RUNNER_TEMP/b2b-correlation/key" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-correlation/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' <<'PY'
          import os
          from leadpilot.serviceit_vps_pg_queue import db
          target='B2B-CENTER-4673595'
          with db(dict(os.environ)) as con:
              with con.transaction():
                  with con.cursor() as cur:
                      cur.execute('SET TRANSACTION READ ONLY')
                      cur.execute("SELECT b.source_id,b.notice_json FROM serviceit_vps_b2b_inbox b WHERE b.state='VERIFIED' AND b.card_id IS NOT NULL ORDER BY b.received_at,b.source_id LIMIT 5")
                      rows=cur.fetchall()
          assert len(rows)==4
          print('FOCUS_FOUR_REAL_CARDS=YES',flush=True)
          for i,(source,notice) in enumerate(rows,1):
              match=(source==target and isinstance(notice,dict)
                     and notice.get('tender_id')=='4673595')
              print('FOCUS_CARD_'+str(i)+'_IS_PUBLIC_4673595='+('YES' if match else 'NO'),flush=True)
          print('FOCUS_READONLY=YES',flush=True)
          PY
