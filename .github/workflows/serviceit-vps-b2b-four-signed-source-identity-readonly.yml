name: ServiceIT B2B four signed tender numbers and native receipts READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-four-signed-tender-identity-readonly
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_FOUR_SIGNED_IDENTITY_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check owner SSH and compile approved read-only script
        shell: bash
        run: |
          set -euo pipefail
          script=ops/serviceit_vps_b2b_four_signed_source_identity_readonly.py
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/four-id"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/four-id/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/four-id/hosts"
          chmod 0600 "$RUNNER_TEMP/four-id/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/four-id/hosts" >/dev/null
      - name: Get public signed IDs and PG statuses, no CRM or DB writes
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
              -o UserKnownHostsFile="$RUNNER_TEMP/four-id/hosts"
              -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/four-id/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_four_signed_source_identity_readonly.py \
            > "$RUNNER_TEMP/four-id/result" 2>/dev/null
          rc=$?
          set -e
          grep -E '^B2B_FOUR_IDENTITY_[A-Z0-9_]+=[A-Z0-9_]+$' \
            "$RUNNER_TEMP/four-id/result" | head -45 || true
          [[ "$rc" == 0 ]]
          grep -qx 'B2B_FOUR_IDENTITY_COUNT=4' "$RUNNER_TEMP/four-id/result"
          grep -qx 'B2B_FOUR_IDENTITY_CRM_WRITES=NO' "$RUNNER_TEMP/four-id/result"
          grep -qx 'B2B_FOUR_IDENTITY_PG_WRITES=NO' "$RUNNER_TEMP/four-id/result"
          grep -qx 'B2B_FOUR_IDENTITY_EXTERNAL_SEARCH=NO' "$RUNNER_TEMP/four-id/result"
