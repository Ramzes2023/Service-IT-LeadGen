name: ServiceIT Bitrix24 new-card polling fallback (no outgoing webhook)

on:
  # Offset from top of hour; cron is best-effort, not a guaranteed real-time SLA.
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Always READ-ONLY: validate crm.item.list without dispatch or CRM writes'
        required: false
        default: true
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: serviceit-bitrix-poll-fallback
  cancel-in-progress: false

jobs:
  readonly-probe-or-scheduled-scan:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'Ramzes2023' &&
        github.event.issue.number == 74 &&
        !github.event.issue.pull_request &&
        (github.event.comment.body == 'SERVICEIT_NMODE_NEW_CARD_POLL_READONLY_V1' ||
         (github.event.comment.body == 'SERVICEIT_OWNER_NEW_CARD_LIVE_ONCE_V1' &&
          vars.SERVICEIT_VPS_CUTOVER_ACTIVE != 'YES' &&
          vars.SERVICEIT_BITRIX_POLL_ENABLED == 'YES_1062_21_READONLY' &&
          vars.SERVICEIT_BITRIX_EVENT_AI_ENABLED == 'YES_1062_21_CLOUD'))) ||
       (github.event_name == 'schedule' &&
        vars.SERVICEIT_VPS_CUTOVER_ACTIVE != 'YES' &&
        vars.SERVICEIT_BITRIX_POLL_ENABLED == 'YES_1062_21_READONLY' &&
        vars.SERVICEIT_BITRIX_EVENT_AI_ENABLED == 'YES_1062_21_CLOUD'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_EVENT_BRIDGE_KEY: ${{ secrets.SERVICEIT_BITRIX_EVENT_BRIDGE_KEY }}
      SERVICEIT_GH_LEDGER_KEY: ${{ secrets.SERVICEIT_GH_LEDGER_KEY }}
      SERVICEIT_BITRIX_POLL_START_UTC: ${{ vars.SERVICEIT_BITRIX_POLL_START_UTC }}
      SERVICEIT_BITRIX_POLL_ENABLED: ${{ vars.SERVICEIT_BITRIX_POLL_ENABLED }}
      SERVICEIT_BITRIX_EVENT_AI_ENABLED: ${{ vars.SERVICEIT_BITRIX_EVENT_AI_ENABLED }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Read-only probe - never dispatch
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.comment.body == 'SERVICEIT_NMODE_NEW_CARD_POLL_READONLY_V1')
        run: python -m leadpilot.serviceit_bitrix_poll_fallback --probe
      - name: Owner exact one-time LIVE scan of future-only 1062/21 card IDs
        if: github.event_name == 'issue_comment' && github.event.comment.body == 'SERVICEIT_OWNER_NEW_CARD_LIVE_ONCE_V1'
        run: python -m leadpilot.serviceit_bitrix_poll_fallback --owner-once
      - name: Scan recent new-card IDs and dispatch signed events
        if: github.event_name == 'schedule'
        run: python -m leadpilot.serviceit_bitrix_poll_fallback
