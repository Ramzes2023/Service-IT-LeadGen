name: ServiceIT B2B four VERIFIED cards public crossportal coverage READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-four-public-preview
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_FOUR_PUBLIC_CROSSPORTAL_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pure read-only source, pinned host and feature opt-ins
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_crossportal_four_preview.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          # Pin the two audited production module sources by their exact
          # reviewed commits, not by obsolete pre-release hard-coded SHAs.
          git cat-file -e '3df31e23b990ea043a48a1a159b25e1f494278e9^{commit}'
          git cat-file -e '3ea732bb8200c8e45053f3ce012f580d102a0c69^{commit}'
          git diff --quiet 3df31e23b990ea043a48a1a159b25e1f494278e9 HEAD -- leadpilot/serviceit_vps_b2b_deep_research.py
          git diff --quiet 3ea732bb8200c8e45053f3ce012f580d102a0c69 HEAD -- leadpilot/serviceit_b2b_public_mirrors.py
          install -d -m 0700 "$RUNNER_TEMP/four-preview"
          {
            sha256sum leadpilot/serviceit_vps_b2b_deep_research.py | cut -d' ' -f1
            sha256sum leadpilot/serviceit_b2b_public_mirrors.py | cut -d' ' -f1
          } > "$RUNNER_TEMP/four-preview/reviewed-shas"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/four-preview/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/four-preview/hosts"
          chmod 0600 "$RUNNER_TEMP/four-preview/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/four-preview/hosts" >/dev/null
      - name: Inspect exact FOUR signed B2B cards with independent public pages, NO CRM writes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reviewed < "$RUNNER_TEMP/four-preview/reviewed-shas"
          [[ "${#reviewed[@]}" == 2 ]]
          [[ "${reviewed[0]}" =~ ^[0-9a-f]{64}$ && "${reviewed[1]}" =~ ^[0-9a-f]{64}$ ]]
          set +e
          ssh -T -i "$RUNNER_TEMP/four-preview/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/four-preview/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - '${reviewed[0]}' '${reviewed[1]}'" \
            < ops/serviceit_vps_b2b_crossportal_four_preview.py \
            > "$RUNNER_TEMP/four-preview/status" 2>/dev/null
          remote_rc=$?
          set -e
          grep -E '^CROSSPORTAL_FOUR_([A-Z0-9_]{3,64})=(YES|NO|ERROR|[0-9]{1,4})$' \
            "$RUNNER_TEMP/four-preview/status" | head -100 || true
          [[ "$remote_rc" == 0 ]]
          grep -qx 'CROSSPORTAL_FOUR_READONLY_FINISHED=YES' "$RUNNER_TEMP/four-preview/status"
          grep -qx 'CROSSPORTAL_FOUR_SIGNED_MATCHING_CARDS=4' "$RUNNER_TEMP/four-preview/status"
  v16_audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V16_FOUR_REAL_PREVIEW_READONLY_368'
