name: ServiceIT B2B public source read-only trace
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/serviceit-vps-b2b-public-source-readonly.yml
      - ops/serviceit_vps_b2b_public_source_readonly.py
permissions:
  contents: read
concurrency:
  group: serviceit-dossier-readback-four-real-readonly-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Fetch exact reviewed public repository revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet .
          git remote add origin https://github.com/Ramzes2023/Service-IT-LeadGen.git
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Validate read-only probe and SSH host
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_public_source_readonly.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/dossier-readback-four"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/dossier-readback-four/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/dossier-readback-four/hosts"
          chmod 0600 "$RUNNER_TEMP/dossier-readback-four/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/dossier-readback-four/hosts" >/dev/null
      - name: Trace public search stages in the running coordinator
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/dossier-readback-four/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          rc=0
          ssh -T -i "$RUNNER_TEMP/dossier-readback-four/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_public_source_readonly.py \
            > "$RUNNER_TEMP/dossier-readback-four/status" 2>/dev/null || rc=$?
          grep -E '^SOURCE_AUDIT_[A-Z0-9_]{3,65}=[A-Z0-9_]{1,80}$' \
            "$RUNNER_TEMP/dossier-readback-four/status" || true
          [[ "$rc" == 0 ]]
          grep -qx 'SOURCE_AUDIT_CRM_WRITES=0' "$RUNNER_TEMP/dossier-readback-four/status"
