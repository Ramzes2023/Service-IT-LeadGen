name: ServiceIT VPS activate finance INTERNAL TASKS only (NO payouts)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      approval:
        description: "Type ENABLE_VPS_FINANCE_ONLY_1062_21"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: serviceit-vps-business-finance-enable-only
  cancel-in-progress: false

jobs:
  activate:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      (
        (github.event_name == 'workflow_dispatch' &&
          inputs.approval == 'ENABLE_VPS_FINANCE_ONLY_1062_21')
        ||
        (github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.issue.number == 283 &&
          !github.event.issue.pull_request &&
          github.event.comment.user.login == 'Ramzes2023' &&
          github.event.comment.body == 'SVCIT_ENABLE_FINANCE_ONLY_ONCE_283_20261109')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Validate non-root pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/serviceit-finance-activate"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-finance-activate/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-finance-activate/known_hosts"
          chmod 600 "$RUNNER_TEMP/serviceit-finance-activate/id" "$RUNNER_TEMP/serviceit-finance-activate/known_hosts"
          ssh-keygen -F "$VPS_HOST" \
            -f "$RUNNER_TEMP/serviceit-finance-activate/known_hosts" >/dev/null

      - name: Activate finance task writer if every production safety gate passes
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/serviceit-finance-activate/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-finance-activate/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' \
            > "$RUNNER_TEMP/serviceit-finance-activate/status.txt" <<'PY'
          from pathlib import Path
          import fcntl
          import json
          import os
          import re
          import stat
          import subprocess
          import tempfile
          import time

          PROJECT="serviceit-leadgen-vps"
          NAMES={name:PROJECT+"-"+name+"-1" for name in
                 ("coordinator","auxiliaries","business","observer","fns-msp")}
          CORE=NAMES["coordinator"]
          BUSINESS=NAMES["business"]
          ENV=Path.home()/"serviceit/config/vps.env"
          PIN=ENV.parent/"postcall-business-pinned.compose.yml"
          RELEASES=(Path.home()/"serviceit/releases").resolve()
          POST="SERVICEIT_VPS_POSTCALL_ENABLED"
          FIN="SERVICEIT_VPS_FINANCE_ENABLED"
          LOCK=ENV.parent/".serviceit-business-finance-enable.lock"

          class Blocked(Exception): pass
          def need(ok,reason):
              if not ok: raise Blocked(reason)
          def process(argv,timeout=45):
              try:
                  return subprocess.run(argv,stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,text=True,timeout=timeout)
              except (OSError,subprocess.TimeoutExpired):
                  raise Blocked("SUBPROCESS_TIMEOUT")
          def out(argv,timeout=45):
              p=process(argv,timeout)
              need(p.returncode==0,"COMMAND_FAILED")
              return p.stdout.strip()
          def docker_inspect(name,fmt):
              return out(["docker","inspect","-f",fmt,name])
          def flag(container,key):
              return out(["docker","exec",container,"printenv",key])
          def health(container):
              try:
                  return docker_inspect(container,
                      "{{.State.Running}}:{{.State.Health.Status}}")=="true:healthy"
              except Blocked: return False
          def private(path):
              need(path.is_file() and not path.is_symlink(),
                   "PRIVATE_FILE_MISSING_OR_SYMLINK")
              mode=path.stat()
              need(mode.st_uid==os.geteuid() and
                   not(stat.S_IMODE(mode.st_mode)&0o077),
                   "PRIVATE_FILE_PERMISSIONS_OR_OWNER_INVALID")
          def read_cfg(raw):
              vars={}
              for line in raw.splitlines():
                  if not line or line.lstrip().startswith("#"):continue
                  m=re.fullmatch(r"([A-Z][A-Z0-9_]*)=(.*)",line)
                  need(m is not None and m.group(1) not in vars,
                       "CONFIG_LINE_INVALID_OR_DUPLICATED")
                  vars[m.group(1)]=m.group(2)
              return vars
          def write_atomic(body):
              fd,temp=tempfile.mkstemp(prefix=".finance-live-",dir=ENV.parent)
              try:
                  with os.fdopen(fd,"w",encoding="utf-8") as w:
                      os.fchmod(w.fileno(),0o600)
                      w.write(body);w.flush();os.fsync(w.fileno())
                  os.replace(temp,ENV)
              finally:
                  try: os.unlink(temp)
                  except FileNotFoundError: pass
          def docker_image(container):
              digest=docker_inspect(container,"{{.Image}}")
              need(re.fullmatch(r"sha256:[a-f0-9]{64}",digest) is not None,
                   "DOCKER_IMAGE_DIGEST_INVALID")
              return digest
          def compose_args(path,*args):
              return ["docker","compose","--env-file",str(ENV),
                      "-f",str(path),"-f",str(PIN),*args]
          def compose_business(path):
              model=json.loads(out(compose_args(path,"config","--format","json"),50))
              business=model.get("services",{}).get("business")
              need(isinstance(business,dict),"BUSINESS_COMPOSE_MISSING")
              return business
          def preflight_code():
              code="""
          import os
          from leadpilot.serviceit_vps_native_business import enabled
          from leadpilot.serviceit_finance_hybrid_live_worker import (
              run,ENABLED,CATEGORY_NAME,REST_ALLOW)
          from leadpilot.serviceit_vps_native_actions import PostgresActionFence
          test=dict(os.environ)
          test['SERVICEIT_VPS_POSTCALL_ENABLED']='YES'
          test['SERVICEIT_VPS_FINANCE_ENABLED']='YES'
          assert enabled(test)=={'postcall':True,'finance':True}
          assert ENABLED=='YES_LEADGEN_SALES_INTERNAL_FINANCE'
          assert CATEGORY_NAME=='Лидогенерация'
          assert {'crm.deal.add','crm.deal.update','crm.item.update',
                  'crm.contact.add','crm.company.add','tasks.task.delete'}.isdisjoint(REST_ALLOW)
          assert callable(PostgresActionFence) and callable(run)
          print('FINANCE_CODE_READY')
          """
              need(out(["docker","exec",BUSINESS,"python","-c",code],45)
                   =="FINANCE_CODE_READY","NATIVE_FINANCE_CODE_INVALID")
          def pg_preflight():
              code="""
          import os
          from leadpilot.serviceit_vps_pg_queue import db
          try:
              with db(dict(os.environ)) as con:
                  with con.transaction():
                      with con.cursor() as c:
                          c.execute('SET TRANSACTION READ ONLY')
                          c.execute("SELECT to_regclass('public.serviceit_vps_native_actions') IS NOT NULL")
                          assert c.fetchone()[0]
                          c.execute("SELECT count(*) FROM serviceit_vps_native_actions "
                                    "WHERE operation IN ('FINANCE_REQUEST_ADD','FINANCE_REPORT_ADD',"
                                    "'FINANCE_REPORT_UPDATE','FINANCE_REQUEST_UPDATE')")
                          assert int(c.fetchone()[0])>=0
              print('FINANCE_PG_READY')
          except Exception:
              print('FINANCE_PG_BLOCKED')
          """
              need(out(["docker","exec",BUSINESS,"python","-c",code],60)
                   =="FINANCE_PG_READY","FINANCE_PG_SCHEMA_NOT_READY")
          def crm_preflight():
              code="""
          import os
          import httpx
          from leadpilot.serviceit_vps_pg_queue import secret_file
          from leadpilot.bitrix_metadata_audit import validate_webhook
          from leadpilot.serviceit_finance_hybrid_live_worker import (
              exact_category,deal_schema,task_schema,list_won,current_employee,
              PORTAL,CATEGORY_NAME)
          try:
              base=validate_webhook(secret_file(dict(os.environ),
                  'SERVICEIT_BITRIX_WEBHOOK'))
              assert base.startswith(PORTAL)
              with httpx.Client(trust_env=False,follow_redirects=False,
                                timeout=25) as client:
                  r=client.post(base+'/scope.json',json={},
                                follow_redirects=False,timeout=25)
                  assert r.status_code==200
                  scope=r.json().get('result')
                  assert isinstance(scope,list) and 'crm' in scope and 'task' in scope
                  cat=exact_category(client,base)
                  if cat is None:
                      print('FINANCE_CRM_CATEGORY_NOT_VISIBLE')
                  else:
                      deal_schema(client,base)
                      task_schema(client,base)
                      employee=current_employee(client,base)
                      assert type(employee)==int and employee>0
                      from leadpilot.serviceit_bitrix_poll_fallback import date_value
                      activation=date_value(os.environ['SERVICEIT_VPS_NATIVE_ACTIVATION_UTC'])
                      deals=list_won(client,base,cat,native_after=activation)
                      print('FINANCE_CRM_PREFLIGHT_READY')
                      print('FINANCE_NEW_WON_DEALS='+str(min(len(deals),100)))
          except Exception:
              print('FINANCE_CRM_PREFLIGHT_BLOCKED')
          """
              response=out(["docker","exec",BUSINESS,"python","-c",code],160)
              lines=response.splitlines()
              need("FINANCE_CRM_PREFLIGHT_READY" in lines,
                   "FINANCE_CRM_FUNNEL_FIELDS_OR_SCOPE_NOT_READY")
              for line in lines:
                  if line.startswith("FINANCE_NEW_WON_DEALS="):
                      v=line.split("=",1)[1]
                      need(v.isdecimal() and 0<=int(v)<=100,
                           "FINANCE_NEW_WON_COUNT_UNVERIFIED")
                      print(line,flush=True)
          changed=False
          original=None
          compose=None
          image_before=None
          try:
              print("FINANCE_CUTOVER=START",flush=True)
              need(os.geteuid()!=0,"ROOT_DISALLOWED")
              with LOCK.open("a") as lf:
                  os.chmod(LOCK,0o600)
                  fcntl.flock(lf.fileno(),fcntl.LOCK_EX|fcntl.LOCK_NB)
                  for container in NAMES.values():
                      need(health(container),"EXISTING_CONTAINER_UNHEALTHY")
                  for key,want in (
                      ("SERVICEIT_VPS_WRITER_MODE","LIVE"),
                      ("SERVICEIT_VPS_CUTOVER_AUTHORIZED","YES"),
                      ("SERVICEIT_VPS_OLD_GH_WRITERS_DISABLED_ACK","YES"),
                      ("SERVICEIT_VPS_POLL_ENABLED","YES"),
                  ):
                      need(flag(CORE,key)==want,"GLOBAL_NATIVE_GATE_INVALID")
                  need(bool(flag(CORE,"SERVICEIT_VPS_NATIVE_ACTIVATION_UTC")),
                       "NATIVE_ACTIVATION_MISSING")
                  need(flag(BUSINESS,POST)=="YES" and
                       flag(BUSINESS,FIN)=="NO",
                       "POSTCALL_OR_FINANCE_FLAG_DRIFT")
                  private(ENV);private(PIN)
                  original=ENV.read_text("utf-8")
                  cfg=read_cfg(original)
                  need(cfg.get(POST)=="YES" and cfg.get(FIN,"NO")=="NO",
                       "ENV_POSTCALL_OR_FINANCE_DRIFT")
                  label=docker_inspect(BUSINESS,
                    '{{index .Config.Labels "com.docker.compose.project.config_files"}}')
                  paths=[Path(x.strip()) for x in label.split(",") if x.strip()]
                  need(len(paths)==2 and PIN in paths,
                       "BUSINESS_COMPOSE_PIN_LABEL_MISSING")
                  candidates=[p for p in paths
                              if p != PIN and p.name=="serviceit-vps.compose.yml"]
                  need(len(candidates)==1,"BUSINESS_COMPOSE_RELEASE_MISSING")
                  compose=candidates[0]
                  need(compose.is_file() and not compose.is_symlink()
                       and compose.resolve().is_relative_to(RELEASES)
                       and re.fullmatch(
                         r".*/releases/[0-9a-f]{40}/deploy/serviceit-vps\.compose\.yml",
                         str(compose.resolve())) is not None,
                       "BUSINESS_RELEASE_NOT_PINNED")
                  need(docker_inspect(BUSINESS,
                       '{{index .Config.Labels "com.docker.compose.project"}}')
                       ==PROJECT,"BUSINESS_PROJECT_INVALID")
                  image_before=docker_image(BUSINESS)
                  expected_pin='services:\n  business:\n    image: "'+image_before+'"\n    pull_policy: never\n'
                  need(PIN.read_text('utf-8')==expected_pin,
                       "BUSINESS_IMAGE_PIN_DIFFERENT")
                  need(out(["docker","image","inspect","-f","{{.Id}}",image_before])
                       ==image_before,"BUSINESS_IMAGE_NOT_LOCAL")
                  preflight_code()
                  pg_preflight()
                  crm_preflight()
                  before=compose_business(compose)
                  need(before.get("image")==image_before,
                       "BUSINESS_CURRENT_IMAGE_NOT_PINNED")
                  e=before.get("environment")
                  need(isinstance(e,dict),"BUSINESS_ENV_RENDER_FAILED")
                  need(e.get(POST)=="YES" and e.get(FIN)=="NO",
                       "BUSINESS_CURRENT_FLAGS_RENDER_FAILED")
                  running=json.loads(docker_inspect(BUSINESS,"{{json .Config.Env}}"))
                  need(isinstance(running,list) and
                       all(isinstance(s,str) and "=" in s for s in running),
                       "LIVE_BUSINESS_ENV_INVALID")
                  actual=dict(x.split("=",1) for x in running)
                  need(all(str(v)==actual.get(k) for k,v in e.items()),
                       "BUSINESS_COMPOSE_LIVE_ENV_MISMATCH")
                  print("FINANCE_PREFLIGHT=PASS",flush=True)
                  name=FIN
                  match=list(re.finditer(r"(?m)^"+name+r"=(?:YES|NO)$",original))
                  need(len(match)<=1,"FINANCE_ENV_DUPLICATE")
                  if match:
                      updated=re.sub(r"(?m)^"+name+r"=(?:YES|NO)$",
                                     name+"=YES",original)
                  else:
                      updated=original.rstrip('\n')+'\n'+name+'=YES\n'
                  need(read_cfg(updated)=={**cfg,name:"YES"},
                       "FINANCE_ENV_CHANGED_OTHER_KEYS")
                  write_atomic(updated);changed=True
                  revised=compose_business(compose)
                  ne=revised.get("environment")
                  need(revised.get("image")==image_before and isinstance(ne,dict)
                       and ne.get(POST)=="YES" and ne.get(FIN)=="YES"
                       and all(str(v)==str(ne.get(k)) for k,v in e.items()
                               if k!=FIN),
                       "FINANCE_REVISED_COMPOSE_DRIFT")
                  op=process(compose_args(compose,"up","-d","--no-deps",
                             "--no-build","--pull","never","--force-recreate",
                             "business"),150)
                  need(op.returncode==0,"BUSINESS_SINGLE_RECREATE_FAILED")
                  for _ in range(25):
                      if health(BUSINESS):break
                      time.sleep(5)
                  need(health(BUSINESS),"BUSINESS_NOT_HEALTHY_AFTER_SWITCH")
                  need(docker_image(BUSINESS)==image_before,
                       "BUSINESS_IMAGE_CHANGED")
                  need(flag(BUSINESS,POST)=="YES" and
                       flag(BUSINESS,FIN)=="YES",
                       "BUSINESS_NEW_FLAGS_NOT_ENABLED")
                  for container in NAMES.values():
                      need(health(container),"POST_SWITCH_CONTAINER_UNHEALTHY")
                  print("FINANCE_CUTOVER=SUCCESS",flush=True)
                  print("FINANCE_WRITER_ENABLED=YES;POSTCALL_WRITER_ENABLED=YES",flush=True)
                  print("BUSINESS_CONTAINER_HEALTHY=YES;BUSINESS_IMAGE_UNCHANGED=YES",flush=True)
                  print("NATIVE_PG_RECEIPT_SCHEMA=READY",flush=True)
                  print("FINANCE_SCOPE=NEW_WON_RUB_DEALS_LEADGEN_ONLY",flush=True)
                  print("FINANCE_ACTIONS=INTERNAL_REQUESTS_AND_DRAFT_TASKS_ONLY",flush=True)
                  print("PAYOUTS=0;CUSTOMER_OUTREACH=0;CRM_ITEM_WRITES_BY_ACTIVATION=0",flush=True)
                  print("SOURCES_CHANGED=NO;HISTORICAL_DEALS_MODIFIED_BY_ACTIVATION=0",flush=True)
                  print("FINANCE_E2E=NOT_PROVEN_UNTIL_REAL_ELIGIBLE_DEAL",flush=True)
          except Exception as error:
              msg=str(error) if isinstance(error,Blocked) else "UNEXPECTED_FAILURE"
              if re.fullmatch(r"[A-Z0-9_]+",msg) is None:msg="UNEXPECTED_FAILURE"
              print("FINANCE_CUTOVER=BLOCKED_"+msg,flush=True)
              if changed and original is not None:
                  try:
                      write_atomic(original)
                      if compose is not None:
                          result=process(compose_args(compose,"up","-d","--no-deps",
                              "--no-build","--pull","never","--force-recreate",
                              "business"),150)
                          need(result.returncode==0,"FINANCE_RESTORE_RECREATE_FAILED")
                      print("FINANCE_ROLLBACK=ORIGINAL_CONFIG_RESTORED_RESTART_ATTEMPTED",flush=True)
                  except Exception:
                      print("FINANCE_ROLLBACK=MANUAL_REVIEW_REQUIRED",flush=True)
              raise SystemExit(2)
          PY
          # Public logs must contain only strictly allowlisted summary keys.
          grep -E '^(FINANCE_CUTOVER|FINANCE_NEW_WON_DEALS|FINANCE_PREFLIGHT|FINANCE_WRITER_ENABLED|BUSINESS_CONTAINER_HEALTHY|NATIVE_PG_RECEIPT_SCHEMA|FINANCE_SCOPE|FINANCE_ACTIONS|PAYOUTS|SOURCES_CHANGED|FINANCE_E2E|FINANCE_ROLLBACK)=' \
            "$RUNNER_TEMP/serviceit-finance-activate/status.txt" || true
          test "$(grep -c '^FINANCE_CUTOVER=SUCCESS$' \
            "$RUNNER_TEMP/serviceit-finance-activate/status.txt")" = "1"

      - name: Record sanitized activation status in issue 283
        if: always()
        shell: bash
        env:
          REPO: "${{ github.repository }}"
          RUN_ID: "${{ github.run_id }}"
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/serviceit-finance-activate/status.txt"
          if [[ -f "$report" ]]; then
            lines="$(grep -E '^(FINANCE_CUTOVER|FINANCE_PREFLIGHT|FINANCE_WRITER_ENABLED|BUSINESS_CONTAINER_HEALTHY|NATIVE_PG_RECEIPT_SCHEMA|FINANCE_E2E|FINANCE_ROLLBACK)=' "$report" || true)"
          else
            lines="FINANCE_CUTOVER=NOT_VERIFIED"
          fi
          [[ -n "$lines" ]] || lines="FINANCE_CUTOVER=NOT_VERIFIED"
          body="$(printf 'Активация финансовой автоматизации на VPS:\n\n%s\n\nWorkflow: https://github.com/%s/actions/runs/%s\n\nФинансы: только внутренние задачи, без платежей и исходящих контактов. Проверка реальной сделки отдельно.' "$lines" "$REPO" "$RUN_ID")"
          gh api "repos/$REPO/issues/283/comments" -X POST --raw-field "body=$body" \
            >/dev/null
