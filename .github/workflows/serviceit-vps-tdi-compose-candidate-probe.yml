name: ServiceIT TDI Docker Compose candidate config failure READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-tdi-compose-probe
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_TDI_COMPOSE_DRIFT_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Pinned SSH and protected compose config only, no up or writes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/tdi-compose"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/tdi-compose/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/tdi-compose/hosts"
          chmod 0600 "$RUNNER_TEMP/tdi-compose/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/tdi-compose/hosts" >/dev/null
          ssh -T -i "$RUNNER_TEMP/tdi-compose/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tdi-compose/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' \
            > "$RUNNER_TEMP/tdi-compose/result" <<'PY'
          import os,json,subprocess,re
          from pathlib import Path
          home=Path.home()
          root=home/'serviceit'
          env=root/'config/vps.env'
          pin=root/'config/native-five-minute-core-image.compose.yml'
          stage=root/'staging/b2b-tdi-release-42913785157/preflight.compose.yml'
          print('TDI_COMPOSE_CANDIDATE_EXISTS='+('YES' if stage.is_file() else 'NO'),flush=True)
          if not stage.is_file() or stage.is_symlink():
              raise SystemExit(0)
          txt=stage.read_text('utf8')
          print('TDI_COMPOSE_FLAG_PRESENT='+('YES' if 'SERVICEIT_VPS_TENDER_DOC_INTEL_ENABLED' in txt else 'NO'))
          print('TDI_COMPOSE_FLAG_NESTING='+('YES' if re.search(r'(?m)^    environment:\n      SERVICEIT_VPS_TENDER_DOC_INTEL_ENABLED: "YES"$',
              txt) else 'NO'))
          image=subprocess.run(['docker','inspect','-f','{{index .Config.Labels "com.docker.compose.project.config_files"}}',
              'serviceit-leadgen-vps-coordinator-1'],capture_output=True,text=True,timeout=20)
          if image.returncode: raise SystemExit(2)
          paths=[Path(x.strip()) for x in image.stdout.strip().split(',') if x.strip()]
          print('TDI_COMPOSE_PIN_IN_PATHS='+('YES' if pin in paths else 'NO'))
          if pin not in paths or not env.is_file(): raise SystemExit(0)
          def run(files):
              cmd=['docker','compose','--env-file',str(env)]
              for path in files: cmd+=['-f',str(path)]
              cmd+=['config','--format','json']
              return subprocess.run(cmd,capture_output=True,text=True,timeout=40)
          def reason(stderr):
              s=stderr.lower()
              if 'permission denied' in s:return 'PERMISSION'
              if 'no such file' in s or 'not found' in s:return 'MISSING_FILE'
              if 'mapping key' in s or 'yaml' in s or 'parsing' in s:return 'YAML_PARSE'
              if 'invalid interpolation' in s:return 'INTERPOLATION'
              if 'invalid type' in s:return 'INVALID_TYPE'
              if 'additional property' in s or 'additional properties' in s:return 'UNSUPPORTED_KEY'
              if 'service' in s and 'invalid' in s:return 'INVALID_SERVICE'
              if 'already exists' in s:return 'DUPLICATE'
              return 'OTHER'
          current=run(paths)
          candidate=run([x for x in paths if x!=pin]+[stage])
          print('TDI_COMPOSE_BASE_OK='+('YES' if current.returncode==0 else 'NO'))
          print('TDI_COMPOSE_CANDIDATE_OK='+('YES' if candidate.returncode==0 else 'NO'))
          print('TDI_COMPOSE_CANDIDATE_REASON='+('OK' if candidate.returncode==0 else reason(candidate.stderr)))
          # A brand-new minimal YAML tests whether the original pin contains
          # trailing or duplicate structure; never touch the live Compose pin.
          import tempfile
          _match=re.search(r'(?m)^    image: "(sha256:[0-9a-f]{64})"$',txt)
          if _match:
              minimal=('services:\n  coordinator:\n    image: "'+_match.group(1)
                       +'"\n    pull_policy: never\n    environment:\n'
                       +'      SERVICEIT_VPS_TENDER_DOC_INTEL_ENABLED: "YES"\n')
              with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',
                   suffix='.yml',prefix='tdi-candidate-',dir=str(stage.parent),
                   delete=False) as temp:
                  temp.write(minimal)
                  alt=Path(temp.name)
              try:
                  check=run([x for x in paths if x!=pin]+[alt])
                  print('TDI_COMPOSE_MINIMAL_OK='+('YES' if check.returncode==0 else 'NO'))
                  print('TDI_COMPOSE_MINIMAL_REASON='+('OK' if check.returncode==0 else reason(check.stderr)))
              finally:
                  alt.unlink(missing_ok=True)
          else:
              print('TDI_COMPOSE_MINIMAL_OK=NO')
              print('TDI_COMPOSE_MINIMAL_REASON=IMAGE_NOT_FOUND')
          if current.returncode==0 and candidate.returncode==0:
              old=json.loads(current.stdout)['services']['coordinator']
              new=json.loads(candidate.stdout)['services']['coordinator']
              expected=dict(old.get('environment',{}))
              expected['SERVICEIT_VPS_TENDER_DOC_INTEL_ENABLED']='YES'
              print('TDI_COMPOSE_ENV_ONLY_ADD='+('YES' if new.get('environment')==expected else 'NO'))
              print('TDI_COMPOSE_NEW_IMAGE='+('YES' if new.get('image')!=old.get('image') else 'NO'))
              exclude={'image','environment'}
              rest_old={k:v for k,v in old.items() if k not in exclude}
              rest_new={k:v for k,v in new.items() if k not in exclude}
              print('TDI_COMPOSE_NON_IMAGE_ENV_SAME='+('YES' if rest_old==rest_new else 'NO'))
              fields=sorted(k for k in set(rest_old)|set(rest_new)
                  if rest_old.get(k)!=rest_new.get(k))
              # Never dump env values, volumes, mount paths or tokens.
              safe=('pull_policy','restart','healthcheck','depends_on',
                    'network_mode','privileged','read_only','user','logging',
                    'init','stop_signal','stop_grace_period','profiles',
                    'deploy','networks','volumes','working_dir','entrypoint',
                    'command','labels')
              print('TDI_COMPOSE_DRIFT_FIELD_COUNT='+str(min(20,len(fields))))
              for key in safe:
                  if key in fields:
                      print('TDI_COMPOSE_DRIFT_'+key.upper()+'=YES')
              if any(key not in safe for key in fields):
                  print('TDI_COMPOSE_DRIFT_OTHER=YES')
              print('TDI_COMPOSE_ADJACENT_SAME='+('YES' if
                  all(json.loads(current.stdout)['services'][n]==value
                      for n,value in json.loads(current.stdout)['services'].items()
                      if n!='coordinator' and
                      n in json.loads(candidate.stdout)['services'] and
                      json.loads(candidate.stdout)['services'][n]==value)
                  else 'NO'))

          PY
          grep -E '^TDI_COMPOSE_[A-Z_]+=(YES|NO|OK|PERMISSION|MISSING_FILE|YAML_PARSE|INTERPOLATION|INVALID_TYPE|UNSUPPORTED_KEY|INVALID_SERVICE|DUPLICATE|OTHER|IMAGE_NOT_FOUND)$' "$RUNNER_TEMP/tdi-compose/result"
          grep -E '^TDI_COMPOSE_DRIFT_FIELD_COUNT=[0-9]{1,2}$' "$RUNNER_TEMP/tdi-compose/result"
          grep -E '^TDI_COMPOSE_DRIFT_[A-Z_]+=(YES|NO)$' "$RUNNER_TEMP/tdi-compose/result"
