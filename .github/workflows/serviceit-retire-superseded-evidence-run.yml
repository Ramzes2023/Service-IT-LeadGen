name: ServiceIT retire superseded evidence release v20
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-retire-superseded-evidence-run.yml]
permissions:
  actions: write
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the exact superseded release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          assert os.environ['GH_REPOSITORY']=='Ramzes2023/Service-IT-LeadGen'
          base='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/actions/runs/43710008510'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url,method='GET'):
              return urllib.request.urlopen(urllib.request.Request(url,headers=headers,method=method),timeout=20)
          with request(base) as response:run=json.load(response)
          assert run['id']==43710008510
          assert run['head_sha']=='80f9a602d128fefcd382068b23ff8ffef000802b'
          assert run['path']=='.github/workflows/serviceit-extended-evidence-release.yml'
          assert run['head_branch']=='main'
          if run['status']=='completed':print('SUPERSEDED_RELEASE_ALREADY_FINISHED')
          else:
              try:
                  with request(base+'/cancel','POST') as response:
                      assert response.status==202
                  print('SUPERSEDED_RELEASE_CANCEL_REQUESTED')
              except urllib.error.HTTPError as exc:
                  if exc.code!=409:raise
                  print('SUPERSEDED_RELEASE_FINISHED_DURING_CHECK')
          PY
