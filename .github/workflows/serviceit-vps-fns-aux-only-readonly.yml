name: ServiceIT FNS-only stopped auxiliary root cause READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-fns-only-aux-readonly
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_FNS_AUX_FORENSICS_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Inspect Docker auxiliary and FNS-only safe status codes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/fns-aux"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/fns-aux/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/fns-aux/known"
          chmod 600 "$RUNNER_TEMP/fns-aux/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/fns-aux/known" >/dev/null
          ssh -T -i "$RUNNER_TEMP/fns-aux/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/fns-aux/known" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' <<'PY'
          import json,subprocess
          AUX='serviceit-leadgen-vps-auxiliaries-1'
          def run(argv,timeout=18):
              try:
                  return subprocess.run(argv,stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,
                      text=True,timeout=timeout)
              except (OSError,subprocess.TimeoutExpired):
                  return None
          def stat(k,v):
              print('FNS_AUX_'+k+'='+str(v),flush=True)
          p=run(['docker','inspect','-f','{{json .State}}',AUX])
          if p is None or p.returncode!=0:
              stat('EXISTS','NO')
          else:
              stat('EXISTS','YES')
              try:
                  data=json.loads(p.stdout)
                  state=data.get('Status','unverified')
                  if state not in ('running','exited','created','dead','paused','restarting'):
                      state='unverified'
                  stat('STATE',state.upper())
                  stat('EXIT_CODE',str(data.get('ExitCode',0)) if isinstance(data.get('ExitCode'),int)
                       and 0 <= data['ExitCode']<=255 else 'UNVERIFIED')
                  stat('OOM','YES' if data.get('OOMKilled') is True else 'NO')
                  stat('ERROR_PRESENT','YES' if bool(data.get('Error')) else 'NO')
                  health=data.get('Health',{})
                  status=health.get('Status','none') if isinstance(health,dict) else 'none'
                  stat('HEALTH',status.upper() if status in ('none','healthy','starting','unhealthy')
                       else 'UNVERIFIED')
              except (TypeError,ValueError,AttributeError):
                  stat('STATE','UNVERIFIED')
              meta=run(['docker','inspect','-f',
                   '{{.Image}}|{{.HostConfig.RestartPolicy.Name}}|{{.RestartCount}}',AUX])
              if meta is not None and meta.returncode==0:
                  try:
                      img,policy,count=meta.stdout.strip().split('|')
                      stat('IMAGE_EXISTS','YES' if img.startswith('sha256:') and
                           len(img)==71 else 'NO')
                      stat('RESTART_POLICY',policy.upper()
                           if policy in ('no','always','unless-stopped','on-failure') else 'UNVERIFIED')
                      stat('RESTART_COUNT',str(min(int(count),9999))
                           if count.isdecimal() else 'UNVERIFIED')
                  except ValueError:
                      stat('IMAGE_EXISTS','UNVERIFIED')
              logs=run(['docker','logs','--tail','60',AUX],timeout=12)
              hits=set()
              if logs and logs.returncode==0:
                  for line in logs.stdout.splitlines():
                      try:
                          j=json.loads(line)
                      except (ValueError,TypeError): continue
                      if isinstance(j,dict):
                          status=j.get('status')
                          if isinstance(status,str) and status.isascii() and
                             all(c.isupper() or c.isdigit() or c=='_' for c in status):
                              hits.add(status[:80])
              stat('STRUCTURED_STATUS_COUNT',str(min(len(hits),99)))
              for v in sorted(hits)[:12]:
                  stat('LOG_STATUS',v)
          core=run(['docker','inspect','-f','{{.State.Running}}',
                    'serviceit-leadgen-vps-coordinator-1'])
          fns=run(['docker','inspect','-f','{{.State.Running}}',
                   'serviceit-leadgen-vps-fns-msp-1'])
          stat('CORE_RUNNING','YES' if core and core.returncode==0 and
               core.stdout.strip()=='true' else 'NO')
          stat('FNS_RUNNING','YES' if fns and fns.returncode==0 and
               fns.stdout.strip()=='true' else 'NO')
          stat('ALL_READONLY','YES')
          PY
