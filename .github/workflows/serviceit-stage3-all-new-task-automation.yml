name: ServiceIT stage3 auto internal review task for ALL future 1062/21 cards

on:
  repository_dispatch:
    types: [serviceit_bitrix_item_add_v1]
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

# Same concurrency key as the existing AI writer: no competing commits to
# encrypted ledger branch while another new-card job is checkpointing.

jobs:
  stage3-internal-manager-task:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'repository_dispatch' &&
        github.event.action == 'serviceit_bitrix_item_add_v1') ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'Ramzes2023' &&
        github.event.issue.number == 148 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'SERVICEIT_STAGE34_ALL_NEW_OWNER_ONCE_V1'))
    concurrency:
      group: serviceit-bitrix-new-card-free-event
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_EVENT_BRIDGE_KEY: ${{ secrets.SERVICEIT_BITRIX_EVENT_BRIDGE_KEY }}
      SERVICEIT_GH_LEDGER_KEY: ${{ secrets.SERVICEIT_GH_LEDGER_KEY }}
      SERVICEIT_BITRIX_POLL_START_UTC: ${{ vars.SERVICEIT_BITRIX_POLL_START_UTC }}
      SERVICEIT_STAGE3_TASK_WRITE_ENABLED: YES_1062_21_INTERNAL_REVIEW
      # Optional; OFF until owner approves a specific active corporate employee.
      SERVICEIT_STAGE3_FALLBACK_APPROVED: ${{ vars.SERVICEIT_STAGE3_FALLBACK_APPROVED }}
      SERVICEIT_STAGE3_FALLBACK_MANAGER_ID: ${{ secrets.SERVICEIT_STAGE3_FALLBACK_MANAGER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed ServiceIT dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate corporate permissions and make one-use internal review task when allowed
        run: python -m leadpilot.serviceit_stage3_all_new_task_automation
