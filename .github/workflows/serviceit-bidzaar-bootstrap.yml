name: ServiceIT Bidzaar secure deployment bootstrap
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-bidzaar-bootstrap.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-bidzaar-release
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Prepare private recipient and inspect scheduler
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          ssh -T -i "$stage/id" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          dir="$HOME/serviceit/bidzaar"
          [[ ! -L "$dir" ]]
          install -d -m 0700 "$dir"
          command -v crontab >/dev/null
          command -v flock >/dev/null
          if [[ ! -e "$dir/recipient.pem" ]]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$dir/recipient.pem" 2>/dev/null
          fi
          [[ -f "$dir/recipient.pem" && ! -L "$dir/recipient.pem" ]]
          printf 'BIDZAAR_RECIPIENT_PUBLIC='
          openssl pkey -in "$dir/recipient.pem" -pubout 2>/dev/null | base64 -w0
          printf '\nBIDZAAR_SCHEDULER_AVAILABLE=YES\n'
          docker exec serviceit-leadgen-vps-coordinator-1 python -c 'import psycopg; import leadpilot.serviceit_vps_worker; print("BIDZAAR_RUNTIME_AVAILABLE=YES")'
          REMOTE
