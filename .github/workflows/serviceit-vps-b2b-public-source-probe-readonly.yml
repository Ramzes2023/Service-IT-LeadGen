name: ServiceIT B2B exact two original-source research probe READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-real-public-source-probe
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_B2B_PUBLIC_SOURCE_PROBE_READONLY_314'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - name: Pinned non-root host trust
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/b2b-public"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/b2b-public/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/b2b-public/known_hosts"
          chmod 600 "$RUNNER_TEMP/b2b-public/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/b2b-public/known_hosts" >/dev/null
      - name: Fetch only public allowlisted source and safe title decision for exact two cards
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/b2b-public/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-public/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            > "$RUNNER_TEMP/b2b-public/status" <<'PY'
          import os,re
          import httpx
          from leadpilot.serviceit_vps_pg_queue import db,secret_file
          from leadpilot.serviceit_enrichment_worker import normalized,validate_identity,PREFIX
          from leadpilot.serviceit_preliminary_gigachat import allowed_public_title,PreliminaryAIBlocked
          from leadpilot.serviceit_public_evidence_research import research_public,ResearchBlocked
          from leadpilot.bitrix_metadata_audit import validate_webhook
          env=dict(os.environ)
          allowed=frozenset(x.strip().lower() for x in env.get('SERVICEIT_PRELIMINARY_PUBLIC_HOSTS','').split(',') if x.strip())
          company=frozenset(x.strip().lower() for x in env.get('SERVICEIT_PUBLIC_RESEARCH_COMPANY_HOSTS','').split(',') if x.strip())
          hosts=allowed|company
          print('B2B_PUBLIC_ALLOWLIST_READY='+('YES' if 'b2b-center.ru' in allowed else 'NO'),flush=True)
          with db(env) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT card_id,source_id FROM serviceit_vps_b2b_inbox
                      WHERE state='VERIFIED' AND card_id IS NOT NULL
                      ORDER BY received_at,source_id LIMIT 3
                  """)
                  rows=cur.fetchall()
          assert len(rows)==2
          base=validate_webhook(secret_file(env,'SERVICEIT_BITRIX_WEBHOOK'))
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=15) as client:
              for i,(card,source) in enumerate(rows,1):
                  assert isinstance(source,str) and re.fullmatch(r'B2B-CENTER-[0-9]{5,12}',source)
                  response=client.post(base+'/crm.item.get.json',json={
                      'entityTypeId':1062,'id':card,'useOriginalUfNames':'Y'
                  },follow_redirects=False,timeout=20)
                  assert response.status_code==200 and 0<len(response.content)<=512000
                  payload=response.json()
                  assert isinstance(payload,dict) and 'error' not in payload
                  item=normalized(payload['result']['item'])
                  validate_identity(item,card)
                  assert item.get(PREFIX+'SIGNAL_ID')==source
                  prior=str(item.get(PREFIX+'AI_STATUS') or '')
                  print('B2B_PUBLIC_CARD_'+str(i)+'_PRIOR_NOT_RUN='+('YES' if prior=='NOT_RUN_SOURCE_UNVERIFIED' else 'NO'),flush=True)
                  try:
                      title=allowed_public_title(item,allowed)
                      print('B2B_PUBLIC_CARD_'+str(i)+'_AI_TITLE_ALLOWED=YES',flush=True)
                  except PreliminaryAIBlocked as exc:
                      reason=str(exc)
                      if re.fullmatch(r'[A-Z0-9_]{4,80}',reason):
                          print('B2B_PUBLIC_CARD_'+str(i)+'_AI_TITLE_BLOCK_'+reason+'=YES',flush=True)
                      print('B2B_PUBLIC_CARD_'+str(i)+'_AI_TITLE_ALLOWED=NO',flush=True)
                  try:
                      findings=research_public(item,client,hosts,deep_search_enabled=False)
                      status=findings.get('status','')
                      count=len(findings.get('pages') or [])
                      print('B2B_PUBLIC_CARD_'+str(i)+'_PAGES='+str(min(count,5)),flush=True)
                      print('B2B_PUBLIC_CARD_'+str(i)+'_SOURCE_READABLE='+('YES' if status=='PUBLIC_PAGES_INSPECTED' and count>0 else 'NO'),flush=True)
                  except (ResearchBlocked,httpx.HTTPError,ValueError,KeyError) as exc:
                      reason=str(exc) if isinstance(exc,ResearchBlocked) else 'PUBLIC_RESEARCH_UNAVAILABLE'
                      if re.fullmatch(r'[A-Z0-9_]{4,80}',reason):
                          print('B2B_PUBLIC_CARD_'+str(i)+'_RESEARCH_BLOCK_'+reason+'=YES',flush=True)
                      print('B2B_PUBLIC_CARD_'+str(i)+'_SOURCE_READABLE=NO',flush=True)
                  print('B2B_PUBLIC_CARD_'+str(i)+'_PROBED=YES',flush=True)
          print('B2B_PUBLIC_PROBE_DONE=YES',flush=True)
          PY
          grep -E '^B2B_PUBLIC_[A-Z0-9_]+=(YES|NO|[0-9]+)$' "$RUNNER_TEMP/b2b-public/status" | head -35
          grep -qx 'B2B_PUBLIC_PROBE_DONE=YES' "$RUNNER_TEMP/b2b-public/status"
      - name: Publish only fixed status codes; never source URLs, title or customer details
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/b2b-public/status"
          summary="$(grep -E '^B2B_PUBLIC_[A-Z0-9_]+=(YES|NO|[0-9]+)$' "$f" 2>/dev/null | head -35 || true)"
          [[ -n "$summary" ]] || summary='B2B_PUBLIC_PROBE_UNVERIFIED=YES'
          msg="$(printf 'B2B exact two public-source page reachability and model-safe title eligibility (READ ONLY):\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nOnly bounded public GETs respecting robots/HTTPS/DNS allowlist; no RouterAI token use; CRM, PG, tasks, source configuration, credentials and personal data untouched. No customer fields or URLs exported.' "$summary" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/314/comments" -X POST --raw-field "body=$msg" >/dev/null || true
