# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT inspect pinned API transport
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-manager-workspace-audit.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-manager-workspace-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-manager-workspace-app python -B -' <<'APP_AUDIT'
          import json,urllib.request,urllib.error,urllib.parse
          import automation as a
          token=a.read("auth.json")["access_token"]
          class InspectRedirect(a.NoRedirect):
           def redirect_request(self,req,fp,code,msg,headers,newurl):
            u=urllib.parse.urlsplit(newurl)
            print("REDIRECT="+str(code)+":"+u.scheme+"://"+u.netloc+u.path,flush=True)
            raise a.Failure("REDIRECT_REFUSED")
          for small in [True,False]:
           data={"entityTypeId":1062,"useOriginalUfNames":"Y","filter":{"categoryId":21,">id":7},"order":{"id":"ASC"},"select":["id","categoryId","assignedById"] if small else ["*"],"start":0,"auth":token}
           req=urllib.request.Request(a.PORTAL+"crm.item.list",json.dumps(data).encode(),{"Content-Type":"application/json"})
           try:
            with urllib.request.build_opener(InspectRedirect).open(req,timeout=30) as r:result=json.load(r)
            print("LIST_RESULT="+str(small)+":"+str(len(result.get("result",{}).get("items",[]))),flush=True)
           except Exception as e:
            print("LIST_EXCEPTION="+str(small)+":"+type(e).__name__,flush=True)
            if isinstance(e,urllib.error.HTTPError):print("HTTP_STATUS="+str(e.code),flush=True)
          APP_AUDIT
