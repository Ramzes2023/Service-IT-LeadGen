name: ServiceIT V18 MKB 4675475 one-use sourced facts to REAL Bitrix card 17
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v18-mkb-card17-factual-write-once
  cancel-in-progress: false
jobs:
  write_oneuse:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V18_MKB_CARD17_FACTUAL_ONEUSE_WRITE_489'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact reviewed V18 modules and bounded operator-verified addendum
        shell: bash
        run: |
          set -euo pipefail
          v18='0bafb328640e60f7b9656e145f4eed96c7dd0dfb'
          addendum='3dafb4d13595d1b372bae1bfe9ce68794e7480b7'
          git cat-file -e "$v18^{commit}"
          git cat-file -e "$addendum^{commit}"
          for name in serviceit_b2b_public_mirrors.py \
                      serviceit_b2b_tender_index_v18.py \
                      serviceit_vps_b2b_deep_research.py \
                      serviceit_b2b_dossier_v11.py \
                      serviceit_vps_worker.py \
                      serviceit_vps_b2b_dossier_v11_worker.py; do
            git diff --quiet "$v18" HEAD -- "leadpilot/$name"
          done
          script=ops/serviceit_vps_b2b_mkb_4675475_card17_verified_v18_fix.py
          git diff --quiet "$addendum" HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/mkb-v18"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/mkb-v18/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/mkb-v18/hosts"
          chmod 0600 "$RUNNER_TEMP/mkb-v18/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/mkb-v18/hosts" >/dev/null
          sha256sum leadpilot/serviceit_b2b_public_mirrors.py | cut -d' ' -f1 \
            > "$RUNNER_TEMP/mkb-v18/mirror-sha"
      - name: One-use evidence write to exact #17 and verify nine fields, no score or tasks
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/mkb-v18/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mirror_sha="$(cat "$RUNNER_TEMP/mkb-v18/mirror-sha")"
          [[ "$mirror_sha" =~ ^[a-f0-9]{64}$ ]]
          set +e
          ssh -T -i "$RUNNER_TEMP/mkb-v18/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - '$mirror_sha'" \
            < ops/serviceit_vps_b2b_mkb_4675475_card17_verified_v18_fix.py \
            > "$RUNNER_TEMP/mkb-v18/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^MKB_CARD17_(VERIFIED_WRITE|REASON)=(YES|NO|[A-Z0-9_]{4,72})$' \
            "$RUNNER_TEMP/mkb-v18/status" | head -12 || true
          [[ "$rc" == 0 ]]
          grep -qx 'MKB_CARD17_VERIFIED_WRITE=YES' "$RUNNER_TEMP/mkb-v18/status"
