name: ServiceIT manager tasks link and scope READ ONLY

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: serviceit-manager-tasks-only-readonly
  cancel-in-progress: false

jobs:
  read-task-metadata:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 74 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_MANAGER_TASK_SCOPE_READONLY_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Only three fixed task metadata REST reads (zero writes)
        run: python -m leadpilot.serviceit_manager_task_scope_probe
