name: ServiceIT Bitrix safe list-shape diagnostic (read-only)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: serviceit-b2b-list-shape-readonly
  cancel-in-progress: false

jobs:
  bounded-readonly-shape:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 74 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_B2B_LIST_SHAPE_READONLY_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Bounded scope shape inspection without data/IDs in logs
        run: python -m leadpilot.serviceit_b2b_list_shape_probe
