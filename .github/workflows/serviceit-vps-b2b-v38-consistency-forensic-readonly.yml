name: ServiceIT V38 inspect V37 drift and uncertain Bitrix card READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v38-consistency-forensic-readonly
  cancel-in-progress: false
jobs:
  forensic:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_V38_V37_DRIFT_FORENSIC_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attest signed source and SSH known hosts
        shell: bash
        run: |
          set -euo pipefail
          names=(serviceit_vps_worker.py serviceit_b2b_dossier_consistency_v37.py
            serviceit_b2b_dossier_consistency_worker_v37.py)
          blobs=(5e240eb920d6b33880303fa08c84699bcd4d19dd c7d0b836a196f440dd19bc0ec2e22a89e570f786 98867c22528fa79bbf2220296d4d46b1ac04b1e6)
          install -d -m 0700 "$RUNNER_TEMP/v38"
          : > "$RUNNER_TEMP/v38/new"
          for i in "${!names[@]}"; do
            name="leadpilot/${names[$i]}"
            [[ "$(git hash-object "$name")" == "${blobs[$i]}" ]]
            sha256sum "$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v38/new"
          done
          [[ "$(git hash-object ops/serviceit_vps_b2b_v38_consistency_forensic_readonly.py)" == 75602d255a4ac3157804231b2dffb471c113a954 ]]
          python -m py_compile ops/serviceit_vps_b2b_v38_consistency_forensic_readonly.py
          git show 1184e8840d585bd1162910d545cdfa8667197818:leadpilot/serviceit_vps_worker.py \
            | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/v38/old"
          printf '%s\n' MISSING MISSING >> "$RUNNER_TEMP/v38/old"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v38/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v38/hosts"
          chmod 0600 "$RUNNER_TEMP/v38/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v38/hosts" >/dev/null
      - name: Live runtime SHA and uncertain receipt without any writes
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v38/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t new < "$RUNNER_TEMP/v38/new"
          mapfile -t old < "$RUNNER_TEMP/v38/old"
          [[ "${#new[@]}" == 3 && "${#old[@]}" == 3 ]]
          for v in "${new[@]}" "${old[0]}"; do
            [[ "$v" =~ ^[0-9a-f]{64}$ ]]
          done
          [[ "${old[1]}" == MISSING && "${old[2]}" == MISSING ]]
          args=()
          for v in "${new[@]}" "${old[@]}"; do args+=("'$v'"); done
          set +e
          ssh -T -i "$RUNNER_TEMP/v38/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - ${args[*]}" \
            < ops/serviceit_vps_b2b_v38_consistency_forensic_readonly.py \
            > "$RUNNER_TEMP/v38/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V38_FORENSIC_[A-Z0-9_]{3,65}=(YES|NO|MISSING|NEW|OLD|OTHER|[0-9]{1,6}|[A-Z0-9_]{4,70})$' \
            "$RUNNER_TEMP/v38/status" | head -60 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V38_FORENSIC_ARGS_VALID=YES' "$RUNNER_TEMP/v38/status"
          grep -qx 'V38_FORENSIC_CRM_WRITES=0' "$RUNNER_TEMP/v38/status"
          grep -qx 'V38_FORENSIC_POSTGRES_WRITES=0' "$RUNNER_TEMP/v38/status"
