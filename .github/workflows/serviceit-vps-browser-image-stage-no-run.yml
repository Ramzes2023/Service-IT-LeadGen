name: ServiceIT VPS stage isolated Chromium image ONLY (no browser run)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type STAGE_CHROMIUM_IMAGE_NO_RUN; does not activate browser/CRM'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: serviceit-vps-native-shadow-readonly
  cancel-in-progress: false

jobs:
  stage-browser-image-only:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      inputs.approval == 'STAGE_CHROMIUM_IMAGE_NO_RUN'
    runs-on: ubuntu-latest
    # Official Playwright image includes an ~860 MB layer; on this VPS the
    # previous 25-minute attempt was cancelled mid-download at ~449 MB.
    # This remains an OWNER-ONLY image build: no browser run or CRM writes.
    timeout-minutes: 90
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned non-root SSH and current release hash
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          mkdir -m 0700 -p "$RUNNER_TEMP/serviceit-browser-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/serviceit-browser-ssh/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/serviceit-browser-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/serviceit-browser-ssh/id" "$RUNNER_TEMP/serviceit-browser-ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/serviceit-browser-ssh/known_hosts" >/dev/null
          [[ "$(git rev-parse HEAD)" =~ ^[a-f0-9]{40}$ ]]
      # Browser-image staging is independent of core LIVE and the READONLY
      # shadow installer, which correctly refuses to run after cutover.
      - name: Upload exactly pinned source archive for optional browser build (NO core redeploy)
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          archive="$RUNNER_TEMP/browser-only-$sha.tgz"
          git archive --format=tar.gz -o "$archive" HEAD
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          printf 'BROWSER_ARCHIVE_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
          ssh -T -i "$RUNNER_TEMP/serviceit-browser-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-browser-ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/serviceit/staging"'
          scp -i "$RUNNER_TEMP/serviceit-browser-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-browser-ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$archive" "$VPS_USER@$VPS_HOST:serviceit/staging/browser-only-$sha.tgz"
          echo "BROWSER_SOURCE_ARCHIVE_UPLOADED=YES"

      - name: Build optional pinned Chromium image; NEVER start it or mutate Bitrix
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$BROWSER_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          ssh -T -i "$RUNNER_TEMP/serviceit-browser-ssh/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/serviceit-browser-ssh/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "bash -se -- $sha $BROWSER_ARCHIVE_SHA256" <<'REMOTE'
          set -euo pipefail
          umask 077
          sha="$1"
          digest="$2"
          [[ "$(id -u)" != 0 ]] || exit 2
          [[ "$sha" =~ ^[a-f0-9]{40}$ && "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 2
          base="$HOME/serviceit"
          archive="$base/staging/browser-only-$sha.tgz"
          [[ -f "$archive" ]] || exit 2
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --status \
            || { echo "BROWSER_SOURCE_ARCHIVE_HASH_INVALID"; exit 2; }
          free_kb="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          [[ "$free_kb" =~ ^[0-9]+$ && "$free_kb" -gt 6291456 ]] || {
            echo "BROWSER_STAGE_DISK_FREE_UNVERIFIED"; exit 2;
          }
          running="$(docker ps --filter label=com.docker.compose.project=serviceit-public-browser-vps --format '{{.Names}}')"
          [[ -z "$running" ]] || {
            echo "BROWSER_CONTAINER_ALREADY_ACTIVE_HOLD"; exit 2;
          }
          # Never invoke the READONLY shadow deployment after native LIVE cutover.
          # Extract the reviewed commit archive only into a separate browser
          # build directory. Docker may reuse its unfinished download cache.
          builds="$base/browser-image-builds"
          mkdir -p "$builds"
          temp="$(mktemp -d "$builds/$sha.XXXXXXXX")"
          trap 'rm -rf -- "$temp"' EXIT
          tar --no-same-owner --no-same-permissions -xzf "$archive" -C "$temp"
          [[ -f "$temp/Dockerfile.serviceit-vps-browser" ]] || exit 2
          [[ -f "$temp/deploy/serviceit-vps-browser.compose.yml" ]] || exit 2
          docker build --file "$temp/Dockerfile.serviceit-vps-browser" \
            --tag serviceit-vps-public-browser:staged "$temp" >/dev/null
          docker image inspect serviceit-vps-public-browser:staged >/dev/null
          running="$(docker ps --filter label=com.docker.compose.project=serviceit-public-browser-vps --format '{{.Names}}')"
          [[ -z "$running" ]] || exit 2
          echo "BROWSER_IMAGE_ON_VPS=STAGED_NOT_RUNNING"
          echo "BROWSER_SANDBOX_AND_EGRESS_FIREWALL=NOT_VERIFIED"
          echo "BROWSER_CONNECTED_TO_NATIVE_WORKER=NO"
          echo "CORE_LIVE_CONTAINERS=NOT_TOUCHED"
          echo "CRM_WRITES=0;TASKS_CREATED=0;BROWSER_URLS_VISITED=0"
          REMOTE
