name: ServiceIT B2B partial 9 AI field forensic READ ONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-partial-nine-readonly
  cancel-in-progress: false
jobs:
  forensic:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_B2B_PARTIAL_NINE_FORENSIC_READONLY_314'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - name: Strict SSH trust and no secrets in logs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/b2b-nine-forensic"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/b2b-nine-forensic/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/b2b-nine-forensic/known_hosts"
          chmod 600 "$RUNNER_TEMP/b2b-nine-forensic/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/b2b-nine-forensic/known_hosts" >/dev/null
      - name: Examine existing PG write-intent receipts and exact CRM field presence
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/b2b-nine-forensic/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-nine-forensic/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' > "$RUNNER_TEMP/b2b-nine-forensic/status" <<'PY'
          import subprocess,re
          code = """
          print('B2B_NINE_STARTED=YES',flush=True)
          import os,httpx,re
          from leadpilot.serviceit_vps_pg_queue import db,secret_file
          from leadpilot.serviceit_enrichment_worker import normalized,AI_FIELDS,PREFIX,Rest,validate_identity
          from leadpilot.serviceit_windows_autofill import preliminary_fields
          from leadpilot.serviceit_vps_native_fence import digested
          from leadpilot.bitrix_metadata_audit import validate_webhook
          SIGNAL=PREFIX+'SIGNAL_ID'
          print('B2B_NINE_IMPORTS=YES',flush=True)
          keys=sorted(AI_FIELDS)
          print('B2B_NINE_DB_OPEN_START=YES',flush=True)
          with db(dict(os.environ)) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT b.card_id,b.source_id,q.status,r.status,r.field_names,r.digest_salt,r.expected_digest FROM serviceit_vps_b2b_inbox b JOIN serviceit_vps_new_cards q ON q.card_id=b.card_id LEFT JOIN serviceit_vps_native_receipts r ON r.card_id=b.card_id AND r.namespace='AI_NINE_V1' WHERE b.state='VERIFIED' ORDER BY b.received_at,b.source_id LIMIT 3")
                  rows=cur.fetchall()
          print('B2B_NINE_DB_ROWS_READ=YES',flush=True)
          print('B2B_NINE_CARDS='+str(len(rows)),flush=True)
          assert len(rows)==2
          print('B2B_NINE_CREDENTIAL_READ_START=YES',flush=True)
          base=validate_webhook(secret_file(dict(os.environ),'SERVICEIT_BITRIX_WEBHOOK'))
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=20) as client:
              rest=Rest(base,client)
              print('B2B_NINE_REST_READY=YES',flush=True)
              field_metadata=rest('crm.item.fields',{'entityTypeId':1062,'useOriginalUfNames':'Y'})['fields']
              for key in keys:
                  meta=field_metadata.get(key,{})
                  suffix=key.removeprefix(PREFIX)
                  if isinstance(meta,dict):
                      is_text=meta.get('type')=='string'
                      is_write=meta.get('isReadOnly') is False
                      print('B2B_NINE_META_'+suffix+'_STRING='+('YES' if is_text else 'NO'),flush=True)
                      print('B2B_NINE_META_'+suffix+'_WRITABLE='+('YES' if is_write else 'NO'),flush=True)
                      settings=meta.get('settings')
                      raw=(settings.get('MAX_LENGTH',settings.get('maxLength'))
                           if isinstance(settings,dict) else None)
                      if raw is None:
                          raw=meta.get('maxLength',meta.get('max_length'))
                      if type(raw) is int and 0<=raw<=100000:
                          print('B2B_NINE_META_'+suffix+'_MAX_LENGTH='+str(raw),flush=True)
                      elif isinstance(raw,str) and raw.isdecimal() and len(raw)<=6:
                          print('B2B_NINE_META_'+suffix+'_MAX_LENGTH='+raw,flush=True)
                      else:
                          print('B2B_NINE_META_'+suffix+'_MAX_LENGTH_UNAVAILABLE=YES',flush=True)
              print('B2B_NINE_METADATA_DONE=YES',flush=True)
              for position,(card,source,queue,native,names,salt,digest) in enumerate(rows,1):
                  item=normalized(rest('crm.item.get',{'entityTypeId':1062,'id':int(card),'useOriginalUfNames':'Y'})['item'])
                  validate_identity(item,int(card))
                  assert item.get(SIGNAL)==source
                  print('B2B_NINE_CARD_'+str(position)+'_IDENTITY=YES',flush=True)
                  for key in keys:
                      suffix=key.removeprefix(PREFIX)
                      assert suffix in {'AI_STATUS','AI_SUMMARY','AI_QUOTE','AI_HYPOTHESIS','AI_LIMITATIONS','AI_RECOMMENDATION','AI_NEXT_ACTION','AI_MANAGER_BRIEF','AI_FULL_REPORT'}
                      val=item.get(key)
                      state='FILLED' if isinstance(val,str) and val.strip() else 'EMPTY'
                      print('B2B_NINE_CARD_'+str(position)+'_'+suffix+'_'+state+'=YES',flush=True)
                      if state=='FILLED':
                          print('B2B_NINE_CARD_'+str(position)+'_'+suffix+'_LEN='+str(len(val)),flush=True)
                  generated=preliminary_fields(item)
                  for key in keys:
                      suffix=key.removeprefix(PREFIX)
                      print('B2B_NINE_CARD_'+str(position)+'_'+suffix+'_GENERATED_LEN='+str(len(generated[key])),flush=True)
                      print('B2B_NINE_CARD_'+str(position)+'_'+suffix+'_NON_BMP='+str(sum(ord(ch)>65535 for ch in generated[key])),flush=True)
                      print('B2B_NINE_CARD_'+str(position)+'_'+suffix+'_CARRIAGE_RETURN='+str(generated[key].count(chr(13))),flush=True)
                  if isinstance(names,list) and len(names)==9 and salt is not None and digest is not None:
                      observed={name:item.get(name) for name in names}
                      exact=digested(observed,bytes(salt))==bytes(digest)
                      print('B2B_NINE_CARD_'+str(position)+'_PG_DIGEST_MATCH='+('YES' if exact else 'NO'),flush=True)
                  else:
                      print('B2B_NINE_CARD_'+str(position)+'_PG_DIGEST_ABSENT=YES',flush=True)
                  status=queue if isinstance(queue,str) else 'MISSING'
                  receipt=native if isinstance(native,str) else 'MISSING'
                  if re.fullmatch(r'[A-Z0-9_]{2,40}',status):
                      print('B2B_NINE_CARD_'+str(position)+'_QUEUE_'+status+'=YES',flush=True)
                  if re.fullmatch(r'[A-Z0-9_]{2,40}',receipt):
                      print('B2B_NINE_CARD_'+str(position)+'_FENCE_'+receipt+'=YES',flush=True)
          print('B2B_NINE_FORENSIC_DONE=YES',flush=True)
          """
          compile(code,'<b2b-nine-forensic>','exec')
          p=subprocess.run(['docker','exec','serviceit-leadgen-vps-coordinator-1','python','-c',code],
               stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,
               stderr=subprocess.DEVNULL,text=True,timeout=140)
          for line in p.stdout.splitlines():
              if re.fullmatch(r'B2B_NINE_[A-Z0-9_]+=(?:YES|NO|[0-9]+)',line):
                  print(line,flush=True)
          if p.returncode:
              print('B2B_NINE_FORENSIC_BLOCKED=YES',flush=True)
              raise SystemExit(2)
          PY
          grep -E '^B2B_NINE_[A-Z0-9_]+=(YES|NO|[0-9]+)$' "$RUNNER_TEMP/b2b-nine-forensic/status"
          grep -qx 'B2B_NINE_FORENSIC_DONE=YES' "$RUNNER_TEMP/b2b-nine-forensic/status"
      - name: Add fixed-field-name and length-only diagnostic to Issue 314
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="$(grep -E '^B2B_NINE_[A-Z0-9_]+=(YES|NO|[0-9]+)$' "$RUNNER_TEMP/b2b-nine-forensic/status" 2>/dev/null | head -95 || true)"
          [[ -n "$summary" ]] || summary='B2B_NINE_FORENSIC_UNVERIFIED=YES'
          msg="$(printf 'B2B two exact Bitrix cards: why 6 of 9 AI fields after write-intent (READ ONLY):\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nNo source ID, card ID, field VALUE, secret, CRM/PG mutation, AI call or retry published/performed.' "$summary" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/314/comments" -X POST --raw-field "body=$msg" >/dev/null || true
