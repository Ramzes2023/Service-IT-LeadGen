name: ServiceIT B2B deep evidence and nine AI fields production READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-deep-evidence-readback
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_B2B_DEEP_READBACK_ONLY_314'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - name: Owner-only pinned nonroot VPS access
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/deep-check"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/deep-check/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/deep-check/hosts"
          chmod 0600 "$RUNNER_TEMP/deep-check/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/deep-check/hosts" >/dev/null
      - name: Read exact B2B receipts and each CRM status, no mutations
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/deep-check/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deep-check/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            > "$RUNNER_TEMP/deep-check/status" <<'PY'
          import os
          import re
          import httpx
          from leadpilot.serviceit_vps_pg_queue import db, secret_file
          from leadpilot.serviceit_b2b_hold_ai_fields import AI_FIELDS, PREFIX
          from leadpilot.serviceit_enrichment_worker import Rest, normalized, validate_identity
          env=dict(os.environ)
          enabled=env.get('SERVICEIT_VPS_B2B_DEEP_RESEARCH_ENABLED')=='YES'
          print('DEEP_LIVE_ENABLED='+('YES' if enabled else 'NO'))
          with db(env) as connection:
              with connection.cursor() as cur:
                  cur.execute("""
                    SELECT b.card_id, COALESCE(r.status,'NONE'),
                           COALESCE(r2.status,'NONE'),
                           COALESCE(r3.status,'NONE'),
                           COALESCE(r4.status,'NONE')
                    FROM serviceit_vps_b2b_inbox b
                    LEFT JOIN serviceit_vps_native_receipts r
                    ON r.namespace='B2B_RESEARCH_V1' AND r.card_id=b.card_id
                    LEFT JOIN serviceit_vps_native_receipts r2
                    ON r2.namespace='B2B_RESEARCH_V2' AND r2.card_id=b.card_id
                    LEFT JOIN serviceit_vps_native_receipts r3
                    ON r3.namespace='B2B_RESEARCH_V3' AND r3.card_id=b.card_id
                    LEFT JOIN serviceit_vps_native_receipts r4
                    ON r4.namespace='B2B_RESEARCH_V4' AND r4.card_id=b.card_id
                    WHERE b.state='VERIFIED' AND b.card_id IS NOT NULL
                    ORDER BY b.received_at,b.source_id LIMIT 10
                  """)
                  rows=cur.fetchall()
                  cur.execute("SELECT count(*) FROM serviceit_vps_b2b_inbox WHERE state='VERIFIED' AND card_id IS NOT NULL")
                  total=int(cur.fetchone()[0])
          assert 0 <= total <= 10,'EXACT_B2B_CARD_LIMIT'
          print('DEEP_VERIFIED_B2B_CARDS='+str(total))
          prefix=PREFIX
          seen=0
          full=0
          cited=0
          readback=0
          untouched=0
          model_unverified=0
          receipt_verified=0
          receipt_uncertain=0
          v2_verified=0
          v2_uncertain=0
          v3_verified=0
          v3_uncertain=0
          v4_verified=0
          v4_uncertain=0
          v2_cited=0
          source_only_cited=0
          webhook=secret_file(env,'SERVICEIT_BITRIX_WEBHOOK')
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=20) as client:
              rest=Rest(webhook,client)
              for card,receipt,receipt_v2,receipt_v3,receipt_v4 in rows:
                  item=normalized(rest('crm.item.get',{
                      'entityTypeId':1062,'id':int(card),
                      'useOriginalUfNames':'Y'})['item'])
                  validate_identity(item,int(card))
                  seen+=1
                  data={name:item.get(name) for name in AI_FIELDS}
                  if all(isinstance(v,str) and v.strip() and len(v)<=12000 for v in data.values()):
                      full+=1
                  status=item.get(prefix+'AI_STATUS') or ''
                  report=item.get(prefix+'AI_FULL_REPORT') or ''
                  if status=='PUBLIC_RESEARCH_ROUTERAI_CITED':
                      cited+=1
                      v2_cited+=1
                  if status=='PUBLIC_RESEARCH_SOURCE_CITED_AI_UNVERIFIED':
                      source_only_cited+=1
                  if status in ('PUBLIC_RESEARCH_ROUTERAI_NO_VERIFIED_QUOTES',
                                'PUBLIC_PAGES_ROUTERAI_UNVERIFIED',
                                'PUBLIC_RESEARCH_NO_VERIFIED_PUBLIC_TEXT',
                                'PUBLIC_RESEARCH_SOURCE_CITED_AI_UNVERIFIED',
                                'PUBLIC_RESEARCH_SOURCE_NO_QUOTES_AI_UNVERIFIED'):
                      model_unverified+=1
                  if status=='NOT_RUN_SOURCE_UNVERIFIED':
                      untouched+=1
                  if isinstance(report,str) and ('Дословно на странице:' in report
                         and 'Публичный источник:' in report):
                      readback+=1
                  if receipt=='VERIFIED':
                      receipt_verified+=1
                  if receipt=='UNCERTAIN':
                      receipt_uncertain+=1
                  if receipt_v2=='VERIFIED':
                      v2_verified+=1
                  if receipt_v2=='UNCERTAIN':
                      v2_uncertain+=1
                  if receipt_v3=='VERIFIED':
                      v3_verified+=1
                  if receipt_v3=='UNCERTAIN':
                      v3_uncertain+=1
                  if receipt_v4=='VERIFIED':
                      v4_verified+=1
                  if receipt_v4=='UNCERTAIN':
                      v4_uncertain+=1
                  label=status if re.fullmatch(r'[A-Z0-9_]{4,90}',status) else 'OTHER'
                  print('DEEP_CARD_'+str(seen)+'_STATUS='+label)
                  rlabel=receipt if re.fullmatch(r'[A-Z0-9_]{3,30}',receipt) else 'OTHER'
                  print('DEEP_CARD_'+str(seen)+'_RECEIPT='+rlabel)
                  vlabel=receipt_v2 if re.fullmatch(r'[A-Z0-9_]{3,30}',receipt_v2) else 'OTHER'
                  print('DEEP_CARD_'+str(seen)+'_V2_RECEIPT='+vlabel)
                  v3label=receipt_v3 if re.fullmatch(r'[A-Z0-9_]{3,30}',receipt_v3) else 'OTHER'
                  print('DEEP_CARD_'+str(seen)+'_V3_RECEIPT='+v3label)
                  v4label=receipt_v4 if re.fullmatch(r'[A-Z0-9_]{3,30}',receipt_v4) else 'OTHER'
                  print('DEEP_CARD_'+str(seen)+'_V4_RECEIPT='+v4label)
                  print('DEEP_CARD_'+str(seen)+'_NINE='+('YES' if all(
                      isinstance(v,str) and v.strip() for v in data.values()) else 'NO'))
                  print('DEEP_CARD_'+str(seen)+'_REPORT_CHARS='+str(min(len(report),12000)))
                  print('DEEP_CARD_'+str(seen)+'_CITED_QUOTE_COUNT='+str(min(report.count('Дословно на странице:'),20)))
                  print('DEEP_CARD_'+str(seen)+'_SOURCE_LINK_COUNT='+str(min(report.count('Публичный источник: https://'),20)))
                  print('DEEP_CARD_'+str(seen)+'_ACTIONS_NONEMPTY='+(
                      'YES' if isinstance(data.get(prefix+'AI_NEXT_ACTION'),str)
                      and len(data[prefix+'AI_NEXT_ACTION'].strip())>30 else 'NO'))
                  obsolete=any(
                      any(v in val.casefold() for v in ('gigachat','гигачат','гига чат'))
                      for val in data.values() if isinstance(val,str))
                  print('DEEP_CARD_'+str(seen)+'_OBSOLETE_AI_NAME='+('YES' if obsolete else 'NO'))
          for key,value in (
              ('DEEP_CRM_EXACT',seen),('DEEP_NINE_FIELDS_FULL',full),
              ('DEEP_CITED_MODEL_CARDS',cited),('DEEP_CITED_CONTENT_READBACK',readback),
              ('DEEP_UNVERIFIED_OR_UNREADABLE',model_unverified),
              ('DEEP_STILL_ORIGINAL_TEMPLATE',untouched),
              ('DEEP_RECEIPTS_VERIFIED',receipt_verified),
              ('DEEP_RECEIPTS_UNCERTAIN',receipt_uncertain),
              ('DEEP_V2_RECEIPTS_VERIFIED',v2_verified),
              ('DEEP_V2_RECEIPTS_UNCERTAIN',v2_uncertain),
              ('DEEP_V3_RECEIPTS_VERIFIED',v3_verified),
              ('DEEP_V3_RECEIPTS_UNCERTAIN',v3_uncertain),
              ('DEEP_V4_RECEIPTS_VERIFIED',v4_verified),
              ('DEEP_V4_RECEIPTS_UNCERTAIN',v4_uncertain),
              ('DEEP_V2_CITED_ROUTERAI',v2_cited),
              ('DEEP_V2_CITED_SOURCE_ONLY',source_only_cited),
          ):
              print(key+'='+str(value))
          print('DEEP_READBACK_DONE=YES')
          PY
          grep -E '^DEEP_[A-Z0-9_]+=(YES|NO|NONE|OTHER|[0-9]+|[A-Z0-9_]{4,90})$' \
            "$RUNNER_TEMP/deep-check/status" | head -50
          grep -qx 'DEEP_READBACK_DONE=YES' "$RUNNER_TEMP/deep-check/status"
      - name: Post only safe counts and status codes to the issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/deep-check/status"
          safe="$(grep -E '^DEEP_[A-Z0-9_]+=(YES|NO|NONE|OTHER|[0-9]+|[A-Z0-9_]{4,90})$' "$f" 2>/dev/null | head -50 || true)"
          [[ -n "$safe" ]] || safe='DEEP_READBACK_UNVERIFIED=YES'
          msg="$(printf 'Real live B2B deep research readback, no model calls/writes:\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nCounts and fixed status codes only. No URLs, buyer data, CRM ID, customer text or secrets.' "$safe" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/314/comments" -X POST --raw-field "body=$msg" >/dev/null || true
