# Corporate VPS. Host-mode networking is REQUIRED for PostgreSQL which is
# only bound to 127.0.0.1:5432; HTTP listens only on loopback 127.0.0.1:18780.
# Caddy is already installed on the host and terminates TLS separately.
name: serviceit-leadgen-vps
x-base: &base
  build:
    context: ..
    dockerfile: Dockerfile.serviceit-vps
  restart: unless-stopped
  network_mode: host
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  init: true
  environment: &common-env
    SERVICEIT_PG_HOST: "127.0.0.1"
    SERVICEIT_PG_PORT: "5432"
    SERVICEIT_PG_DB: "leadgen"
    SERVICEIT_PG_USER: "leadgen"
    SERVICEIT_PG_PASSWORD_FILE: /run/secrets/serviceit_pg_password
    SERVICEIT_BITRIX_WEBHOOK_FILE: /run/secrets/serviceit_bitrix_webhook
    # REST polling only; authenticated outgoing-event intake is disabled.
    SERVICEIT_VPS_INTAKE_ENABLED: "NO"
    SERVICEIT_VPS_WRITER_MODE: "${SERVICEIT_VPS_WRITER_MODE:-READONLY}"
    SERVICEIT_VPS_CUTOVER_AUTHORIZED: "${SERVICEIT_VPS_CUTOVER_AUTHORIZED:-NO}"
    SERVICEIT_VPS_OLD_GH_WRITERS_DISABLED_ACK: "${SERVICEIT_VPS_OLD_GH_WRITERS_DISABLED_ACK:-NO}"
    SERVICEIT_VPS_POLL_ENABLED: "${SERVICEIT_VPS_POLL_ENABLED:-NO}"
    # REQUIRED only after old cloud writers have actually stopped.
    SERVICEIT_VPS_NATIVE_ACTIVATION_UTC: "${SERVICEIT_VPS_NATIVE_ACTIVATION_UTC:-}"
    # Native PostgreSQL receipts: NO GitHub/HMAC/Fernet secrets or API dependency.
    # Optional Brave API can be mounted by a separately reviewed override.
    SERVICEIT_AI_PROVIDER: "routerai"
    SERVICEIT_ROUTERAI_API_KEY_FILE: /run/secrets/serviceit_routerai_key
    SERVICEIT_ROUTERAI_FALLBACK_TO_GIGACHAT: "NO"
    SERVICEIT_WORKER_MODEL_PRIVACY_APPROVED: "${SERVICEIT_WORKER_MODEL_PRIVACY_APPROVED:-NO}"
    SERVICEIT_ROUTERAI_PRIVACY_APPROVED: "${SERVICEIT_ROUTERAI_PRIVACY_APPROVED:-NO}"
    SERVICEIT_PRELIMINARY_PUBLIC_HOSTS: "${SERVICEIT_PRELIMINARY_PUBLIC_HOSTS:-}"
    SERVICEIT_PUBLIC_RESEARCH_COMPANY_HOSTS: "${SERVICEIT_PUBLIC_RESEARCH_COMPANY_HOSTS:-}"
  secrets: &common-secrets
    - serviceit_pg_password
    - serviceit_bitrix_webhook
    - serviceit_routerai_key

services:
  ingress:
    <<: *base
    # Public gateway handles health only in poll-only mode. It receives NO
    # credentials, not even the Bitrix REST webhook.
    secrets: []
    command: ["python", "-m", "uvicorn", "leadpilot.serviceit_vps_ingress:app",
              "--host", "127.0.0.1", "--port", "18780",
              "--workers", "1", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:18780/health',timeout=3); assert r.status_code==200 and r.json()['crm_writer_enabled'] is False"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  # Native auxiliaries: own STOP, visible CRM dedup, Kanban and manager task.
  # ALL disabled until independent approval and VPS cloud-writer shutdown.
  auxiliaries:
    <<: *base
    secrets:
      - serviceit_pg_password
      - serviceit_bitrix_webhook
    command: ["python", "-m", "leadpilot.serviceit_vps_native_aux", "--loop"]
    environment:
      <<: *common-env
      SERVICEIT_VPS_OWN_STOP_ENABLED: "${SERVICEIT_VPS_OWN_STOP_ENABLED:-NO}"
      SERVICEIT_VPS_CRM_DUPLICATE_ENABLED: "${SERVICEIT_VPS_CRM_DUPLICATE_ENABLED:-NO}"
      SERVICEIT_VPS_KANBAN_TITLE_ENABLED: "${SERVICEIT_VPS_KANBAN_TITLE_ENABLED:-NO}"
      SERVICEIT_VPS_MANAGER_TASK_ENABLED: "${SERVICEIT_VPS_MANAGER_TASK_ENABLED:-NO}"
      # Owner-approved task recipient for all FUTURE native internal review tasks.
      # No task is ever created until the separate MANAGER_TASK_ENABLED cutover.
      SERVICEIT_VPS_TASK_ASSIGNEE_APPROVED: "${SERVICEIT_VPS_TASK_ASSIGNEE_APPROVED:-NO}"
      SERVICEIT_VPS_TASK_ASSIGNEE_ID: "${SERVICEIT_VPS_TASK_ASSIGNEE_ID:-}"
      SERVICEIT_VPS_FNS_CRM_RESULT_ENABLED: "${SERVICEIT_VPS_FNS_CRM_RESULT_ENABLED:-NO}"
      SERVICEIT_VPS_PROVISIONAL_SCORE_ENABLED: "${SERVICEIT_VPS_PROVISIONAL_SCORE_ENABLED:-NO}"
      SERVICEIT_VPS_FREE_MSP_SCORE_ENABLED: "${SERVICEIT_VPS_FREE_MSP_SCORE_ENABLED:-NO}"
      SERVICEIT_STAGE3_FALLBACK_APPROVED: "${SERVICEIT_STAGE3_FALLBACK_APPROVED:-NO}"
      SERVICEIT_STAGE3_FALLBACK_MANAGER_ID: "${SERVICEIT_STAGE3_FALLBACK_MANAGER_ID:-}"
    healthcheck:
      test: ["CMD", "python", "-m", "leadpilot.serviceit_vps_native_aux", "--flags-only"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional official public FNS-MSP 2–3GB ZIP scanner; never included
  # in the default Compose deployment.  A dedicated disk scratch must be
  # prepared before profile 'msp' is activated; no GitHub or CRM write key.
  fns-msp:
    <<: *base
    profiles: ["msp"]
    secrets:
      - serviceit_pg_password
      - serviceit_bitrix_webhook
    volumes:
      - type: bind
        source: "${SERVICEIT_VPS_FNS_SCRATCH_DIR:-/var/lib/serviceit/fns-scratch}"
        target: /var/cache/serviceit-msp
        read_only: false
    command: ["python", "-m", "leadpilot.serviceit_vps_native_msp", "--loop"]
    environment:
      <<: *common-env
      SERVICEIT_VPS_FNS_MSP_ENABLED: "${SERVICEIT_VPS_FNS_MSP_ENABLED:-NO}"
    healthcheck:
      test: ["CMD", "python", "-c", "import leadpilot.serviceit_vps_native_msp; print('READY')"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Postcall manager-confirmation and finance internal request/task flow.
  # The two writer modules are mutually scoped by independently explicit
  # native cutover gates and NO-by-default per-module opt-ins.
  business:
    <<: *base
    secrets:
      - serviceit_pg_password
      - serviceit_bitrix_webhook
    command: ["python", "-m", "leadpilot.serviceit_vps_native_business", "--loop"]
    environment:
      <<: *common-env
      SERVICEIT_VPS_POSTCALL_ENABLED: "${SERVICEIT_VPS_POSTCALL_ENABLED:-NO}"
      SERVICEIT_VPS_FINANCE_ENABLED: "${SERVICEIT_VPS_FINANCE_ENABLED:-NO}"
    healthcheck:
      test: ["CMD", "python", "-m", "leadpilot.serviceit_vps_native_business", "--flags-only"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Hourly real CRM readback and manager funnel audit, always read-only.
  observer:
    <<: *base
    secrets:
      - serviceit_bitrix_webhook
    command: ["python", "-m", "leadpilot.serviceit_vps_native_observer", "--loop"]
    environment:
      SERVICEIT_BITRIX_WEBHOOK_FILE: /run/secrets/serviceit_bitrix_webhook
      SERVICEIT_VPS_NATIVE_ACTIVATION_UTC: "${SERVICEIT_VPS_NATIVE_ACTIVATION_UTC:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import leadpilot.serviceit_vps_native_observer; print('READY')"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 20s

  coordinator:
    <<: *base
    # Poll-only RouterAI; no Bitrix outgoing-event token or GigaChat.
    # System default TLS validation stays enabled.
    command: ["python", "-m", "leadpilot.serviceit_vps_worker", "--loop"]
    environment:
      <<: *common-env
      SERVICEIT_VPS_INTAKE_ENABLED: "NO"
      # OFF until the isolated browser+egress-proxy passes live sandbox checks.
      SERVICEIT_VPS_BROWSER_RESEARCH_ENABLED: "${SERVICEIT_VPS_BROWSER_RESEARCH_ENABLED:-NO}"
      SERVICEIT_VPS_BROWSER_PROXY_ISOLATION_VERIFIED: "${SERVICEIT_VPS_BROWSER_PROXY_ISOLATION_VERIFIED:-NO}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from leadpilot.serviceit_vps_pg_queue import postgres_settings; assert postgres_settings(os.environ)['host']=='127.0.0.1'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  serviceit_pg_password:
    file: "${SERVICEIT_VPS_SECRETS_DIR:?private secrets directory required}/pg_password"
  serviceit_bitrix_webhook:
    file: "${SERVICEIT_VPS_SECRETS_DIR:?private secrets directory required}/bitrix_webhook"
  serviceit_routerai_key:
    file: "${SERVICEIT_VPS_SECRETS_DIR:?private secrets directory required}/routerai_key"

