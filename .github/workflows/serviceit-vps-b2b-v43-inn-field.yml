name: ServiceIT V43 signed B2B INN only exact 3 cards preview apply readback
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-v43-b2b-inn-field-exclusive
  cancel-in-progress: false
jobs:
  inn-field:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      (
        github.event.comment.body == 'SERVICEIT_B2B_V43_INN_PREVIEW_489' ||
        github.event.comment.body == 'SERVICEIT_B2B_V43_INN_APPLY_489' ||
        github.event.comment.body == 'SERVICEIT_B2B_V43_INN_READBACK_489'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      COMMAND: "${{ github.event.comment.body }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin strictly scoped source, source hashes and owner SSH
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND" in
            SERVICEIT_B2B_V43_INN_PREVIEW_489) mode=preview ;;
            SERVICEIT_B2B_V43_INN_APPLY_489) mode=apply ;;
            SERVICEIT_B2B_V43_INN_READBACK_489) mode=readback ;;
            *) exit 2 ;;
          esac
          install -d -m 0700 "$RUNNER_TEMP/v43"
          printf '%s\n' "$mode" > "$RUNNER_TEMP/v43/mode"
          script=ops/serviceit_vps_b2b_v43_inn_field.py
          [[ "$(git hash-object "$script")" == 4fcabbb43c8e72390609fa48a4e10e1edb6f01f7 ]]
          python -m py_compile "$script"
          names=(serviceit_enrichment_worker.py serviceit_b2b_v20_versioned.py
            serviceit_b2b_dossier_consistency_worker_v37.py serviceit_vps_worker.py)
          blobs=(793c64e5650229294c274bf1ddf528e3ddeab117 7565cde3042a27e5ac9e73c8b54f4a346dd02e4b e12a52da95aaa40670a92adf26664d187bc7f2bc 5e240eb920d6b33880303fa08c84699bcd4d19dd)
          : > "$RUNNER_TEMP/v43/module-shas"
          for i in "${!names[@]}"; do
            name="leadpilot/${names[$i]}"
            [[ "$(git hash-object "$name")" == "${blobs[$i]}" ]]
            sha256sum "$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v43/module-shas"
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v43/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v43/hosts"
          chmod 0600 "$RUNNER_TEMP/v43/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v43/hosts" >/dev/null
      - name: Signed buyer identity, one INN field only, no other CRM change
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v43/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t hashes < "$RUNNER_TEMP/v43/module-shas"
          [[ "${#hashes[@]}" == 4 ]]
          checked=()
          for v in "${hashes[@]}"; do
            [[ "$v" =~ ^[0-9a-f]{64}$ ]]
            checked+=("'$v'")
          done
          mode="$(cat "$RUNNER_TEMP/v43/mode")"
          [[ "$mode" =~ ^(preview|apply|readback)$ ]]
          set +e
          ssh -T -i "$RUNNER_TEMP/v43/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - '$mode' ${checked[*]}" \
            < ops/serviceit_vps_b2b_v43_inn_field.py \
            > "$RUNNER_TEMP/v43/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V43_INN_[A-Z0-9_]{1,90}=[A-Z0-9_]{1,90}$' \
            "$RUNNER_TEMP/v43/status" | head -55 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V43_INN_RUNTIME_MODULE_SHA_MATCH=YES' "$RUNNER_TEMP/v43/status"
          grep -qx 'V43_INN_CARDS_CHECKED=3' "$RUNNER_TEMP/v43/status"
          grep -qx 'V43_INN_SUCCESSFUL=3' "$RUNNER_TEMP/v43/status"
          if [[ "$mode" != apply ]]; then
            grep -qx 'V43_INN_CRM_WRITES_POSSIBLE=NO' "$RUNNER_TEMP/v43/status"
          fi
