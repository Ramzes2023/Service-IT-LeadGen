name: ServiceIT B2B verified cards native queue and 9 AI fields READ ONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-native-ai-readback
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 314 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_B2B_NATIVE_AI_READBACK_READONLY_314'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - name: Pin production SSH without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/b2b-readback"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/b2b-readback/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/b2b-readback/known_hosts"
          chmod 600 "$RUNNER_TEMP/b2b-readback/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/b2b-readback/known_hosts" >/dev/null
      - name: Inspect live PG receipts and Bitrix fields for exact verified B2B cards
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/b2b-readback/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-readback/known_hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'python3 -' > "$RUNNER_TEMP/b2b-readback/status" <<'PY'
          import subprocess,re
          code = """
          import os,httpx
          from leadpilot.serviceit_vps_pg_queue import db,secret_file
          from leadpilot.serviceit_b2b_hold_ai_fields import AI_FIELDS
          from leadpilot.serviceit_b2b_positive_control import positive_duplicate_control
          from leadpilot.b2b_github_to_bitrix import bitrix_call,SIGNAL
          from leadpilot.bitrix_metadata_audit import validate_webhook
          with db(dict(os.environ)) as connection:
              with connection.cursor() as cur:
                  cur.execute("SELECT state,count(*) FROM serviceit_vps_b2b_inbox GROUP BY state")
                  counts=dict(cur.fetchall())
                  cur.execute("SELECT source_id,card_id FROM serviceit_vps_b2b_inbox WHERE state='VERIFIED' AND card_id IS NOT NULL ORDER BY received_at LIMIT 12")
                  receipts=cur.fetchall()
                  cur.execute("SELECT count(*) FROM serviceit_vps_b2b_inbox WHERE state='VERIFIED'")
                  total=cur.fetchone()[0]
                  cur.execute("SELECT q.status,count(*) FROM serviceit_vps_new_cards q JOIN serviceit_vps_b2b_inbox b ON b.card_id=q.card_id AND b.state='VERIFIED' GROUP BY q.status")
                  queue=dict(cur.fetchall())
                  cur.execute("SELECT count(*) FROM serviceit_vps_b2b_inbox b WHERE b.state='VERIFIED' AND b.card_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM serviceit_vps_new_cards q WHERE q.card_id=b.card_id)")
                  missing=cur.fetchone()[0]
          print("B2B_AI_VERIFIED_RECEIPTS="+str(total))
          print("B2B_AI_UNCERTAIN="+str(counts.get('POST_UNCERTAIN',0)))
          print("B2B_AI_PENDING="+str(counts.get('PENDING',0)))
          print("B2B_AI_QUEUE_DONE="+str(queue.get('DONE',0)))
          print("B2B_AI_QUEUE_PENDING="+str(queue.get('PENDING',0)))
          print("B2B_AI_QUEUE_REVIEW="+str(queue.get('REVIEW',0)))
          print("B2B_AI_QUEUE_UNCERTAIN="+str(queue.get('UNCERTAIN',0)))
          print("B2B_AI_QUEUE_RUNNING="+str(queue.get('RUNNING',0)))
          print("B2B_AI_QUEUE_MISSING="+str(missing))
          assert total<=12,'TOO_MANY_RECEIPTS_FOR_BOUNDED_AUDIT'
          if total==0:
              print("B2B_AI_NO_VERIFIED=YES")
              raise SystemExit(0)
          base=validate_webhook(secret_file(dict(os.environ),'SERVICEIT_BITRIX_WEBHOOK'))
          exact=0
          fullnine=0
          partialnine=0
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=20) as client:
              assert positive_duplicate_control(client,base)
              for source,card in receipts:
                  result=bitrix_call(client,base,'crm.item.get',
                      {'entityTypeId':1062,'id':int(card),'useOriginalUfNames':'Y'})
                  item=result['result'].get('item')
                  assert isinstance(item,dict)
                  assert str(item.get('id'))==str(card)
                  assert str(item.get('entityTypeId'))=='1062'
                  assert str(item.get('categoryId'))=='21'
                  assert item.get(SIGNAL)==source
                  exact+=1
                  if all(isinstance(item.get(k),str) and item.get(k).strip()
                         for k in AI_FIELDS):
                      fullnine+=1
                  else:
                      partialnine+=1
          print("B2B_AI_CRM_EXACT="+str(exact))
          print("B2B_AI_NINE_FIELDS_FULL="+str(fullnine))
          print("B2B_AI_NINE_FIELDS_PARTIAL="+str(partialnine))
          print("B2B_AI_READBACK_DONE=YES")
          """
          compile(code,'<b2b-native-ai-readonly>','exec')
          p=subprocess.run(['docker','exec','serviceit-b2b-vps-writer-1',
             'python','-c',code],stdin=subprocess.DEVNULL,
             stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=130)
          for line in p.stdout.splitlines():
              if re.fullmatch(r'B2B_AI_[A-Z0-9_]+=(?:YES|NO|[0-9]+)',line):
                  print(line,flush=True)
          if p.returncode!=0:
              print('B2B_AI_AUDIT_BLOCKED=YES',flush=True)
              raise SystemExit(2)
          PY
          grep -E '^B2B_AI_[A-Z0-9_]+=(YES|NO|[0-9]+)$' "$RUNNER_TEMP/b2b-readback/status"
          grep -qx 'B2B_AI_READBACK_DONE=YES' "$RUNNER_TEMP/b2b-readback/status" ||
            grep -qx 'B2B_AI_NO_VERIFIED=YES' "$RUNNER_TEMP/b2b-readback/status"
      - name: Post only aggregate status, never card IDs or CRM contents
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/b2b-readback/status"
          summary="$(grep -E '^B2B_AI_[A-Z0-9_]+=(YES|NO|[0-9]+)$' "$f" 2>/dev/null | head -25 || true)"
          [[ -n "$summary" ]] || summary='B2B_AI_READBACK_UNVERIFIED=YES'
          msg="$(printf 'B2B verified card -> native AI queue -> 9 fields LIVE READONLY:\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nNo CRM/PG/container mutations, no customer data or IDs printed.' "$summary" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/314/comments" -X POST --raw-field "body=$msg" >/dev/null || true
