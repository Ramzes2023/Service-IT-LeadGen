# Temporary two-secret READONLY Compose stack for corporate VPS.
# This is NOT the full live automation; it never enables CRM writes, AI, intake, or polling.
# It uses only the PostgreSQL password and Bitrix REST webhook already installed.
name: serviceit-leadgen-vps-readonly

x-restricted: &restricted
  image: serviceit-vps:readonly
  pull_policy: never
  restart: unless-stopped
  network_mode: host
  user: "10001:10001"
  read_only: true
  init: true
  pids_limit: 128
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=32m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  ingress:
    <<: *restricted
    command:
      - python
      - -m
      - uvicorn
      - leadpilot.serviceit_vps_ingress:app
      - --host
      - "127.0.0.1"
      - --port
      - "18780"
      - --workers
      - "1"
      - --no-access-log
    environment:
      SERVICEIT_VPS_INTAKE_ENABLED: "NO"
      SERVICEIT_VPS_WRITER_MODE: "READONLY"
      SERVICEIT_VPS_CUTOVER_AUTHORIZED: "NO"
      SERVICEIT_VPS_POLL_ENABLED: "NO"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://127.0.0.1:18780/health', timeout=3); assert r.status_code==200 and r.json()['crm_writer_enabled'] is False"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  coordinator:
    <<: *restricted
    command: ["python", "-m", "leadpilot.serviceit_vps_worker", "--loop"]
    environment:
      SERVICEIT_PG_HOST: "127.0.0.1"
      SERVICEIT_PG_PORT: "5432"
      SERVICEIT_PG_DB: leadgen
      SERVICEIT_PG_USER: leadgen
      SERVICEIT_PG_PASSWORD_FILE: /run/secrets/serviceit_pg_password
      SERVICEIT_BITRIX_WEBHOOK_FILE: /run/secrets/serviceit_bitrix_webhook
      SERVICEIT_VPS_INTAKE_ENABLED: "NO"
      SERVICEIT_VPS_WRITER_MODE: "READONLY"
      SERVICEIT_VPS_CUTOVER_AUTHORIZED: "NO"
      SERVICEIT_VPS_OLD_GH_WRITERS_DISABLED_ACK: "NO"
      SERVICEIT_VPS_POLL_ENABLED: "NO"
      SERVICEIT_WORKER_MODEL_PRIVACY_APPROVED: "NO"
      SERVICEIT_ROUTERAI_PRIVACY_APPROVED: "NO"
    secrets:
      - serviceit_pg_password
      - serviceit_bitrix_webhook
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from leadpilot.serviceit_vps_pg_queue import postgres_settings; assert postgres_settings(os.environ)['host']=='127.0.0.1'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  serviceit_pg_password:
    file: /etc/serviceit/secrets/pg_password
  serviceit_bitrix_webhook:
    file: /etc/serviceit/secrets/bitrix_webhook
