name: ServiceIT VPS two-secret READONLY Compose validation

on:
  pull_request:
    paths:
      - "deploy/serviceit-vps-two-secret-readonly.compose.yml"
      - "deploy/serviceit-vps-two-secret-readonly-switch.sh"
      - "docs/SERVICEIT_VPS_TWO_SECRET_READONLY_SWITCH.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check script syntax, flags and Compose shape (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/serviceit-vps-two-secret-readonly-switch.sh
          docker compose -f deploy/serviceit-vps-two-secret-readonly.compose.yml config --quiet
          config="$(docker compose -f deploy/serviceit-vps-two-secret-readonly.compose.yml config)"
          grep -Fq 'serviceit-vps:readonly' <<< "$config"
          grep -Fq 'SERVICEIT_VPS_WRITER_MODE: READONLY' <<< "$config"
          grep -Fq 'SERVICEIT_VPS_INTAKE_ENABLED: "NO"' <<< "$config"
          grep -Fq 'SERVICEIT_VPS_POLL_ENABLED: "NO"' <<< "$config"
          grep -Fq 'SERVICEIT_VPS_CUTOVER_AUTHORIZED: "NO"' <<< "$config"
          echo "READONLY_TWO_SECRET_COMPOSE_STATIC=PASS"
