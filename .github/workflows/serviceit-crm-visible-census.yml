name: ServiceIT full visible CRM pagination census (READ ONLY)
on:
  schedule:
    - cron: '27 7 * * *'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: serviceit-visible-census-readonly
  cancel-in-progress: false

jobs:
  crm-scope-exhaustion:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'issue_comment' &&
        github.actor == 'Ramzes2023' &&
        github.event.issue.number == 200 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'SERVICEIT_CRM_VISIBLE_CENSUS_ONCE_V1'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Exhaust bounded CRM visible ID pages without exporting customer data
        run: python -m leadpilot.serviceit_crm_visible_census
