name: ServiceIT own LeadGen STOP list AUTO (new cards only)
on:
  repository_dispatch:
    types: [serviceit_bitrix_item_add_v1]
  schedule:
    - cron: '13,33,53 * * * *'
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: serviceit-own-signal-stop-one-at-time
  cancel-in-progress: false

jobs:
  own-stop:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      vars.SERVICEIT_VPS_CUTOVER_ACTIVE != 'YES' &&
      (github.event_name != 'issue_comment' ||
       (github.actor == 'Ramzes2023' &&
        github.event.issue.number == 200 &&
        !github.event.issue.pull_request &&
        github.event.comment.body == 'SERVICEIT_OWN_SIGNAL_STOP_LIVE_ONCE_V1'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SERVICEIT_GH_LEDGER_KEY: ${{ secrets.SERVICEIT_GH_LEDGER_KEY }}
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      SERVICEIT_BITRIX_EVENT_BRIDGE_KEY: ${{ secrets.SERVICEIT_BITRIX_EVENT_BRIDGE_KEY }}
      SERVICEIT_BITRIX_POLL_START_UTC: ${{ vars.SERVICEIT_BITRIX_POLL_START_UTC }}
      SERVICEIT_OWN_SIGNAL_STOP_ENABLED: YES_1062_21_OWN_SIGNAL_STOP_NOTES
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply independent ServiceIT-only STOP rules to future signals
        run: python -m leadpilot.serviceit_own_signal_stop_auto
