# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT isolate masked request exception
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-manager-workspace-audit.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-manager-workspace-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-manager-workspace-app python -B -' <<'APP_AUDIT'
          import sys,inspect
          import automation as a
          print(inspect.getsource(a.request),flush=True)
          def trace(frame,event,arg):
           if event=="exception" and frame.f_code.co_filename.endswith("/automation.py"):
            print("EXCEPTION_POINT="+frame.f_code.co_name+":"+str(frame.f_lineno)+":"+arg[0].__name__,flush=True)
           return trace
          sys.settrace(trace)
          try:
           result=a.api(a.read("auth.json")["access_token"],"crm.item.list",entityTypeId=1062,useOriginalUfNames="Y",filter={"categoryId":21,">id":7},order={"id":"ASC"},select=["*"],start=0)
           print("PRODUCTION_LIST_OK="+str(len(result["items"])))
          except a.Failure:pass
          finally:sys.settrace(None)
          APP_AUDIT
