name: ServiceIT B2B V26 preview or one-use PG-only superseded legacy summary fence closure
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v26-superseded-fence
  cancel-in-progress: false
jobs:
  first:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      (github.event.comment.body == 'SERVICEIT_B2B_V26_FIRST_PREVIEW_489' ||
       github.event.comment.body == 'SERVICEIT_B2B_V26_FIRST_ONEUSE_PG_ONLY_489')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      COMMENT: "${{ github.event.comment.body }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reviewed exact PG-only supersession script and pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          reviewed='a9bfe5ce5c1087f1c36b2ae72e72ad4fdaacbbf2'
          git cat-file -e "$reviewed^{commit}"
          script=ops/serviceit_vps_b2b_v26_supersede_native_summary.py
          git diff --quiet "$reviewed" HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v26"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v26/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v26/hosts"
          chmod 0600 "$RUNNER_TEMP/v26/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v26/hosts" >/dev/null
      - name: Preview then owner-opt-in one-use PG history status acknowledgement (NO CRM write)
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMENT" in
            SERVICEIT_B2B_V26_FIRST_PREVIEW_489) mode=--preview ;;
            SERVICEIT_B2B_V26_FIRST_ONEUSE_PG_ONLY_489) mode=--apply ;;
            *) exit 2 ;;
          esac
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v26/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          pins=()
          for file in serviceit_vps_native_fence.py serviceit_vps_b2b_dossier_v11_worker.py serviceit_b2b_v19_backfill.py serviceit_vps_worker.py; do
            sha="$(sha256sum "leadpilot/$file" | cut -d' ' -f1)"
            [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
            pins+=("'$sha'")
          done
          set +e
          ssh -T -i "$RUNNER_TEMP/v26/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - $mode ${pins[*]}" \
            < ops/serviceit_vps_b2b_v26_supersede_native_summary.py \
            > "$RUNNER_TEMP/v26/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V26_[A-Z0-9_]+=(YES|NO|PREVIEW|APPLY|NEEDS_REVIEW)$' \
            "$RUNNER_TEMP/v26/status" | head -25 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V26_CODE_AND_GATES=YES' "$RUNNER_TEMP/v26/status"
          grep -qx 'V26_SIGNED_FIRST=YES' "$RUNNER_TEMP/v26/status"
          grep -qx 'V26_NEWER_V11_SUPERSEDES_OLD=YES' "$RUNNER_TEMP/v26/status"
          grep -qx 'V26_CRM_WRITES=NO' "$RUNNER_TEMP/v26/status"
          if [[ "$mode" == "--apply" ]]; then
            grep -qx 'V26_PG_STATUS_UPDATED=YES' "$RUNNER_TEMP/v26/status"
            grep -qx 'V26_HISTORIC_RECEIPT_STATUS=NEEDS_REVIEW' "$RUNNER_TEMP/v26/status"
          else
            grep -qx 'V26_PG_STATUS_UPDATED=NO' "$RUNNER_TEMP/v26/status"
          fi
