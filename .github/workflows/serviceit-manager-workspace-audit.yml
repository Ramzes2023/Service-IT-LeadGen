# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT inspect first background card requests
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-manager-workspace-audit.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-manager-workspace-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'docker exec -i serviceit-manager-workspace-app python -B -' <<'APP_AUDIT'
          import json
          import automation as a
          token=a.read("auth.json")["access_token"]
          old=a.api
          def api(token,method,**kwargs):
           try:
            r=old(token,method,**kwargs)
            print("METHOD_OK="+method,flush=True)
            return r
           except Exception as e:
            print("METHOD_FAILED="+method+":"+str(e),flush=True)
            raise
          a.api=api
          rows=a.api(token,"crm.item.list",entityTypeId=1062,useOriginalUfNames="Y",filter={"categoryId":21,">id":7},order={"id":"ASC"},select=["*"],start=0)["items"]
          item=rows[0]
          print("FIRST_CARD="+str(item["id"]),flush=True)
          for kind in ["call","finance"]:
           found=a.api(token,"crm.activity.list",filter={"OWNER_TYPE_ID":1062,"OWNER_ID":item["id"],"ORIGINATOR_ID":"serviceit_workspace_app_v1","ORIGIN_ID":"serviceit-workspace:"+str(item["id"])+":"+kind},select=["ID","COMPLETED"])
           if len(found)==1:
            a.api(token,"crm.activity.configurable.update",id=int(found[0]["ID"]),fields={"completed":False},layout=a.layout(item,kind))
            a.api(token,"crm.activity.configurable.get",id=int(found[0]["ID"]))
          print("FIRST_CARD_VERIFIED=YES")
          APP_AUDIT
