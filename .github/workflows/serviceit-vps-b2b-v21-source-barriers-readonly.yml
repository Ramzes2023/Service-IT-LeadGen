name: ServiceIT B2B V21 four signed public source robots and document links READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v21-source-barriers
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V21_SOURCES_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source-hash pin and strict SSH host
        shell: bash
        run: |
          set -euo pipefail
          reviewed='8f020d84cf30637f8997134eac5a2677bdc39ac9'
          git cat-file -e "$reviewed^{commit}"
          script=ops/serviceit_vps_b2b_v21_source_barriers_readonly.py
          git diff --quiet "$reviewed" HEAD -- "$script"
          python -m py_compile "$script"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v21-source"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v21-source/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v21-source/hosts"
          chmod 0600 "$RUNNER_TEMP/v21-source/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v21-source/hosts" >/dev/null
      - name: Four signed source URLs HTTPS robots and attachment links; no writes
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v21-source/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/v21-source/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
             "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
             < ops/serviceit_vps_b2b_v21_source_barriers_readonly.py \
             > "$RUNNER_TEMP/v21-source/result" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V21_SOURCE_[A-Z0-9_]+=(YES|NO|[A-Z0-9_]{4,75}|[0-9]{1,3})$' \
               "$RUNNER_TEMP/v21-source/result" | head -35 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V21_SOURCE_SIGNED_FOUR=YES' "$RUNNER_TEMP/v21-source/result"
          grep -qx 'V21_SOURCE_CRM_WRITES=NO' "$RUNNER_TEMP/v21-source/result"
          grep -qx 'V21_SOURCE_PAID_AI_CALLS=NO' "$RUNNER_TEMP/v21-source/result"
