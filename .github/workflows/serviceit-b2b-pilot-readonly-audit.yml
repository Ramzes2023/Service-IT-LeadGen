name: ServiceIT B2B pilot read-only post-failure trace

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  audit-without-any-write:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.event.issue.number == 83 &&
      !github.event.issue.pull_request &&
      github.actor == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_SINGLE_HOLD_READONLY_AUDIT_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SERVICEIT_BITRIX_WEBHOOK: ${{ secrets.SERVICEIT_BITRIX_WEBHOOK }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read original review, hold payload, Bitrix duplicate and ledger, never POST
        run: python -m leadpilot.serviceit_b2b_pilot_readonly_audit "$GITHUB_EVENT_PATH"
