name: ServiceIT B2B V23 exact four real primary source preview or guarded additive CRM readback
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v23-oneuse
  cancel-in-progress: false
jobs:
  four:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      (github.event.comment.body == 'SERVICEIT_B2B_V23_FOUR_PREVIEW_489' ||
       github.event.comment.body == 'SERVICEIT_B2B_V23_FOUR_ONEUSE_APPLY_489')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      COMMENT: "${{ github.event.comment.body }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check reviewed exact V23 script and live source SHA without secrets
        shell: bash
        run: |
          set -euo pipefail
          reviewed='4de03b4c3d0722a04a5449d5ecdc618426e988e2'
          git cat-file -e "$reviewed^{commit}"
          src=ops/serviceit_vps_b2b_v23_real_primary_backfill.py
          git diff --quiet "$reviewed" HEAD -- "$src"
          python -m py_compile "$src"
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v23"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v23/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v23/hosts"
          chmod 0600 "$RUNNER_TEMP/v23/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v23/hosts" >/dev/null
      - name: Preview or one-use additive source-verified Bitrix update
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMENT" in
            SERVICEIT_B2B_V23_FOUR_PREVIEW_489) mode=--preview ;;
            SERVICEIT_B2B_V23_FOUR_ONEUSE_APPLY_489) mode=--apply ;;
            *) exit 2 ;;
          esac
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v23/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          files=(serviceit_b2b_v19_backfill.py serviceit_b2b_routerai_deep.py serviceit_vps_worker.py)
          pins=()
          for file in "${files[@]}"; do
            sha="$(sha256sum "leadpilot/$file" | cut -d' ' -f1)"
            [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
            pins+=("'$sha'")
          done
          [[ "${#pins[@]}" == 3 ]]
          set +e
          ssh -T -i "$RUNNER_TEMP/v23/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - $mode ${pins[*]}" \
            < ops/serviceit_vps_b2b_v23_real_primary_backfill.py \
            > "$RUNNER_TEMP/v23/output" 2>/dev/null
          rc=$?
          set -e
          grep -E '^V23_[A-Z0-9_]+=(YES|NO|[0-9]{1,3}|[A-Z0-9_]{4,80})$' \
              "$RUNNER_TEMP/v23/output" | head -35 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V23_EXACT_CODE_AND_GATES=YES' "$RUNNER_TEMP/v23/output"
          grep -qx 'V23_SIGNED_FOUR=YES' "$RUNNER_TEMP/v23/output"
          grep -qx "V23_MODE=${mode#--}" "$RUNNER_TEMP/v23/output" || \
            grep -qx "V23_MODE=$( [[ "$mode" == "--apply" ]] && echo APPLY || echo PREVIEW )" "$RUNNER_TEMP/v23/output"
          grep -q '^V23_CRM_VERIFIED_UPDATES=[0-4]$' "$RUNNER_TEMP/v23/output"
          ! grep -q '^V23_CRM_OUTCOME=UNVERIFIED$' "$RUNNER_TEMP/v23/output"
