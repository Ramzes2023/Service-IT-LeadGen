name: ServiceIT B2B exact V11 blocker and recent CRM READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-exact-receipt-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_EXACT_V11_BLOCKER_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline check exact audited script syntax and source digests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_exact_receipt_audit.py
          python -m py_compile leadpilot/serviceit_vps_b2b_bridge.py
          python -m py_compile leadpilot/serviceit_vps_b2b_dossier_v11_worker.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/b2b-exact-receipt"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/b2b-exact-receipt/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/b2b-exact-receipt/hosts"
          chmod 0600 "$RUNNER_TEMP/b2b-exact-receipt/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/b2b-exact-receipt/hosts" >/dev/null
      - name: Read current coordinator image and five immutable source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/b2b-exact-receipt/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-exact-receipt/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'bash -s' \
            > "$RUNNER_TEMP/b2b-exact-receipt/baseline" 2>/dev/null <<'REMOTE'
          set -euo pipefail
          core=serviceit-leadgen-vps-coordinator-1
          id="$(docker inspect --format '{{.Image}}' "$core")"
          [[ "$id" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$(docker image inspect --format '{{.Id}}' "$id")" == "$id" ]]
          [[ "$(docker inspect --format '{{.State.Running}}' "$core")" == true ]]
          printf 'B2B_BASELINE_IMAGE=%s\n' "$id"
          files=(serviceit_vps_worker.py serviceit_vps_b2b_deep_research.py
            serviceit_b2b_public_mirrors.py serviceit_b2b_dossier_v11.py
            serviceit_vps_b2b_dossier_v11_worker.py)
          for name in "${files[@]}"; do
            hash="$(docker exec "$core" sha256sum "/app/leadpilot/$name")"
            hash="${hash%% *}"
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
            printf 'B2B_BASELINE_%s=%s\n' "$name" "$hash"
          done
          [[ "$(docker inspect --format '{{.Image}}' "$core")" == "$id" ]]
          REMOTE
          file="$RUNNER_TEMP/b2b-exact-receipt/baseline"
          [[ "$(wc -l < "$file")" == 6 ]]
          grep -xE 'B2B_BASELINE_IMAGE=sha256:[a-f0-9]{64}|B2B_BASELINE_(serviceit_vps_worker|serviceit_vps_b2b_deep_research|serviceit_b2b_public_mirrors|serviceit_b2b_dossier_v11|serviceit_vps_b2b_dossier_v11_worker)\.py=[a-f0-9]{64}' "$file"
      - name: Read exact V11 blockers and recent CRM without writes
        shell: bash
        run: |
          set -euo pipefail
          hash1="$(sha256sum leadpilot/serviceit_vps_b2b_dossier_v11_worker.py | cut -d' ' -f1)"
          hash2="$(sha256sum leadpilot/serviceit_vps_b2b_bridge.py | cut -d' ' -f1)"
          [[ "$hash1" =~ ^[a-f0-9]{64}$ && "$hash2" =~ ^[a-f0-9]{64}$ ]]
          set +e
          ssh -T -i "$RUNNER_TEMP/b2b-exact-receipt/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-exact-receipt/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - '$hash1'" \
            < ops/serviceit_vps_b2b_exact_receipt_audit.py \
            > "$RUNNER_TEMP/b2b-exact-receipt/status" 2>/dev/null
          rc=$?
          ssh -T -i "$RUNNER_TEMP/b2b-exact-receipt/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/b2b-exact-receipt/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-b2b-vps-writer-1 python -B - --writer '$hash2'" \
            < ops/serviceit_vps_b2b_exact_receipt_audit.py \
            >> "$RUNNER_TEMP/b2b-exact-receipt/status" 2>/dev/null
          writer_rc=$?
          set -e
          # Only numeric IDs, statuses, counts and proof booleans; never raw data.
          grep -E '^B2B_EXACT_[A-Z0-9_]{1,80}=(ABSENT|PENDING|POST_UNCERTAIN|VERIFIED|EXISTING|REVIEW|RESERVED|WRITE_INTENT|NO_CHANGE|CONFLICT|UNCERTAIN|NONE|YES|NO|[0-9]{1,10})$' "$RUNNER_TEMP/b2b-exact-receipt/status" || true
          [[ "$rc" == 0 && "$writer_rc" == 0 ]]
          grep -qx 'B2B_EXACT_WRITER_CRM_WRITES=0' "$RUNNER_TEMP/b2b-exact-receipt/status"
          grep -qx 'B2B_EXACT_CRM_WRITES=0' "$RUNNER_TEMP/b2b-exact-receipt/status"
          grep -qx 'B2B_EXACT_PG_WRITES=0' "$RUNNER_TEMP/b2b-exact-receipt/status"
