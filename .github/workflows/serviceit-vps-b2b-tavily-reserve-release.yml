name: ServiceIT B2B Tavily Mini gap-only reserve
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-vps-b2b-tavily-reserve-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v37-search-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' && github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Fetch exact reviewed public repository revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet .
          git remote add origin https://github.com/Ramzes2023/Service-IT-LeadGen.git
          git fetch --no-tags origin main
          git checkout --quiet --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Verify new and previous Tavily reserve module hashes
        shell: bash
        run: |
          set -euo pipefail
          reviewed="$GITHUB_SHA"
          old='b8be50e'
          eis='98ffb17'
          git cat-file -e "$reviewed^{commit}"
          git cat-file -e "$old^{commit}"
          names=(serviceit_vps_worker.py serviceit_vps_b2b_deep_research.py serviceit_vps_b2b_dossier_v11_worker.py serviceit_b2b_v19_backfill.py serviceit_b2b_tavily_research_mini_v47.py)
          install -d -m 0700 "$RUNNER_TEMP/v37-release"
          : > "$RUNNER_TEMP/v37-release/new-hashes"
          : > "$RUNNER_TEMP/v37-release/old-hashes"
          for name in "${names[@]}"; do
            python -m py_compile "leadpilot/$name"
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v37-release/new-hashes"
          done
          for i in 0 1 2 3; do
            base="$old"
            if [[ "$i" == 2 ]]; then base="$eis"; fi
            git show "$base:leadpilot/${names[$i]}" | sha256sum | cut -d' ' -f1 >> "$RUNNER_TEMP/v37-release/old-hashes"
          done
          script=ops/serviceit_vps_b2b_v37_quality_release.py
          python -m py_compile "$script"
          sha256sum "$script" | cut -d' ' -f1 > "$RUNNER_TEMP/v37-release/script-sha"
          [[ "$(wc -l < "$RUNNER_TEMP/v37-release/new-hashes")" == 5 ]]
          [[ "$(wc -l < "$RUNNER_TEMP/v37-release/old-hashes")" == 4 ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v37-release/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v37-release/hosts"
          chmod 0600 "$RUNNER_TEMP/v37-release/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v37-release/hosts" >/dev/null
      - name: Transfer reviewed modules and release controller
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v37-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          stage="serviceit/staging/b2b-tavily-reserve-onefile-release-$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          for name in serviceit_vps_worker.py serviceit_vps_b2b_deep_research.py serviceit_vps_b2b_dossier_v11_worker.py serviceit_b2b_v19_backfill.py serviceit_b2b_tavily_research_mini_v47.py; do
            scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
              "leadpilot/$name" "$target:$stage/"
          done
          scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v37_quality_release.py "$target:$stage/activate.py"
      - name: Test modules offline and deploy coordinator with rollback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v37-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t new < "$RUNNER_TEMP/v37-release/new-hashes"
          mapfile -t old < "$RUNNER_TEMP/v37-release/old-hashes"
          [[ "${#new[@]}" == 5 && "${#old[@]}" == 4 ]]
          scriptsha="$(cat "$RUNNER_TEMP/v37-release/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          args=()
          for v in "${new[@]}" "${old[@]}"; do
            [[ "$v" =~ ^[a-f0-9]{64}$ ]]
            args+=("'$v'")
          done
          remote="bash -s -- '$GITHUB_RUN_ID' '$scriptsha' ${args[*]}"
          set +e
          ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" "$remote" \
            > "$RUNNER_TEMP/v37-release/status" <<'REMOTE'
          set -euo pipefail
          id="$1"; sha="$2"; shift 2
          [[ "$id" =~ ^[0-9]{7,16}$ && "$sha" =~ ^[a-f0-9]{64}$ && "$#" == 9 ]]
          for v in "$@"; do [[ "$v" =~ ^[a-f0-9]{64}$ ]]; done
          script="$HOME/serviceit/staging/b2b-tavily-reserve-onefile-release-$id/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$sha" "$script" | sha256sum --check --status
          python3 "$script" --tavily-reserve "$id" "$@" MISSING
          REMOTE
          rc=$?
          set -e
          grep -E '^TAVILY_RESERVE_RELEASE_[A-Z0-9_]+=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,90})$' \
            "$RUNNER_TEMP/v37-release/status" | head -30 || true
          [[ "$rc" == 0 ]]
          grep -qx 'TAVILY_RESERVE_RELEASE_VPS_LIVE_ENABLED=YES' "$RUNNER_TEMP/v37-release/status"
          grep -qx 'TAVILY_RESERVE_RELEASE_CRM_WRITES_BY_INSTALLER=NO' "$RUNNER_TEMP/v37-release/status"
      - name: Verify the new-only gap gate and preserved EIS integration
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/v37-release"
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" <<'PYCODE'
          from leadpilot.serviceit_vps_b2b_dossier_v11_worker import worker_once
          from leadpilot.serviceit_vps_worker import INTERVAL_SECONDS
          from leadpilot.serviceit_b2b_tavily_research_mini_v47 import approved, MODEL
          from leadpilot.serviceit_b2b_eis_mirrors import EIS_MIRRORS
          import inspect
          import os

          worker = inspect.getsource(worker_once)
          assert "supplement_eis_mirrors" in worker and "nominate_gap" in worker
          assert INTERVAL_SECONDS == 300 and len(EIS_MIRRORS) == 2 and MODEL == "mini"
          assert not approved(os.environ)
          print("TAVILY_RESERVE_CODE_READY_EIS_PRESERVED=YES")
          PYCODE
  activate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the checked-out Mini activation controller
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_v47_research_mini_activate.py
          python -m py_compile ops/serviceit_vps_b2b_v37_quality_release.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v47-pro"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v47-pro/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v47-pro/hosts"
          chmod 0600 "$RUNNER_TEMP/v47-pro/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v47-pro/hosts" >/dev/null
      - name: Stage source SHA pinned controllers and activate only if /usage OK
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/v47-pro/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          stage="serviceit/staging/research-mini-v47-$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/v47-pro/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          scp -i "$RUNNER_TEMP/v47-pro/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v47_research_mini_activate.py \
            ops/serviceit_vps_b2b_v37_quality_release.py "$target:$stage/"
          rc=0
          ssh -T -i "$RUNNER_TEMP/v47-pro/id" "${opts[@]}" "$target" \
            "python3 -B '$stage/serviceit_vps_b2b_v47_research_mini_activate.py'" \
            > "$RUNNER_TEMP/v47-pro/status" 2>/dev/null || rc=$?
          grep -E '^RESEARCH_MINI_[A-Z0-9_]{3,50}=[A-Z0-9_]{1,60}$' \
            "$RUNNER_TEMP/v47-pro/status" | head -25 || true
          [[ "$rc" == 0 ]]
          grep -Eq '^RESEARCH_MINI_ACTIVATION=(LIVE|ALREADY_LIVE)$' "$RUNNER_TEMP/v47-pro/status"
