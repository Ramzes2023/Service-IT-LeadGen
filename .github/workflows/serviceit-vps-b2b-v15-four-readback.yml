name: ServiceIT B2B V15 FOUR exact CRM/PG READONLY acceptance
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v15-readback
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V15_FOUR_READBACK_368'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Pin dedicated SSH identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v15-readback"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v15-readback/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v15-readback/hosts"
          chmod 0600 "$RUNNER_TEMP/v15-readback/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v15-readback/hosts" >/dev/null
      - name: Read exact four original cards and current nine fields without writes
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/v15-readback/id" \
            -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/v15-readback/hosts" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' \
            > "$RUNNER_TEMP/v15-readback/status" <<'PY'
          import os,hashlib,secrets
          import httpx
          from leadpilot.serviceit_vps_pg_queue import db,secret_file
          from leadpilot.bitrix_metadata_audit import validate_webhook
          from leadpilot.serviceit_enrichment_worker import Rest,normalized,validate_identity
          from leadpilot.serviceit_b2b_hold_ai_fields import AI_FIELDS,PREFIX
          from leadpilot.serviceit_vps_b2b_dossier_v11_worker import compute_digest
          from leadpilot.serviceit_vps_b2b_deep_research import safe_notice

          env=dict(os.environ)
          webhook=secret_file(env,"SERVICEIT_BITRIX_WEBHOOK")
          validate_webhook(webhook)
          with db(env) as conn:
              with conn.transaction():
                  with conn.cursor() as cur:
                      cur.execute("SET TRANSACTION READ ONLY")
                      cur.execute("""
                        SELECT b.card_id,b.source_id,b.notice_json,
                               v14.status,v14.before_fields,v14.after_fields,
                               v15.status,v15.before_fields,v15.after_fields,
                               v15.salt,v15.digest,v15.source_hash
                        FROM serviceit_vps_b2b_public_v15_receipts v15
                        JOIN serviceit_vps_b2b_public_v14_receipts v14
                          ON v14.card_id=v15.card_id
                        JOIN serviceit_vps_b2b_inbox b
                          ON b.card_id=v15.card_id AND b.state='VERIFIED'
                        ORDER BY b.received_at,b.source_id
                      """)
                      records=cur.fetchall()
          print("V15_AUDIT_FOUR="+str(len(records)),flush=True)
          ok=len(records)==4
          with httpx.Client(trust_env=False,follow_redirects=False,timeout=18) as client:
              rest=Rest(webhook,client)
              for i,row in enumerate(records,1):
                  (card,source,notice,s14,b14,a14,s15,b15,a15,
                   salt,digest,sourcehash)=row
                  label="V15_AUDIT_CARD_"+str(i)+"_"
                  try:
                      item=normalized(rest("crm.item.get",{
                          "entityTypeId":1062,"id":card,
                          "useOriginalUfNames":"Y"})["item"])
                      validate_identity(item,card)
                      safe_notice(notice,card,source,item)
                      current={k:item.get(k) for k in AI_FIELDS}
                      old=a14 if s14=="VERIFIED" else b14
                      source_ok=(sourcehash==
                          hashlib.sha256(source.encode("ascii")).hexdigest())
                      before_ok=isinstance(old,dict) and b15==old
                      unchanged_six=(isinstance(b15,dict) and
                          all(current.get(k)==b15.get(k) for k in AI_FIELDS
                              if k not in (PREFIX+"AI_FULL_REPORT",
                                           PREFIX+"AI_MANAGER_BRIEF",
                                           PREFIX+"AI_SUMMARY")))
                      archived=(isinstance(old,dict) and
                          isinstance(current.get(PREFIX+"AI_FULL_REPORT"),str)
                          and current[PREFIX+"AI_FULL_REPORT"].startswith(
                              old[PREFIX+"AI_FULL_REPORT"]))
                      state_ok=(isinstance(b15,dict) and
                          current.get(PREFIX+"AI_STATUS")==
                          b15.get(PREFIX+"AI_STATUS"))
                      if s15=="VERIFIED":
                          same=current==a15
                          digest_ok=(same and salt is not None and
                              digest is not None and secrets.compare_digest(
                                compute_digest(current,bytes(salt)),
                                bytes(digest)))
                          section=("11  ПУБЛИЧНОЕ ДОСЬЕ V15" in
                                   current[PREFIX+"AI_FULL_REPORT"])
                          accepted=bool(same and digest_ok and section
                                        and source_ok and before_ok and
                                        unchanged_six and archived and state_ok)
                      elif s15=="NO_NEW_EVIDENCE":
                          accepted=bool(current==b15 and source_ok and before_ok
                                        and unchanged_six and archived and state_ok)
                      else:
                          accepted=False
                      print(label+"RESULT="+(s15 if s15 in
                            ("VERIFIED","NO_NEW_EVIDENCE","CONFLICT","UNCERTAIN")
                            else "UNKNOWN"),flush=True)
                      print(label+"EXACT_READBACK="+(
                            "YES" if accepted else "NO"),flush=True)
                      ok=ok and accepted
                  except Exception:
                      ok=False
                      print(label+"RESULT=ERROR",flush=True)
                      print(label+"EXACT_READBACK=NO",flush=True)
          print("V15_AUDIT_SAFE_READ="+("YES" if ok else "NO"),flush=True)
          PY
          grep -E '^V15_AUDIT_([A-Z0-9_]+)=(YES|NO|ERROR|UNKNOWN|VERIFIED|NO_NEW_EVIDENCE|CONFLICT|UNCERTAIN|[0-9]{1,3})$' \
            "$RUNNER_TEMP/v15-readback/status" | head -35
          grep -qx 'V15_AUDIT_FOUR=4' "$RUNNER_TEMP/v15-readback/status"
          grep -qx 'V15_AUDIT_SAFE_READ=YES' "$RUNNER_TEMP/v15-readback/status"
