name: ServiceIT first B2B #4673971 official CBR source via free TinyFish READONLY
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-first-moex-official-cbr-readonly
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 489 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_FIRST_CBR_OFFICIAL_READONLY_489'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate reviewed no-write official-source probe and SSH identity
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_first_cbr_official_free_readonly.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/cbr-first"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/cbr-first/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/cbr-first/hosts"
          chmod 0600 "$RUNNER_TEMP/cbr-first/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/cbr-first/hosts" >/dev/null
      - name: Fetch one official CBR issuer record, compare exact signed first card, zero writes
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
               -o UserKnownHostsFile="$RUNNER_TEMP/cbr-first/hosts"
               -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/cbr-first/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_first_cbr_official_free_readonly.py \
            > "$RUNNER_TEMP/cbr-first/result" 2>/dev/null
          rc=$?
          set -e
          grep -E '^CBR_FIRST_[A-Z0-9_]+=(YES|NO|[0-9]{1,3}|[A-Z0-9_]{4,90})$' \
            "$RUNNER_TEMP/cbr-first/result" | head -20 || true
          [[ "$rc" == 0 ]]
          grep -qx 'CBR_FIRST_LIVE_GATES=YES' "$RUNNER_TEMP/cbr-first/result"
          grep -qx 'CBR_FIRST_SIGNED_TENDER_ID=YES' "$RUNNER_TEMP/cbr-first/result"
          grep -qx 'CBR_FIRST_CRM_WRITES=NO' "$RUNNER_TEMP/cbr-first/result"
          grep -qx 'CBR_FIRST_PG_WRITES=NO' "$RUNNER_TEMP/cbr-first/result"
          grep -qx 'CBR_FIRST_PAID_MODEL_CALLS=NO' "$RUNNER_TEMP/cbr-first/result"
