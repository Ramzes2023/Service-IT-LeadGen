name: ServiceIT RouterAI transport / VPN / API gateway (READ ONLY)
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
jobs:
  routerai-transport:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 148 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == 'SERVICEIT_ROUTERAI_TRANSPORT_READONLY_ONCE_V1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      SERVICEIT_AI_PROVIDER: ${{ vars.SERVICEIT_AI_PROVIDER }}
      SERVICEIT_ROUTERAI_PRIVACY_APPROVED: ${{ vars.SERVICEIT_ROUTERAI_PRIVACY_APPROVED }}
      ROUTERAI_API_KEY: ${{ secrets.SERVICEIT_ROUTERAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare signed / unsigned GET and proxy bypass, never use model tokens
        run: python -m leadpilot.serviceit_routerai_transport_readonly
