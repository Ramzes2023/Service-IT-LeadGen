# Verify removal of rejected left-side presentation, preserving stored inputs.
name: ServiceIT verify administrator background activation
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-manager-workspace-audit.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-manager-workspace-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: ${{ vars.SERVICEIT_VPS_HOST }}
      VPS_USER: ${{ vars.SERVICEIT_VPS_DEPLOY_USER }}
      VPS_SSH_KEY: ${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live card fields and document counts
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/bidzaar-audit"
          install -d -m 0700 "$stage"
          printf '%s\n' "$VPS_SSH_KEY" > "$stage/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$stage/hosts"
          chmod 0600 "$stage/"*
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes)
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'DIAGNOSTIC'
          set -euo pipefail
          docker exec -i serviceit-manager-workspace-app python -B - <<'APP_AUDIT'
          import json,time
          from pathlib import Path
          import automation as a
          state=a.read("status.json",{})
          print("TIMELINE_STATUS="+str(state.get("status","UNKNOWN")))
          print("TIMELINE_LAST_SUCCESS="+str(state.get("completed_at",0)))
          print("TIMELINE_CARDS="+str(state.get("cards",0)))
          auth=a.read("auth.json")
          print("TIMELINE_AUTH_PRESENT="+("YES" if auth else "NO"))
          if auth:
           try:
            rows=[]
            for start in range(0,10000,50):
             batch=a.api(auth["access_token"],"crm.activity.list",filter={"OWNER_TYPE_ID":1062,"ORIGINATOR_ID":"serviceit_workspace_app_v1"},select=["ID","OWNER_ID","ORIGIN_ID","COMPLETED"],start=start)
             rows.extend(batch)
             if len(batch)<50:break
            print("TIMELINE_BLOCKS="+str(len(rows)))
            closed=[r for r in rows if r.get("COMPLETED")=="Y"]
            print("TIMELINE_COMPLETED_BLOCKS="+str(len(closed)))
            print("TIMELINE_COMPLETED_IDS="+",".join(str(r["ID"]) for r in closed))
           except a.Failure as e:print("TIMELINE_CHECK_ERROR="+str(e))
          APP_AUDIT
          dir="$HOME/serviceit/manager-workspace"
          crontab -l | grep 'SERVICEIT_MANAGER_WORKSPACE_V1' | sed 's@/home/[^/]*/@/home/USER/@g'
          tail -n 30 "$dir/status.log" | grep -E '^WORKSPACE_[A-Z_]+=[A-Z0-9_]+$' || true
          /usr/bin/flock -w 300 "$dir/cycle.lock" /usr/bin/python3 "$dir/serviceit_manager_workspace_runner.py"
          DIAGNOSTIC
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            'docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -' < ops/serviceit_manager_workspace_audit.py
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          crontab -l | grep -q '^[*]/5 .*# SERVICEIT_MANAGER_WORKSPACE_V1$'
          printf 'WORKSPACE_SCHEDULE_STILL_ENABLED=YES\n'
          logfile="$HOME/serviceit/manager-workspace/status.log"
          if [[ -f "$logfile" ]]; then
            tail -n 20 "$logfile" | grep -E '^WORKSPACE_[A-Z_]+=[A-Z0-9_]+$' || true
          fi
          REMOTE
