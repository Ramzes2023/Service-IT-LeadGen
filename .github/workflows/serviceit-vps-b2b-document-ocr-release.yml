name: ServiceIT B2B public document OCR release
on:
  push:
    branches: [main]
    paths: [.github/workflows/serviceit-vps-b2b-document-ocr-release.yml]
permissions:
  contents: read
concurrency:
  group: serviceit-b2b-v37-search-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Ramzes2023/Service-IT-LeadGen' && github.actor == 'Ramzes2023'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - name: Fetch exact reviewed public repository revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet .
          git remote add origin https://github.com/Ramzes2023/Service-IT-LeadGen.git
          git fetch --no-tags origin main
          git checkout --quiet --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Verify new and previous document research module hashes
        shell: bash
        run: |
          set -euo pipefail
          reviewed="$GITHUB_SHA"
          old='b63726c'
          git cat-file -e "$reviewed^{commit}"
          git cat-file -e "$old^{commit}"
          names=(serviceit_b2b_tender_documents.py serviceit_vps_b2b_document_worker.py serviceit_b2b_pdf_ocr.py)
          install -d -m 0700 "$RUNNER_TEMP/v37-release"
          : > "$RUNNER_TEMP/v37-release/new-hashes"
          : > "$RUNNER_TEMP/v37-release/old-hashes"
          for name in "${names[@]}"; do
            python -m py_compile "leadpilot/$name"
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v37-release/new-hashes"
            if [[ "$name" == serviceit_b2b_pdf_ocr.py ]]; then
              ! git cat-file -e "$old:leadpilot/$name" 2>/dev/null
              printf '%s\n' MISSING >> "$RUNNER_TEMP/v37-release/old-hashes"
            else
              git show "$old:leadpilot/$name" | sha256sum | cut -d' ' -f1 >> "$RUNNER_TEMP/v37-release/old-hashes"
            fi
          done
          script=ops/serviceit_vps_b2b_v37_quality_release.py
          python -m py_compile "$script"
          sha256sum "$script" | cut -d' ' -f1 > "$RUNNER_TEMP/v37-release/script-sha"
          [[ "$(wc -l < "$RUNNER_TEMP/v37-release/new-hashes")" == 3 ]]
          [[ "$(wc -l < "$RUNNER_TEMP/v37-release/old-hashes")" == 3 ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v37-release/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v37-release/hosts"
          chmod 0600 "$RUNNER_TEMP/v37-release/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v37-release/hosts" >/dev/null
      - name: Transfer reviewed modules and offline OCR assets
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v37-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          stage="serviceit/staging/b2b-document-ocr-onefile-release-$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          for name in serviceit_b2b_tender_documents.py serviceit_vps_b2b_document_worker.py serviceit_b2b_pdf_ocr.py; do
            scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
              "leadpilot/$name" "$target:$stage/"
          done
          if ! ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$target" \
            "set -eu; cd serviceit/staging; cp -- b2b-document-ocr-onefile-release-43260680567/*.whl b2b-document-ocr-onefile-release-43260680567/*.traineddata '${stage#serviceit/staging/}/'"; then
            assets="$RUNNER_TEMP/v37-release/assets"
            install -d -m 0700 "$assets"
            python -m pip download --only-binary=:all: --no-deps --dest "$assets" \
              --platform manylinux_2_27_x86_64 --platform manylinux_2_17_x86_64 \
              --implementation cp --abi cp312 --python-version 3.12 \
              'pillow==13.0.0' 'pypdfium2==5.15.2' 'tesserocr==2.13.0'
            for lang in eng rus; do
              curl --fail --silent --show-error --location --max-time 35 \
                "https://deb.debian.org/debian/pool/main/t/tesseract-lang/tesseract-ocr-${lang}_4.1.0-2_all.deb" \
                -o "$RUNNER_TEMP/serviceit-${lang}.deb"
              dpkg-deb -x "$RUNNER_TEMP/serviceit-${lang}.deb" "$RUNNER_TEMP/serviceit-${lang}"
              cp "$RUNNER_TEMP/serviceit-${lang}/usr/share/tesseract-ocr/5/tessdata/$lang.traineddata" "$assets/"
            done
            scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
              "$assets/"* "$target:$stage/"
          fi
          scp -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v37_quality_release.py "$target:$stage/activate.py"
      - name: Verify OCR as the coordinator user before deployment
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v37-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t new < "$RUNNER_TEMP/v37-release/new-hashes"
          mapfile -t old < "$RUNNER_TEMP/v37-release/old-hashes"
          [[ "${#new[@]}" == 3 && "${#old[@]}" == 3 ]]
          scriptsha="$(cat "$RUNNER_TEMP/v37-release/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          args=()
          for v in "${new[@]}" "${old[@]}"; do
            [[ "$v" =~ ^[a-f0-9]{64}$ || "$v" == MISSING ]]
            args+=("'$v'")
          done
          remote="bash -s -- '$GITHUB_RUN_ID' '$scriptsha' ${args[*]}"
          set +e
          ssh -T -i "$RUNNER_TEMP/v37-release/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" "$remote" \
            > "$RUNNER_TEMP/v37-release/status" <<'REMOTE'
          set -euo pipefail
          id="$1"; sha="$2"; shift 2
          [[ "$id" =~ ^[0-9]{7,16}$ && "$sha" =~ ^[a-f0-9]{64}$ && "$#" == 6 ]]
          [[ "${!#}" == MISSING ]]
          for v in "${@:1:5}"; do [[ "$v" =~ ^[a-f0-9]{64}$ ]]; done
          script="$HOME/serviceit/staging/b2b-document-ocr-onefile-release-$id/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$sha" "$script" | sha256sum --check --status
          python3 "$script" --document-ocr "$id" "$@"
          REMOTE
          rc=$?
          set -e
          grep -E '^DOCUMENT_OCR_RELEASE_[A-Z0-9_]+=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,90})$' \
            "$RUNNER_TEMP/v37-release/status" | head -30 || true
          if [[ "$rc" != 0 ]]; then
            grep -E '^DOCUMENT_OCR_RELEASE_SMOKE_DIAGNOSTIC=' "$RUNNER_TEMP/v37-release/status" | cut -c1-360 || true
          fi
          [[ "$rc" == 0 ]]
          grep -qx 'DOCUMENT_OCR_RELEASE_VPS_LIVE_ENABLED=YES' "$RUNNER_TEMP/v37-release/status"
          grep -qx 'DOCUMENT_OCR_RELEASE_CRM_WRITES_BY_INSTALLER=NO' "$RUNNER_TEMP/v37-release/status"
      - name: Verify public document and timeline readback after deployment
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/v37-release"
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$stage/hosts" -o BatchMode=yes -o ConnectTimeout=15)
          rc=0
          ssh -T -i "$stage/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B - --quick --ocr" \
            < ops/serviceit_vps_b2b_document_depth_audit.py > "$stage/manager-status" 2>/dev/null || rc=$?
          grep -E '^DOCS_[A-Z0-9_]+=[A-Z0-9_]+$' "$stage/manager-status" || true
          [[ "$rc" == 0 ]]
          grep -qx 'DOCS_LIVE_OCR_SMOKE=YES' "$stage/manager-status"
