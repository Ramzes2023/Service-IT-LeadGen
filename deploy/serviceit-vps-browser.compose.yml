# OPTIONAL, standalone secretless Chromium research bridge.
# NEVER run until Docker bridge egress firewall + Chromium sandbox are validated.
# Keep it outside the core LIVE Compose (no CRM/PG/RouterAI/GitHub secrets).
name: serviceit-public-browser-vps

services:
  browser:
    profiles: ["browser"]
    image: serviceit-vps-public-browser:staged
    user: pwuser
    # No host networking and no externally published browser endpoint.
    ports:
      - "127.0.0.1:18785:8765"
    networks:
      - public_browser
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 1g
    shm_size: 256m
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      SERVICEIT_VPS_BROWSER_APPROVED_HOSTS: "${SERVICEIT_VPS_BROWSER_APPROVED_HOSTS:?explicit public browser hosts required}"
    command: ["python", "-m", "leadpilot.serviceit_vps_public_browser_bridge"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert b'BROWSER_BRIDGE_READY' in urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"]
      interval: 45s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  public_browser:
    driver: bridge
    # Dedicated deterministic network exclusively for this untrusted runner.
    # The host must apply explicit DROP/ALLOW egress rules to this bridge.
    driver_opts:
      com.docker.network.bridge.name: br-sit-browser
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.246.0/28
