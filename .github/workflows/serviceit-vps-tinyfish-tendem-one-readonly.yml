name: ServiceIT TinyFish one verified Tendem 4673595 READONLY pilot
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-tinyfish-tendem-one-readonly
  cancel-in-progress: false
jobs:
  pilot:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_TINYFISH_TENDEM_ONE_READONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin owner key, pre-reviewed single source and safe statuses
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_tinyfish_tendem_one_readonly.py
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/tinyfish-one-public"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/tinyfish-one-public/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/tinyfish-one-public/hosts"
          chmod 0600 "$RUNNER_TEMP/tinyfish-one-public/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/tinyfish-one-public/hosts" >/dev/null
      - name: Read ONLY one pre-reviewed public tender via installed coordinator
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/tinyfish-one-public/hosts"
            -o BatchMode=yes -o ConnectTimeout=15)
          set +e
          ssh -T -i "$RUNNER_TEMP/tinyfish-one-public/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "docker exec -i serviceit-leadgen-vps-coordinator-1 python -B -" \
            < ops/serviceit_vps_b2b_tinyfish_tendem_one_readonly.py \
            > "$RUNNER_TEMP/tinyfish-one-public/status" 2>/dev/null
          rc=$?
          set -e
          grep -E '^TINYFISH_TENDEM_(PROBE|REQUESTS|CRM_WRITES|LIVE_FLAGS_CHANGED)=[A-Z0-9_]+$' \
            "$RUNNER_TEMP/tinyfish-one-public/status" | head -4 || true
          [[ "$rc" == 0 ]]
          grep -qx 'TINYFISH_TENDEM_PROBE=VERIFIED_EXACT' "$RUNNER_TEMP/tinyfish-one-public/status"
          grep -qx 'TINYFISH_TENDEM_REQUESTS=ONE_URL' "$RUNNER_TEMP/tinyfish-one-public/status"
          grep -qx 'TINYFISH_TENDEM_CRM_WRITES=NO' "$RUNNER_TEMP/tinyfish-one-public/status"
          grep -qx 'TINYFISH_TENDEM_LIVE_FLAGS_CHANGED=NO' "$RUNNER_TEMP/tinyfish-one-public/status"
