name: ServiceIT VPS V44 Tavily OFF-by-default guarded B2B URL discovery rollout
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
concurrency:
  group: serviceit-b2b-v44-search-release
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' && github.actor == 'Ramzes2023' &&
      github.event_name == 'issue_comment' &&
       github.event.issue.number == 489 &&
       !github.event.issue.pull_request &&
       github.event.comment.user.login == 'Ramzes2023' &&
       github.event.comment.body == 'SERVICEIT_B2B_V44_TAVILY_GUARDED_RELEASE_489'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed NEW V44 and pinned pre-V44 OLD source hashes
        shell: bash
        run: |
          set -euo pipefail
          reviewed="$GITHUB_SHA"
          old='99d1adbe1aaa69e282ced8d2e4d101da35081826'
          git cat-file -e "$reviewed^{commit}"
          git cat-file -e "$old^{commit}"
          names=(serviceit_vps_b2b_deep_research.py serviceit_b2b_v19_backfill.py serviceit_b2b_v20_versioned.py serviceit_b2b_tavily_fallback_v44.py)
          install -d -m 0700 "$RUNNER_TEMP/v44-release"
          : > "$RUNNER_TEMP/v44-release/new-hashes"
          : > "$RUNNER_TEMP/v44-release/old-hashes"
          blobs=(3045108827e13342a37ffe3ef555a8d08f47083f
            b8d3476b650724595e630b17abc3ba7d8eff36f0
            d2da3f1b1a0e0c47a46fd39b1be53d7a2ec360b6
            beb5e82589ffb3b2fcb6bbdfc96371493458c4bc)
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            [[ "$(git hash-object "leadpilot/$name")" == "${blobs[$i]}" ]]
            git diff --quiet "$reviewed" HEAD -- "leadpilot/$name"
            python -m py_compile "leadpilot/$name"
            sha256sum "leadpilot/$name" | cut -d' ' -f1 >> "$RUNNER_TEMP/v44-release/new-hashes"
          done
          for n in serviceit_vps_b2b_deep_research.py serviceit_b2b_v19_backfill.py serviceit_b2b_v20_versioned.py; do
            git show "$old:leadpilot/$n" | sha256sum | cut -d' ' -f1 >> "$RUNNER_TEMP/v44-release/old-hashes"
          done
          ! git cat-file -e "$old:leadpilot/serviceit_b2b_tavily_fallback_v44.py" 2>/dev/null
          printf '%s\n' 'MISSING' >> "$RUNNER_TEMP/v44-release/old-hashes"
          script=ops/serviceit_vps_b2b_v44_tavily_guarded_release.py
          python -m py_compile "$script"
          sha256sum "$script" | cut -d' ' -f1 > "$RUNNER_TEMP/v44-release/script-sha"
          [[ "$(wc -l < "$RUNNER_TEMP/v44-release/new-hashes")" == 4 ]]
          [[ "$(wc -l < "$RUNNER_TEMP/v44-release/old-hashes")" == 4 ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v44-release/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v44-release/hosts"
          chmod 0600 "$RUNNER_TEMP/v44-release/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v44-release/hosts" >/dev/null
      - name: Transfer exactly one nonsecret file plus release controller
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v44-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          target="$VPS_USER@$VPS_HOST"
          stage="serviceit/staging/b2b-v44-onefile-release-$GITHUB_RUN_ID"
          ssh -T -i "$RUNNER_TEMP/v44-release/id" "${opts[@]}" "$target" \
            "umask 077; install -d -m 0700 '$stage'"
          for name in serviceit_vps_b2b_deep_research.py serviceit_b2b_v19_backfill.py serviceit_b2b_v20_versioned.py serviceit_b2b_tavily_fallback_v44.py; do
            scp -i "$RUNNER_TEMP/v44-release/id" "${opts[@]}" \
              "leadpilot/$name" "$target:$stage/"
          done
          scp -i "$RUNNER_TEMP/v44-release/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v44_tavily_guarded_release.py "$target:$stage/activate.py"
      - name: Offline smoke new one module and swap coordinator only with rollback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v44-release/hosts"
                -o BatchMode=yes -o ConnectTimeout=15)
          mapfile -t new < "$RUNNER_TEMP/v44-release/new-hashes"
          mapfile -t old < "$RUNNER_TEMP/v44-release/old-hashes"
          [[ "${#new[@]}" == 4 && "${#old[@]}" == 4 ]]
          scriptsha="$(cat "$RUNNER_TEMP/v44-release/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ ]]
          args=()
          for v in "${new[@]}"; do
            [[ "$v" =~ ^[a-f0-9]{64}$ ]]
            args+=("'$v'")
          done
          [[ "${old[0]}" =~ ^[a-f0-9]{64}$ && "${old[1]}" =~ ^[a-f0-9]{64}$ &&
             "${old[2]}" =~ ^[a-f0-9]{64}$ && "${old[3]}" == "MISSING" ]]
          args+=("'${old[0]}'" "'${old[1]}'" "'${old[2]}'" "'MISSING'")
          remote="bash -s -- '$GITHUB_RUN_ID' '$scriptsha' ${args[*]}"
          set +e
          ssh -T -i "$RUNNER_TEMP/v44-release/id" "${opts[@]}" "$VPS_USER@$VPS_HOST" "$remote" \
            > "$RUNNER_TEMP/v44-release/status" <<'REMOTE'
          set -euo pipefail
          id="$1"; sha="$2"; shift 2
          [[ "$id" =~ ^[0-9]{7,16}$ && "$sha" =~ ^[a-f0-9]{64}$ && "$#" == 8 ]]
          [[ "$1" =~ ^[a-f0-9]{64}$ && "$2" =~ ^[a-f0-9]{64}$ &&
             "$3" =~ ^[a-f0-9]{64}$ && "$4" =~ ^[a-f0-9]{64}$ &&
             "$5" =~ ^[a-f0-9]{64}$ && "$6" =~ ^[a-f0-9]{64}$ &&
             "$7" =~ ^[a-f0-9]{64}$ && "$8" == "MISSING" ]]
          script="$HOME/serviceit/staging/b2b-v44-onefile-release-$id/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$sha" "$script" | sha256sum --check --status
          python3 "$script" "$id" "$@"
          REMOTE
          rc=$?
          set -e
          grep -E '^V44_RELEASE_[A-Z0-9_]+=(YES|NO|NOT_NEEDED|UNVERIFIED|[A-Z0-9_]{4,90})$' \
            "$RUNNER_TEMP/v44-release/status" | head -30 || true
          [[ "$rc" == 0 ]]
          grep -qx 'V44_RELEASE_VPS_LIVE_ENABLED=YES' "$RUNNER_TEMP/v44-release/status"
          grep -qx 'V44_RELEASE_CRM_WRITES_BY_INSTALLER=NO' "$RUNNER_TEMP/v44-release/status"
