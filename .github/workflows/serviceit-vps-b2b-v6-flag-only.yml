name: ServiceIT B2B V6 flag-only update on existing image
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: serviceit-b2b-v6-flag-only-release
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'Ramzes2023/Service-IT-LeadGen' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ramzes2023' &&
      github.event.issue.number == 368 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'Ramzes2023' &&
      github.event.comment.body == 'SERVICEIT_B2B_V6_FLAG_ONLY_368'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: serviceit-vps-readonly
    env:
      VPS_HOST: "${{ vars.SERVICEIT_VPS_HOST }}"
      VPS_USER: "${{ vars.SERVICEIT_VPS_DEPLOY_USER }}"
      VPS_SSH_KEY: "${{ secrets.SERVICEIT_VPS_DEPLOY_SSH_KEY }}"
      VPS_KNOWN_HOSTS: "${{ secrets.SERVICEIT_VPS_SSH_KNOWN_HOSTS }}"
      GH_TOKEN: "${{ github.token }}"
      REPO: "${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned SSH and immutable V6 SHA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ops/serviceit_vps_b2b_v6_flag_only.py
          git cat-file -e 6124478aad06967e2d2f83e9d0ef097afefed3b4^{commit}
          git diff --quiet 6124478aad06967e2d2f83e9d0ef097afefed3b4 HEAD -- leadpilot/serviceit_vps_b2b_deep_research.py
          git show 6124478aad06967e2d2f83e9d0ef097afefed3b4:leadpilot/serviceit_vps_b2b_deep_research.py | sha256sum | cut -d ' ' -f 1 > "$RUNNER_TEMP/v6-expected"
          [[ "$(cat "$RUNNER_TEMP/v6-expected")" =~ ^[a-f0-9]{64}$ ]]
          [[ "$VPS_HOST" =~ ^[0-9a-zA-Z.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]{1,30}$ && "$VPS_USER" != root ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -d -m 0700 "$RUNNER_TEMP/v6-flag"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/v6-flag/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/v6-flag/known_hosts"
          chmod 0600 "$RUNNER_TEMP/v6-flag/"*
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/v6-flag/known_hosts" >/dev/null
      - name: Stage exactly one shell-reviewed Python script, no modules
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v6-flag/known_hosts" -o ConnectTimeout=15)
          dest="$VPS_USER@$VPS_HOST"
          target="serviceit/staging/v6-flag-$GITHUB_RUN_ID"
          sha256sum ops/serviceit_vps_b2b_v6_flag_only.py | cut -d ' ' -f 1 > "$RUNNER_TEMP/v6-flag/script-sha"
          ssh -T -i "$RUNNER_TEMP/v6-flag/id" "${opts[@]}" "$dest" \
            "umask 077; install -d -m 0700 '$target'"
          scp -i "$RUNNER_TEMP/v6-flag/id" "${opts[@]}" \
            ops/serviceit_vps_b2b_v6_flag_only.py "$dest:$target/activate.py"
      - name: Apply one Compose flag with fail-closed preflight and rollback
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes
                -o UserKnownHostsFile="$RUNNER_TEMP/v6-flag/known_hosts" -o ConnectTimeout=15)
          expected="$(cat "$RUNNER_TEMP/v6-expected")"
          scriptsha="$(cat "$RUNNER_TEMP/v6-flag/script-sha")"
          [[ "$scriptsha" =~ ^[a-f0-9]{64}$ && "$expected" =~ ^[a-f0-9]{64}$ ]]
          set +e
          ssh -T -i "$RUNNER_TEMP/v6-flag/id" "${opts[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$GITHUB_RUN_ID' '$scriptsha' '$expected'" \
            > "$RUNNER_TEMP/v6-flag/status" <<'REMOTE'
          set -euo pipefail
          runid="$1"; scriptsha="$2"; expected="$3"
          [[ "$runid" =~ ^[0-9]{7,16}$ && "$scriptsha" =~ ^[a-f0-9]{64}$ && "$expected" =~ ^[a-f0-9]{64}$ ]]
          script="$HOME/serviceit/staging/v6-flag-$runid/activate.py"
          [[ -f "$script" && ! -L "$script" ]]
          printf '%s  %s\n' "$scriptsha" "$script" | sha256sum --check --status
          python3 "$script" "$expected"
          REMOTE
          remote_rc=$?
          set -e
          safe="$(grep -E '^B2B_V6_[A-Z0-9_]+=(YES|NO|FAILED|NOT_NEEDED)$' "$RUNNER_TEMP/v6-flag/status" 2>/dev/null | head -30 || true)"
          if [[ -n "$safe" ]]; then
            printf '%s\n' "$safe"
          else
            echo 'B2B_V6_SAFE_STATUS_ABSENT=YES'
          fi
          [[ "$remote_rc" == "0" ]]
          grep -qx 'B2B_V6_FLAG_ACTIVATED=YES' "$RUNNER_TEMP/v6-flag/status"
      - name: Write sanitized outcome to project issue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/v6-flag/status"
          safe="$(grep -E '^B2B_V6_[A-Z0-9_]+=(YES|NO|FAILED|NOT_NEEDED|READY_FOR_FIVE_MINUTE_WORKER)$' "$file" 2>/dev/null | head -35 || true)"
          [[ -n "$safe" ]] || safe='B2B_V6_VPS_ACTIVATION_UNVERIFIED=YES'
          body="$(printf 'V6 code already installed: one extra Brave flag-only activation:\n\n%s\n\nRun https://github.com/%s/actions/runs/%s\n\nOnly core container, no source or auxiliary restarts. No CRM data or secrets in logs. Check actual 9-field Bitrix readback separately.' "$safe" "$REPO" "$GITHUB_RUN_ID")"
          gh api "repos/$REPO/issues/368/comments" -X POST --raw-field "body=$body" >/dev/null || true
